<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeekBrain AI Assistant — G10</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --surface-dark: #181715;
            --surface-dark-elevated: #252320;
            --surface-dark-soft: #1f1e1b;
            --primary: #cc785c;
            --primary-active: #a9583e;
            --primary-disabled: #e6dfd8;
            --on-dark: #faf9f5;
            --on-dark-soft: #a09d96;
            --muted: #6c6a64;
            --muted-soft: #8e8b82;
            --hairline: #3a3835;
            --canvas: #faf9f5;
            --accent-teal: #5db8a6;
            --accent-amber: #e8a55a;
            --success: #5db872;
            --warning: #d4a017;
            --error: #c64545;
            --info: #7eb8e0;
            --purple: #b391d4;
            --sidebar-width: 260px;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-display: 'Cormorant Garamond', 'Times New Roman', serif;
            --font-code: 'JetBrains Mono', ui-monospace, monospace;
            --rounded-sm: 6px;
            --rounded-md: 8px;
            --rounded-lg: 12px;
            --rounded-xl: 16px;
        }

        body {
            font-family: var(--font-body);
            background: var(--surface-dark);
            color: var(--on-dark);
            height: 100vh;
            display: flex;
            overflow: hidden;
            font-size: 14px;
            line-height: 1.55;
        }

        /* Markdown Rendering */
        .message-content h1,.message-content h2,.message-content h3{margin:12px 0 8px;color:var(--on-dark);font-weight:600}
        .message-content h1{font-size:1.15rem}.message-content h2{font-size:1.02rem}.message-content h3{font-size:0.92rem}
        .message-content ul,.message-content ol{margin:8px 0;padding-left:20px}
        .message-content li{margin-bottom:4px;line-height:1.55}
        .message-content code{background:var(--surface-dark);padding:2px 6px;border-radius:4px;font-size:0.82em;color:var(--accent-amber);font-family:var(--font-code)}
        .message-content pre{background:var(--surface-dark);border:1px solid var(--hairline);border-radius:var(--rounded-md);padding:12px;overflow-x:auto;margin:8px 0;font-size:0.78rem;line-height:1.5;font-family:var(--font-code)}
        .message-content pre code{background:none;padding:0;color:var(--on-dark-soft)}
        .message-content table{border-collapse:collapse;width:100%;margin:8px 0;font-size:0.82rem}
        .message-content th,.message-content td{border:1px solid var(--hairline);padding:6px 10px;text-align:left}
        .message-content th{background:var(--surface-dark-elevated);font-weight:600;color:var(--on-dark)}
        .message-content td{color:var(--on-dark-soft)}
        .message-content blockquote{border-left:3px solid var(--primary);padding-left:12px;margin:8px 0;color:var(--on-dark-soft);font-style:italic}
        .message-content strong{color:var(--on-dark)}
        .message-content a{color:var(--primary);text-decoration:none}
        .message-content a:hover{text-decoration:underline}
        .message-content p{margin-bottom:8px}.message-content p:last-child{margin-bottom:0}
        .message-content hr{border:none;border-top:1px solid var(--hairline);margin:12px 0}

        .streaming-cursor::after{content:'';display:inline-block;width:2px;height:1em;background:var(--primary);margin-left:2px;vertical-align:text-bottom;animation:cursorBlink .7s infinite}
        @keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}

        /* Sidebar */
        .sidebar{width:var(--sidebar-width);background:var(--surface-dark-elevated);border-right:1px solid var(--hairline);display:flex;flex-direction:column;flex-shrink:0}
        .sidebar-header{padding:16px;border-bottom:1px solid var(--hairline)}
        .new-chat-btn{width:100%;padding:10px 16px;background:var(--primary);color:var(--canvas);border:none;border-radius:var(--rounded-md);font-size:0.82rem;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s;font-family:var(--font-body)}
        .new-chat-btn:hover{background:var(--primary-active)}
        .sidebar-list{flex:1;overflow-y:auto;padding:8px}
        .sidebar-list::-webkit-scrollbar{width:4px}.sidebar-list::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:2px}
        .chat-item{padding:10px 12px;border-radius:var(--rounded-md);cursor:pointer;margin-bottom:4px;transition:all .2s;display:flex;align-items:center;justify-content:space-between;gap:8px}
        .chat-item:hover{background:var(--surface-dark-soft)}
        .chat-item.active{background:var(--surface-dark-soft);border:1px solid var(--hairline)}
        .chat-item-text{flex:1;min-width:0}
        .chat-item-title{font-size:0.8rem;color:var(--on-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .chat-item-date{font-size:0.65rem;color:var(--muted);margin-top:2px}
        .chat-item-delete{opacity:0;background:none;border:none;color:var(--error);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px}
        .chat-item:hover .chat-item-delete{opacity:1}
        .sidebar-footer{padding:12px 16px;border-top:1px solid var(--hairline);font-size:0.7rem;color:var(--muted);text-align:center}

        /* Main Content */
        .main-content{flex:1;display:flex;flex-direction:column;min-width:0}
        .header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--surface-dark-elevated);border-bottom:1px solid var(--hairline);flex-shrink:0}
        .header-left{display:flex;align-items:center;gap:12px}
        .header-logo{width:36px;height:36px;background:var(--primary);border-radius:var(--rounded-md);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:var(--canvas);font-family:var(--font-body)}
        .header-title h1{font-size:1rem;font-weight:500;font-family:var(--font-display);letter-spacing:-0.3px;font-size:1.15rem}
        .header-title p{font-size:0.72rem;color:var(--on-dark-soft)}
        .header-right{display:flex;align-items:center;gap:10px}
        .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--rounded-md);font-size:0.7rem;font-weight:500;background:var(--surface-dark-soft);border:1px solid var(--hairline);color:var(--on-dark-soft)}
        .badge-model{color:var(--primary);border-color:rgba(204,120,92,0.3)}
        .badge-status{color:var(--success);border-color:rgba(93,184,114,0.3)}
        .badge-status::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--success);animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
        .toggle-btn{background:var(--surface-dark-soft);border:1px solid var(--hairline);color:var(--on-dark-soft);padding:6px 12px;border-radius:var(--rounded-md);cursor:pointer;font-size:0.72rem;font-weight:500;transition:all .2s;font-family:var(--font-body)}
        .toggle-btn:hover{border-color:var(--primary);color:var(--primary)}
        .toggle-btn.active{border-color:var(--primary);color:var(--primary);background:rgba(204,120,92,0.08)}

        /* Chat Layout */
        .chat-container{display:flex;flex:1;overflow:hidden}
        .chat-area{flex:1;display:flex;flex-direction:column;min-width:0}
        .messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
        .messages::-webkit-scrollbar{width:6px}.messages::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:3px}
        .message{display:flex;gap:10px;max-width:80%;animation:fadeIn .3s ease}
        @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
        .message.user{align-self:flex-end;flex-direction:row-reverse}.message.ai{align-self:flex-start}
        .message-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;font-weight:500}
        .message.user .message-avatar{background:rgba(204,120,92,0.15);color:var(--primary)}
        .message.ai .message-avatar{background:rgba(93,184,166,0.12);color:var(--accent-teal)}
        .message-content{background:var(--surface-dark-elevated);border:1px solid var(--hairline);border-radius:var(--rounded-lg);padding:12px 16px;line-height:1.6;font-size:0.88rem;color:var(--on-dark-soft)}
        .message.user .message-content{background:rgba(204,120,92,0.08);border-color:rgba(204,120,92,0.2);color:var(--on-dark)}

        /* Typing Indicator */
        .typing-indicator{display:none;align-self:flex-start;padding:12px 16px;background:var(--surface-dark-elevated);border:1px solid var(--hairline);border-radius:var(--rounded-lg);gap:8px;align-items:center}
        .typing-indicator.show{display:flex}
        .typing-dots{display:flex;gap:4px}
        .typing-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:typingBounce 1.4s infinite}
        .typing-dot:nth-child(2){animation-delay:.2s}.typing-dot:nth-child(3){animation-delay:.4s}
        @keyframes typingBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
        .typing-timer{font-size:0.68rem;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}

        /* Input Area */
        .input-area{padding:16px 20px;background:var(--surface-dark-elevated);border-top:1px solid var(--hairline);flex-shrink:0}
        .input-wrapper{display:flex;gap:10px;align-items:flex-end}
        .input-field{flex:1;background:var(--surface-dark-soft);border:1px solid var(--hairline);border-radius:var(--rounded-md);padding:12px 16px;color:var(--on-dark);font-size:0.88rem;resize:none;outline:none;min-height:44px;max-height:120px;line-height:1.4;font-family:var(--font-body);transition:border-color .2s}
        .input-field:focus{border-color:var(--primary)}.input-field::placeholder{color:var(--muted)}
        .send-btn{width:44px;height:44px;border-radius:var(--rounded-md);background:var(--primary);border:none;color:var(--canvas);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
        .send-btn:hover{background:var(--primary-active)}.send-btn:disabled{opacity:.4;cursor:not-allowed}
        .send-btn svg{width:18px;height:18px}

        /* Right Panel (Trace & Questions) */
        .right-panel{width:420px;background:var(--surface-dark-elevated);border-left:1px solid var(--hairline);display:none;flex-direction:column;overflow:hidden;flex-shrink:0;min-height:0}
        .right-panel.show{display:flex}
        .panel-header{padding:14px 16px;border-bottom:1px solid var(--hairline);font-size:0.82rem;font-weight:500;display:flex;align-items:center;gap:8px;flex-shrink:0}
        .panel-content{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:0}
        .panel-content::-webkit-scrollbar{width:5px}.panel-content::-webkit-scrollbar-track{background:var(--surface-dark)}.panel-content::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:3px}

        /* Trace Panel */
        .trace-header{color:var(--purple)}
        .trace-timing{padding:10px 14px;font-size:0.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;background:var(--surface-dark-soft);border:1px solid var(--hairline);border-radius:var(--rounded-md);flex-shrink:0}
        .trace-timing strong{color:var(--info)}
        .trace-connector{width:2px;height:10px;background:var(--hairline);margin-left:20px;flex-shrink:0}
        .trace-step{background:var(--surface-dark-soft);border:1px solid var(--hairline);border-radius:var(--rounded-md);overflow:visible;flex-shrink:0}
        .trace-step-header{padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:0.78rem;font-weight:500;background:var(--surface-dark);border-radius:var(--rounded-md) var(--rounded-md) 0 0;cursor:pointer;user-select:none;transition:background .15s}
        .trace-step-header:hover{background:rgba(255,255,255,0.03)}
        .trace-step-icon{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
        .trace-step-label{flex:1}
        .trace-step-toggle{color:var(--muted);font-size:10px;transition:transform .2s}
        .trace-step.reasoning .trace-step-icon{background:rgba(179,145,212,0.15);color:var(--purple)}
        .trace-step.reasoning .trace-step-header{color:var(--purple)}
        .trace-step.retrieval .trace-step-icon{background:rgba(93,184,166,0.12);color:var(--accent-teal)}
        .trace-step.retrieval .trace-step-header{color:var(--accent-teal)}
        .trace-step.tool_call .trace-step-icon{background:rgba(232,165,90,0.12);color:var(--accent-amber)}
        .trace-step.tool_call .trace-step-header{color:var(--accent-amber)}
        .trace-step.tool_result .trace-step-icon{background:rgba(93,184,114,0.12);color:var(--success)}
        .trace-step.tool_result .trace-step-header{color:var(--success)}
        .trace-step.synthesis .trace-step-icon{background:rgba(204,120,92,0.12);color:var(--primary)}
        .trace-step.synthesis .trace-step-header{color:var(--primary)}
        .trace-step.generation .trace-step-icon{background:rgba(126,184,224,0.12);color:var(--info)}
        .trace-step.generation .trace-step-header{color:var(--info)}
        .trace-step-body{padding:12px 14px;font-size:0.75rem;line-height:1.6;color:var(--on-dark-soft);border-top:1px solid var(--hairline)}
        .trace-step-body pre{background:var(--surface-dark);padding:10px;border-radius:var(--rounded-sm);overflow:auto;max-height:180px;font-size:0.7rem;white-space:pre-wrap;word-break:break-word;color:var(--muted-soft);margin-top:6px;border:1px solid var(--hairline);font-family:var(--font-code)}
        .trace-step-body .trace-label{font-size:0.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;margin-top:8px}
        .trace-step-body .trace-label:first-child{margin-top:0}
        .trace-label.input-label{color:var(--accent-amber)}
        .trace-label.output-label{color:var(--success)}
        .trace-label.thought-label{color:var(--purple)}
        .trace-label.synthesis-label{color:var(--primary)}
        .trace-flow-arrow{display:flex;align-items:center;gap:6px;font-size:0.7rem;color:var(--muted);padding:4px 0;margin-top:6px}
        .trace-flow-arrow svg{width:14px;height:14px;color:var(--primary)}
        .trace-expand-btn{display:inline-block;margin-top:6px;padding:4px 10px;font-size:0.68rem;font-weight:500;color:var(--primary);background:rgba(204,120,92,0.08);border:1px solid rgba(204,120,92,0.25);border-radius:var(--rounded-sm);cursor:pointer;transition:all .2s;font-family:var(--font-body)}
        .trace-expand-btn:hover{background:rgba(204,120,92,0.15);border-color:var(--primary)}
        .trace-pre-full{display:none;margin-top:6px;max-height:400px;overflow:auto;background:var(--surface-dark);padding:10px;border-radius:var(--rounded-sm);font-size:0.7rem;white-space:pre-wrap;word-break:break-word;color:var(--muted-soft);border:1px solid var(--hairline);font-family:var(--font-code)}
        .trace-pre-full.show{display:block}


        /* Questions Panel */
        .questions-header{color:var(--accent-amber)}
        .q-tabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--hairline);flex-shrink:0;overflow-x:auto}
        .q-tab{padding:5px 10px;border-radius:var(--rounded-sm);font-size:0.72rem;font-weight:500;cursor:pointer;background:var(--surface-dark-soft);border:1px solid var(--hairline);color:var(--muted);transition:all .2s;white-space:nowrap}
        .q-tab:hover{border-color:var(--primary);color:var(--primary)}
        .q-tab.active{background:rgba(204,120,92,0.1);border-color:var(--primary);color:var(--primary)}
        .q-tab .q-count{font-size:0.62rem;opacity:.7;margin-left:3px}
        .q-list{padding:4px 0}
        .q-item{padding:8px 12px;border-radius:var(--rounded-sm);cursor:pointer;font-size:0.78rem;color:var(--on-dark-soft);line-height:1.4;transition:all .2s;margin-bottom:2px}
        .q-item:hover{background:var(--surface-dark-soft);color:var(--on-dark)}
        .q-item-id{font-size:0.62rem;color:var(--muted);font-weight:500;margin-bottom:2px}
        .q-conv-title{font-size:0.78rem;font-weight:500;color:var(--primary);padding:8px 12px;margin-top:8px}
        .q-turn{padding:6px 12px;margin-left:12px;border-left:2px solid var(--hairline);font-size:0.75rem;color:var(--on-dark-soft);cursor:pointer;margin-bottom:4px;transition:all .2s}
        .q-turn:hover{border-color:var(--primary);color:var(--on-dark);background:var(--surface-dark-soft)}
        .q-turn-num{font-size:0.62rem;color:var(--muted)}

        /* Example buttons */
        .example-btn{padding:8px 14px;background:var(--surface-dark-soft);border:1px solid var(--hairline);border-radius:var(--rounded-md);color:var(--on-dark-soft);font-size:0.78rem;cursor:pointer;transition:all .2s;font-family:var(--font-body)}
        .example-btn:hover{border-color:var(--primary);color:var(--primary)}

        @media(max-width:900px){.sidebar{display:none}.right-panel{display:none!important}.message{max-width:95%}}
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="newChat()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                New Chat
            </button>
        </div>
        <div class="sidebar-list" id="sidebarList"></div>
        <div class="sidebar-footer">G10 — GeekBrain AI</div>
    </div>

    <div class="main-content">
        <div class="header">
            <div class="header-left">
                <div class="header-logo">GB</div>
                <div class="header-title">
                    <h1>GeekBrain AI Assistant</h1>
                    <p>Group 10</p>
                </div>
            </div>
            <div class="header-right">
                <span class="badge badge-model">Claude Opus 4.6</span>
                <span class="badge badge-model">n8n + Bedrock</span>
                <span class="badge badge-status">Connected</span>
                <button class="toggle-btn" id="toggleQuestions" onclick="togglePanel('questions')">Questions</button>
                <button class="toggle-btn" id="toggleTrace" onclick="togglePanel('trace')">Trace</button>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-area">
                <div class="messages" id="messages">
                    <div class="typing-indicator" id="typing">
                        <div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>
                        <span class="typing-timer" id="typingTimer"></span>
                    </div>
                </div>
                <div class="input-area">
                    <div class="input-wrapper">
                        <textarea class="input-field" id="userInput" placeholder="Ask a question about GeekBrain..." rows="1" onkeydown="handleKey(event)"></textarea>
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Trace Panel -->
            <div class="right-panel" id="tracePanel">
                <div class="panel-header trace-header">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
                    Pipeline Trace
                </div>
                <div class="panel-content" id="traceContent">
                    <div class="trace-timing">Send a message to see trace.</div>
                </div>
            </div>

            <!-- Questions Panel -->
            <div class="right-panel" id="questionsPanel">
                <div class="panel-header questions-header">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3M12 17h.01"/></svg>
                    Question Bank
                </div>
                <div class="q-tabs" id="qTabs"></div>
                <div class="panel-content" id="questionsContent"></div>
            </div>
        </div>
    </div>

<script>
const WEBHOOK_URL = 'https://n8n.duckq1linux.id.vn/webhook/51e3540e-c4cc-4e94-8da7-5a4c77b7cc4a/chat';
const WELCOME_MSG = "Hi there! I'm GeekBrain Agent. May I help you today?";
const STREAM_DELAY = 28;

// === QUESTIONS DATA ===
const QUESTIONS = {
    L1: {questions:[
        {id:"L1-01",question:"What is the current API rate limit for PaymentGW?"},
        {id:"L1-02",question:"Who leads Team Platform and what services do they own?"},
        {id:"L1-03",question:"What was the root cause of the March 5, 2026 PaymentGW outage?"},
        {id:"L1-04",question:"What is GeekBrain's data retention policy for transaction logs?"},
        {id:"L1-05",question:"What are GeekBrain's production deployment windows?"},
        {id:"L1-06",question:"What authentication method does the PaymentGW API use?"},
        {id:"L1-07",question:"What message queue does NotificationSvc use?"},
        {id:"L1-08",question:"After the March 5 PaymentGW incident, a circuit breaker review was scheduled. What was the deadline?"},
        {id:"L1-09",question:"What programming language is AuthSvc written in?"},
        {id:"L1-10",question:"How often does GeekBrain rotate JWT signing keys?"}
    ]},
    L2: {questions:[
        {id:"L2-01",question:"What is PaymentGW's API rate limit?"},
        {id:"L2-02",question:"If Team Commerce discovers a P1 bug in OrderSvc at 21:00 on a Friday, can they deploy a fix? What is the process?"},

function parseTraceSteps(data) {
    const steps = [];
    const finalOutput = data.final_output || {};

    if (finalOutput.intermediateSteps && finalOutput.intermediateSteps.length > 0) {
        finalOutput.intermediateSteps.forEach(step => {
            // Step 1: LLM Reasoning - why the agent chose this tool
            if (step.action && step.action.log) {
                steps.push({type:'reasoning', html:
                    `<div class="trace-label thought-label">Agent Thought Process</div>
                    <p>${esc(step.action.log)}</p>`
                });
            }

            // Step 2: Tool Call - what was called with what input
            if (step.action && step.action.tool) {
                const input = typeof step.action.toolInput === 'string' ? step.action.toolInput : JSON.stringify(step.action.toolInput, null, 2);
                steps.push({type:'tool_call', html:
                    `<div class="trace-label input-label">Tool: ${esc(step.action.tool)}</div>
                    <pre>${esc(input)}</pre>`
                });
            }

            // Step 3: Tool Result - raw output from tool
            if (step.observation) {
                const output = typeof step.observation === 'string' ? step.observation : JSON.stringify(step.observation, null, 2);
                let parsedPreview = output;
                let fullData = output;
                let isTruncated = false;
                try {
                    const parsed = JSON.parse(output);
                    if (Array.isArray(parsed) && parsed[0] && parsed[0].results) {
                        const results = parsed[0].results;
                        parsedPreview = `${results.length} document(s) retrieved:\n` +
                            results.slice(0,5).map((r,i) => `  ${i+1}. [score: ${r.score?.toFixed(2)||'N/A'}] ${r.payload?.cite || 'unknown source'}`).join('\n');
                        if (results.length > 5) {
                            parsedPreview += `\n  ... and ${results.length-5} more`;
                            isTruncated = true;
                            fullData = `${results.length} document(s) retrieved:\n` +
                                results.map((r,i) => `  ${i+1}. [score: ${r.score?.toFixed(2)||'N/A'}] ${r.payload?.cite || 'unknown source'}`).join('\n');
                        }
                    }
                } catch{}

                const uid = 'tr_' + Math.random().toString(36).substr(2,8);
                const expandHtml = isTruncated ? `<span class="trace-expand-btn" onclick="toggleExpand('${uid}')">Show all</span><pre class="trace-pre-full" id="${uid}">${esc(fullData)}</pre>` : '';
                steps.push({type:'tool_result', html:
                    `<div class="trace-label output-label">Tool Output</div>
                    <pre>${esc(parsedPreview)}</pre>${expandHtml}`
                });
            }
        });

        // Step 4: Synthesis - show combined tool outputs that were sent to LLM
        if (steps.length > 0) {
            const toolResultsFull = finalOutput.intermediateSteps
                .filter(s => s.observation)
                .map((s, i) => {
                    const toolName = s.action ? s.action.tool : `Tool ${i+1}`;
                    const obs = typeof s.observation === 'string' ? s.observation : JSON.stringify(s.observation, null, 2);
                    return `[${toolName}]:\n${obs}`;
                });
            const toolResultsPreview = finalOutput.intermediateSteps
                .filter(s => s.observation)
                .map((s, i) => {
                    const toolName = s.action ? s.action.tool : `Tool ${i+1}`;
                    const obs = typeof s.observation === 'string' ? s.observation : JSON.stringify(s.observation, null, 2);
                    let preview = obs;
                    try {
                        const parsed = JSON.parse(obs);
                        if (Array.isArray(parsed) && parsed[0] && parsed[0].results) {
                            const results = parsed[0].results;
                            preview = results.slice(0,3).map(r => r.payload?.text?.substring(0,150)||'').join('\n---\n');
                            if (results.length > 3) preview += `\n... (+${results.length-3} more chunks)`;
                        } else {
                            preview = obs.substring(0, 600);
                            if (obs.length > 600) preview += '\n...';
                        }
                    } catch{ preview = obs.substring(0, 600); if (obs.length > 600) preview += '\n...'; }
                    return `[${toolName}]:\n${preview}`;
                });

            const combinedPreview = toolResultsPreview.join('\n\n');
            const combinedFull = toolResultsFull.join('\n\n');
            const isTruncated = combinedFull.length > combinedPreview.length;
            const uid = 'syn_' + Math.random().toString(36).substr(2,8);
            const expandHtml = isTruncated ? `<span class="trace-expand-btn" onclick="toggleExpand('${uid}')">Show full data</span><pre class="trace-pre-full" id="${uid}">${esc(combinedFull)}</pre>` : '';

            steps.push({type:'synthesis', html:
                `<div class="trace-label synthesis-label">Combined context sent to LLM (${toolResultsFull.length} tool output(s))</div>
                <pre>${esc(combinedPreview)}</pre>${expandHtml}`
            });
        }
    }

    // Check for sources/retrieval in final output
    if (finalOutput.sources || finalOutput.sourceDocuments) {
        const sources = finalOutput.sources || finalOutput.sourceDocuments || [];
        const sourceList = Array.isArray(sources) ? sources.map(s => typeof s === 'string' ? s : (s.metadata?.source || s.pageContent?.substring(0,100) || JSON.stringify(s))).join('\n') : String(sources);
        steps.unshift({type:'retrieval', html:
            `<div class="trace-label output-label">Sources Retrieved</div>
            <pre>${esc(sourceList)}</pre>`
        });
    }

    // Fallback: parse from output text if no structured trace
    if (steps.length === 0 && data.output) {
        const sourcesMatch = data.output.match(/\*?\*?Sources?\s*Cited:?\*?\*?\s*([^\n]+(?:\n[^\n*#]+)*)/i);
        if (sourcesMatch) {
            steps.push({type:'retrieval', html:
                `<div class="trace-label output-label">Sources Cited (from output)</div>
                <pre>${esc(sourcesMatch[1].trim())}</pre>`
            });
        }

        const toolPatterns = [
            {regex:/queried?\s+(?:the\s+)?database/i, tool:'PostgreSQL'},
            {regex:/called?\s+(?:the\s+)?(?:monitoring|metrics)\s*(?:api|tool)/i, tool:'Monitoring API'},
            {regex:/SELECT\s+/i, tool:'PostgreSQL (SQL detected)'},
            {regex:/\/metrics\/|\/status\/|\/services/i, tool:'HTTP API'}
        ];
        for (const p of toolPatterns) {
            if (p.regex.test(data.output)) {
                steps.push({type:'reasoning', html:
                    `<div class="trace-label thought-label">Agent Decision</div>
                    <p>AI Agent determined this question requires <strong>${p.tool}</strong> to answer.</p>`
                });
                break;
            }
        }

        if (steps.length === 0) {
            steps.push({type:'reasoning', html:
                `<div class="trace-label thought-label">Agent Decision</div>
                <p>AI Agent processed the query using available knowledge and tools.</p>`
            });
        }
    }

    // Always add final output step
    if (data.output) {
        const charCount = data.output.length;
        const preview = charCount > 200 ? data.output.substring(0,200)+'...' : data.output;
        const isTruncated = charCount > 200;
        const uid = 'fo_' + Math.random().toString(36).substr(2,8);
        const expandHtml = isTruncated ? `<span class="trace-expand-btn" onclick="toggleExpand('${uid}')">Show all</span><pre class="trace-pre-full" id="${uid}">${esc(data.output)}</pre>` : '';
        steps.push({type:'generation', html:
            `<div class="trace-label output-label">Final Answer (${charCount} chars)</div>
            <pre>${esc(preview)}</pre>${expandHtml}`
        });
    }

    return steps;
}

function simulateStreaming(div, fullText) {
    return new Promise((resolve) => {
        const words = fullText.split(/(\s+)/);
        let currentIndex = 0;
        let displayed = '';
        const contentEl = div.querySelector('.message-content');

        function appendNext() {
            if (currentIndex >= words.length) {
                contentEl.innerHTML = formatMessage(fullText);
                contentEl.classList.remove('streaming-cursor');
                resolve();
                return;
            }
            displayed += words[currentIndex];
            currentIndex++;
            contentEl.innerHTML = '<span class="stream-text">' + escapeHtml(displayed) + '</span>';
            contentEl.classList.add('streaming-cursor');
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;

            const delay = words[currentIndex-1].trim() === '' ? 5 : STREAM_DELAY;
            setTimeout(appendNext, delay);
        }
        appendNext();
    });
}

function finalizeStreamingBubble(div,content){
    const c=div.querySelector('.message-content');c.innerHTML=formatMessage(content);c.classList.remove('streaming-cursor');
}

// === SEND MESSAGE ===
function parseResponseText(rawText) {
    let fullContent = '', finalOutput = null;

    // Try as single JSON first
    try {
        const json = JSON.parse(rawText);
        if (json.output) { fullContent = json.output; finalOutput = json; }
        else if (json.text) { fullContent = json.text; finalOutput = json; }
        else if (typeof json === 'string') { fullContent = json; }
        else { fullContent = JSON.stringify(json); finalOutput = json; }
        return { fullContent, finalOutput };
    } catch(e) {}

    // Try as newline-delimited JSON (streaming format)
    const lines = rawText.split('\n');
    for (const line of lines) {
        if (!line.trim()) continue;
        try {
            const ev = JSON.parse(line);
            if (ev.type === 'item' && ev.content) {
                const nn = ev.metadata && ev.metadata.nodeName;
                if (nn === 'Respond to Webhook') {
                    try { finalOutput = JSON.parse(ev.content); } catch { finalOutput = { output: ev.content }; }
                } else {
                    fullContent += ev.content;
                }
            } else if (ev.output) {
                fullContent = ev.output; finalOutput = ev;
            }
        } catch {}
    }

    // Try as concatenated JSON objects (no newline separator)
    if (!fullContent && !finalOutput) {
        const jsonObjects = [];
        let depth = 0, start = -1;
        for (let i = 0; i < rawText.length; i++) {
            if (rawText[i] === '{') { if (depth === 0) start = i; depth++; }
            else if (rawText[i] === '}') { depth--; if (depth === 0 && start !== -1) { jsonObjects.push(rawText.substring(start, i + 1)); start = -1; } }
        }
        for (const obj of jsonObjects) {
            try {
                const parsed = JSON.parse(obj);
                if (parsed.output) { fullContent = parsed.output; finalOutput = parsed; break; }
                else if (parsed.text) { fullContent = parsed.text; finalOutput = parsed; break; }
            } catch {}
        }
    }

    // Last resort: treat as plain text
    if (!fullContent && !finalOutput) { fullContent = rawText; }

    return { fullContent, finalOutput };
}

async function sendMessage(){
    if(isSending)return;const input=document.getElementById('userInput');const text=input.value.trim();if(!text)return;
    const chat=getCurrentChat();if(!chat)return;
    isSending=true;input.value='';autoResize(input);document.getElementById('sendBtn').disabled=true;
    if(chat.messages.length<=1)chat.title=text.length>40?text.substring(0,40)+'...':text;
    chat.messages.push({role:'user',content:text});addMessageToDOM('user',text);saveChats();renderSidebar();
    showTyping();const startTime=Date.now();

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 180000);

    try{
        const response=await fetch(WEBHOOK_URL,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({chatInput:text,sessionId:chat.sessionId}),
            signal: controller.signal
        });
        clearTimeout(timeoutId);
        hideTyping();

        const rawText = await response.text();
        const { fullContent, finalOutput } = parseResponseText(rawText);

        const elapsed=Date.now()-startTime;
        const answer=fullContent||(finalOutput&&finalOutput.output)||'(No response)';

        // Simulate streaming with typewriter effect
        const msgDiv=createStreamingBubble();
        await simulateStreaming(msgDiv, answer);

        chat.messages.push({role:'ai',content:answer});saveChats();
        updateTracePanel({_timing:elapsed,output:answer,final_output:finalOutput,question:text});
    }catch(error){
        clearTimeout(timeoutId);
        hideTyping();
        let errorMsg;
        if (error.name === 'AbortError') errorMsg = 'Request timed out (3 minutes). Try a simpler question.';
        else if (error.message.includes('Failed to fetch')) errorMsg = 'Cannot reach n8n server.';
        else errorMsg = error.message;
        addMessageToDOM('ai','Error: '+errorMsg);chat.messages.push({role:'ai',content:'Error: '+errorMsg});saveChats();
        updateTracePanel({error:errorMsg,_timing:Date.now()-startTime,question:text});
    }
    document.getElementById('sendBtn').disabled=false;isSending=false;input.focus();
}

// === INIT ===
loadChats();
if(!currentChatId||!chats[currentChatId])newChat(); else{renderSidebar();renderMessages();restoreTrace();}
renderQTabs();renderQContent();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Domain 1 — Cloud Concepts | CLF-C02 Quiz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }

    header {
      background: linear-gradient(135deg, #1a1f2e, #232b3e);
      border-bottom: 2px solid #ff9900;
      padding: 24px 32px;
      display: flex; align-items: center; gap: 16px;
    }
    .aws-badge {
      background: #ff9900; color: #000; font-weight: 800;
      padding: 6px 14px; border-radius: 6px; font-size: 13px; letter-spacing: 1px;
    }
    header h1 { font-size: 22px; font-weight: 700; }
    header p { font-size: 13px; color: #94a3b8; margin-top: 2px; }

    .progress-bar-wrap { background: #1e2535; padding: 12px 32px; border-bottom: 1px solid #2d3748; }
    .progress-bar-track { background: #2d3748; border-radius: 99px; height: 8px; overflow: hidden; }
    .progress-bar-fill { background: #ff9900; height: 100%; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
    .progress-label { font-size: 12px; color: #64748b; margin-top: 6px; }

    main { max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; }

    .question-card {
      background: #1a1f2e; border: 1px solid #2d3748; border-radius: 12px;
      padding: 28px; margin-bottom: 24px; display: none;
    }
    .question-card.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .q-number { font-size: 12px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .q-tag { font-size: 11px; background: #1e3a5f; color: #60a5fa; padding: 3px 10px; border-radius: 99px; }

    .q-text { font-size: 17px; font-weight: 500; line-height: 1.6; margin-bottom: 24px; color: #f1f5f9; }

    .options { display: flex; flex-direction: column; gap: 10px; }
    .option {
      display: flex; align-items: flex-start; gap: 12px;
      background: #0f1117; border: 1.5px solid #2d3748; border-radius: 8px;
      padding: 14px 16px; cursor: pointer; transition: all 0.2s;
    }
    .option:hover:not(.disabled) { border-color: #ff9900; background: #1a1f2e; }
    .option.selected { border-color: #60a5fa; background: #1e3a5f; }
    .option.correct { border-color: #22c55e; background: #052e16; }
    .option.wrong { border-color: #ef4444; background: #2d0a0a; }
    .option.disabled { cursor: default; }

    .opt-letter {
      min-width: 28px; height: 28px; border-radius: 50%;
      background: #2d3748; display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #94a3b8; flex-shrink: 0;
    }
    .option.correct .opt-letter { background: #22c55e; color: #fff; }
    .option.wrong .opt-letter { background: #ef4444; color: #fff; }
    .option.selected:not(.correct):not(.wrong) .opt-letter { background: #3b82f6; color: #fff; }

    .opt-text { font-size: 15px; line-height: 1.5; padding-top: 2px; }

    .explanation {
      margin-top: 20px; padding: 16px; background: #0d1f0d;
      border-left: 4px solid #22c55e; border-radius: 0 8px 8px 0;
      font-size: 14px; line-height: 1.6; color: #86efac; display: none;
    }
    .explanation.wrong-exp { background: #1a0a0a; border-color: #ef4444; color: #fca5a5; }
    .explanation.show { display: block; animation: fadeIn 0.3s ease; }

    .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; }
    .btn {
      padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; border: none; transition: all 0.2s;
    }
    .btn-primary { background: #ff9900; color: #000; }
    .btn-primary:hover { background: #e68900; }
    .btn-secondary { background: #2d3748; color: #e2e8f0; }
    .btn-secondary:hover { background: #374151; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Results */
    #results {
      display: none; text-align: center;
      background: #1a1f2e; border: 1px solid #2d3748; border-radius: 16px; padding: 48px 32px;
    }
    .score-circle {
      width: 140px; height: 140px; border-radius: 50%;
      border: 6px solid #ff9900; display: flex; flex-direction: column;
      align-items: center; justify-content: center; margin: 0 auto 24px;
    }
    .score-num { font-size: 42px; font-weight: 800; color: #ff9900; }
    .score-label { font-size: 13px; color: #64748b; }
    #results h2 { font-size: 26px; margin-bottom: 8px; }
    #results p { color: #94a3b8; margin-bottom: 32px; }
    .result-stats { display: flex; gap: 24px; justify-content: center; margin-bottom: 32px; flex-wrap: wrap; }
    .stat-box { background: #0f1117; border: 1px solid #2d3748; border-radius: 10px; padding: 16px 24px; min-width: 120px; }
    .stat-box .val { font-size: 28px; font-weight: 700; }
    .stat-box .lbl { font-size: 12px; color: #64748b; margin-top: 4px; }
    .correct-val { color: #22c55e; }
    .wrong-val { color: #ef4444; }
    .pass { color: #22c55e; } .fail { color: #ef4444; }
  </style>
</head>
<body>

<header>
  <div class="aws-badge">CLF-C02</div>
  <div>
    <h1>Domain 1: Cloud Concepts</h1>
    <p>24% of scored content &nbsp;·&nbsp; 25 questions</p>
  </div>
</header>

<div class="progress-bar-wrap">
  <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">Question 1 of 25</div>
</div>

<main>
  <div id="quiz-container"></div>
  <div id="results">
    <div class="score-circle"><span class="score-num" id="scoreNum">0%</span><span class="score-label">Score</span></div>
    <h2 id="resultTitle"></h2>
    <p id="resultMsg"></p>
    <div class="result-stats">
      <div class="stat-box"><div class="val correct-val" id="correctCount">0</div><div class="lbl">Correct</div></div>
      <div class="stat-box"><div class="val wrong-val" id="wrongCount">0</div><div class="lbl">Incorrect</div></div>
      <div class="stat-box"><div class="val" id="totalCount">25</div><div class="lbl">Total</div></div>
    </div>
    <button class="btn btn-primary" onclick="restartQuiz()">🔄 Restart Quiz</button>
  </div>
</main>

<script>
const questions = [
  {
    tag: "Benefits of AWS Cloud",
    text: "Which of the following best describes the concept of 'trading fixed expense for variable expense' in cloud computing?",
    options: ["Paying a flat monthly fee regardless of usage","Paying only for the resources you consume instead of investing in data centers upfront","Buying Reserved Instances to reduce costs","Negotiating long-term contracts with AWS"],
    answer: 1,
    explanation: "Trading fixed expense (CapEx — buying servers upfront) for variable expense (OpEx — paying only for what you use) is one of the 6 key advantages of cloud computing."
  },
  {
    tag: "Benefits of AWS Cloud",
    text: "A company wants to deploy its application to serve users in Asia, Europe, and North America with low latency. Which AWS benefit does this best represent?",
    options: ["Elasticity","Economies of scale","Go global in minutes","Stop guessing capacity"],
    answer: 2,
    explanation: "'Go global in minutes' means you can deploy your application across multiple AWS Regions worldwide quickly, serving users with low latency regardless of their location."
  },
  {
    tag: "Benefits of AWS Cloud",
    text: "Which term describes the ability of a system to automatically add resources when demand increases and remove them when demand decreases?",
    options: ["High Availability","Fault Tolerance","Elasticity","Durability"],
    answer: 2,
    explanation: "Elasticity is the ability to automatically scale resources up (scale out) when load increases and scale down (scale in) when load decreases, such as with EC2 Auto Scaling Groups."
  },
  {
    tag: "Benefits of AWS Cloud",
    text: "What is the primary reason AWS can offer lower prices over time compared to on-premises infrastructure?",
    options: ["AWS uses cheaper hardware","AWS benefits from economies of scale by aggregating usage from millions of customers","AWS charges only for storage, not compute","AWS offers free tiers for all services"],
    answer: 1,
    explanation: "AWS aggregates demand from millions of customers, allowing it to purchase hardware at massive scale and pass the savings on to customers — this is economies of scale. AWS has reduced prices over 100 times since 2006."
  },
  {
    tag: "Well-Architected Framework",
    text: "A team wants to ensure their system can recover quickly from failures and continue to perform its intended function. Which pillar of the AWS Well-Architected Framework does this align with?",
    options: ["Security","Operational Excellence","Reliability","Performance Efficiency"],
    answer: 2,
    explanation: "Reliability focuses on ensuring a workload performs its intended function correctly and consistently, including the ability to recover from failures. Key practices include automatic recovery and testing recovery procedures."
  },
  {
    tag: "Well-Architected Framework",
    text: "Which Well-Architected Framework pillar focuses on using the right resources efficiently and going global in minutes?",
    options: ["Cost Optimization","Reliability","Sustainability","Performance Efficiency"],
    answer: 3,
    explanation: "Performance Efficiency focuses on using IT and cloud resources efficiently. Key practices include democratizing advanced technologies, going global in minutes, and using serverless architectures."
  },
  {
    tag: "Well-Architected Framework",
    text: "A company wants to minimize the environmental impact of its cloud workloads. Which pillar of the Well-Architected Framework should they focus on?",
    options: ["Cost Optimization","Sustainability","Operational Excellence","Reliability"],
    answer: 1,
    explanation: "Sustainability is the newest pillar (added in 2021) and focuses on minimizing the environmental impact of running cloud workloads, including maximizing utilization and using managed services."
  },
  {
    tag: "Well-Architected Framework",
    text: "Which AWS service is used to review your workloads against the Well-Architected Framework best practices?",
    options: ["AWS Trusted Advisor","AWS Config","AWS Well-Architected Tool","AWS Inspector"],
    answer: 2,
    explanation: "The AWS Well-Architected Tool is a free service in the AWS Console that helps you review your workloads against the 6 pillars and provides recommendations and best practices."
  },
  {
    tag: "Well-Architected Framework",
    text: "How many pillars does the AWS Well-Architected Framework consist of?",
    options: ["4","5","6","7"],
    answer: 2,
    explanation: "The AWS Well-Architected Framework has 6 pillars: Operational Excellence, Security, Reliability, Performance Efficiency, Cost Optimization, and Sustainability."
  },
  {
    tag: "Migration Strategies",
    text: "A company wants to move its on-premises application to AWS as quickly as possible with minimal changes. Which migration strategy should they use?",
    options: ["Refactor","Replatform","Rehost (Lift and Shift)","Repurchase"],
    answer: 2,
    explanation: "Rehost (Lift and Shift) means moving the application to AWS with no changes — it's the fastest migration strategy with the least effort, typically using EC2 to replicate the on-premises environment."
  },
  {
    tag: "Migration Strategies",
    text: "A company decides to replace its on-premises CRM system with Salesforce. Which migration strategy does this represent?",
    options: ["Rehost","Replatform","Retire","Repurchase (Drop and Shop)"],
    answer: 3,
    explanation: "Repurchase (Drop and Shop) means moving to a different product, typically a SaaS solution. Replacing an on-premises CRM with Salesforce is a classic example of this strategy."
  },
  {
    tag: "Migration Strategies",
    text: "Which AWS service is used to physically transfer petabytes of data to AWS when network bandwidth is insufficient?",
    options: ["AWS Direct Connect","AWS Snowball","AWS DataSync","AWS Transfer Family"],
    answer: 1,
    explanation: "AWS Snowball is a physical device used to transfer large amounts of data into AWS when network bandwidth is insufficient or too expensive. Snowmobile handles exabyte-scale transfers."
  },
  {
    tag: "Migration Strategies",
    text: "What are the correct phases of cloud migration in order?",
    options: ["Migrate → Assess → Mobilize","Assess → Migrate → Mobilize","Assess → Mobilize → Migrate & Modernize","Mobilize → Assess → Migrate"],
    answer: 2,
    explanation: "The three phases of cloud migration are: Assess (evaluate current state), Mobilize (detailed planning), and Migrate & Modernize (execute migration and optimize)."
  },
  {
    tag: "Migration Strategies",
    text: "Which perspective of the AWS Cloud Adoption Framework (CAF) focuses on bridging the gap between technology and business, and managing organizational change?",
    options: ["Business","Governance","People","Operations"],
    answer: 2,
    explanation: "The People perspective of AWS CAF serves as a bridge between technology and business, focusing on organizational change management, culture evolution, and workforce transformation."
  },
  {
    tag: "Cloud Economics",
    text: "Which term describes the upfront capital investment required to purchase and maintain physical infrastructure?",
    options: ["OpEx","Variable cost","CapEx","TCO"],
    answer: 2,
    explanation: "CapEx (Capital Expenditure) refers to upfront investments in physical assets like servers and data centers. Cloud computing shifts this to OpEx (Operational Expenditure) — paying for what you use."
  },
  {
    tag: "Cloud Economics",
    text: "A company has existing Windows Server licenses and wants to use them on AWS to reduce costs. Which EC2 purchasing option should they use?",
    options: ["Spot Instances","Reserved Instances","Dedicated Hosts","On-Demand Instances"],
    answer: 2,
    explanation: "Dedicated Hosts provide a physical server dedicated to your use, which is required for Bring Your Own License (BYOL) scenarios for software like Windows Server, SQL Server, and Oracle."
  },
  {
    tag: "Cloud Economics",
    text: "What is 'rightsizing' in the context of AWS cost optimization?",
    options: ["Purchasing the largest instance type available","Selecting the most appropriate instance type and size that matches actual workload requirements","Always using Reserved Instances","Using Spot Instances for all workloads"],
    answer: 1,
    explanation: "Rightsizing means selecting the correct instance type and size that matches your actual workload needs — avoiding over-provisioning (wasting money) and under-provisioning (hurting performance). Tools like AWS Trusted Advisor and Compute Optimizer help with this."
  },
  {
    tag: "Cloud Economics",
    text: "Which of the following is NOT a cost typically associated with running an on-premises data center?",
    options: ["Hardware purchase and maintenance","Facility costs (power, cooling)","Pay-per-use compute charges","Staff for operations and security"],
    answer: 2,
    explanation: "Pay-per-use compute charges are a cloud model concept. On-premises data centers require upfront hardware purchases, facility costs (power, cooling, space), and dedicated staff — all fixed costs regardless of usage."
  },
  {
    tag: "Cloud Economics",
    text: "A startup wants to experiment with a new application idea without large upfront costs. Which cloud benefit best supports this?",
    options: ["Economies of scale","Increase speed and agility","Stop spending money on data centers","Go global in minutes"],
    answer: 1,
    explanation: "Increased speed and agility means you can experiment quickly, fail fast, and iterate — deploying resources in minutes rather than weeks, with minimal upfront cost. This is ideal for startups testing new ideas."
  },
  {
    tag: "Cloud Economics",
    text: "Which AWS tool helps estimate the cost of AWS services before deployment?",
    options: ["AWS Cost Explorer","AWS Budgets","AWS Pricing Calculator","AWS Trusted Advisor"],
    answer: 2,
    explanation: "AWS Pricing Calculator (calculator.aws) allows you to estimate the cost of AWS services before you deploy anything. It doesn't require an AWS account and is used for planning and TCO analysis."
  },
  {
    tag: "Well-Architected Framework",
    text: "A team implements infrastructure as code, makes small reversible changes, and learns from operational failures. Which pillar are they practicing?",
    options: ["Reliability","Security","Operational Excellence","Cost Optimization"],
    answer: 2,
    explanation: "Operational Excellence focuses on running and monitoring systems to deliver business value and continually improving processes. Key practices include IaC, small reversible changes, anticipating failure, and learning from failures."
  },
  {
    tag: "Migration Strategies",
    text: "A company wants to migrate its Oracle database to Amazon Aurora PostgreSQL. Which AWS tool helps convert the database schema?",
    options: ["AWS DMS","AWS SCT (Schema Conversion Tool)","AWS Snowball","AWS DataSync"],
    answer: 1,
    explanation: "AWS Schema Conversion Tool (SCT) converts database schemas from one engine to another (e.g., Oracle to PostgreSQL). It's used alongside AWS DMS for heterogeneous database migrations."
  },
  {
    tag: "Benefits of AWS Cloud",
    text: "Which of the following best describes 'high availability' in AWS?",
    options: ["The ability to store data in multiple formats","Designing systems to remain operational by using multiple Availability Zones","The ability to process millions of requests per second","Automatically reducing costs during low-traffic periods"],
    answer: 1,
    explanation: "High availability means designing systems to minimize downtime by deploying across multiple Availability Zones. If one AZ fails, traffic automatically routes to healthy AZs, keeping the system operational."
  },
  {
    tag: "Cloud Economics",
    text: "Which of the following is an example of a variable cost in AWS?",
    options: ["Purchasing a 3-year Reserved Instance upfront","Buying physical servers for a data center","Paying for EC2 On-Demand instances by the hour","Signing a long-term data center lease"],
    answer: 2,
    explanation: "EC2 On-Demand instances are billed by the hour or second based on actual usage — this is a variable cost (OpEx). Purchasing Reserved Instances upfront or buying physical servers are fixed costs (CapEx)."
  },
  {
    tag: "Migration Strategies",
    text: "Which of the following is a Business perspective in the AWS Cloud Adoption Framework (CAF)?",
    options: ["Platform","Security","Operations","Governance"],
    answer: 3,
    explanation: "The AWS CAF has 6 perspectives: Business, People, and Governance are Business perspectives; Platform, Security, and Operations are Technical perspectives. Governance focuses on maximizing cloud benefits while minimizing risk."
  }
];

const STORAGE_KEY = 'quiz_domain1';

let current = 0;
let answered = [];
let score = 0;

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ current, answered, score }));
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const s = JSON.parse(saved);
      current = s.current || 0;
      answered = s.answered || [];
      score = s.score || 0;
    }
  } catch(e) { /* ignore */ }
}

function buildQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card' + (i === current ? ' active' : '');
    card.id = 'q' + i;
    card.innerHTML = `
      <div class="q-meta">
        <span class="q-number">Question ${i+1} of ${questions.length}</span>
        <span class="q-tag">${q.tag}</span>
      </div>
      <div class="q-text">${q.text}</div>
      <div class="options" id="opts${i}">
        ${q.options.map((o,j) => `
          <div class="option" id="opt${i}_${j}" onclick="selectAnswer(${i},${j})">
            <div class="opt-letter">${String.fromCharCode(65+j)}</div>
            <div class="opt-text">${o}</div>
          </div>`).join('')}
      </div>
      <div class="explanation" id="exp${i}"></div>
      <div class="nav">
        <button class="btn btn-secondary" onclick="prevQ(${i})" ${i===0?'disabled':''}>← Previous</button>
        <button class="btn btn-primary" id="nextBtn${i}" onclick="nextQ(${i})" disabled>${i===questions.length-1?'Finish Quiz':'Next →'}</button>
      </div>`;
    container.appendChild(card);
  });
  // Restore answered state into DOM
  answered.forEach((optIdx, qIdx) => {
    if (optIdx === undefined) return;
    const q = questions[qIdx];
    const opts = document.querySelectorAll(`#opts${qIdx} .option`);
    opts.forEach(o => o.classList.add('disabled'));
    opts[optIdx].classList.add(optIdx === q.answer ? 'correct' : 'wrong');
    if (optIdx !== q.answer) opts[q.answer].classList.add('correct');
    const exp = document.getElementById(`exp${qIdx}`);
    exp.textContent = '💡 ' + q.explanation;
    exp.className = 'explanation show' + (optIdx !== q.answer ? ' wrong-exp' : '');
    document.getElementById(`nextBtn${qIdx}`).disabled = false;
  });
  updateProgress();
}

function selectAnswer(qIdx, optIdx) {
  if (answered[qIdx] !== undefined) return;
  answered[qIdx] = optIdx;
  const q = questions[qIdx];
  const opts = document.querySelectorAll(`#opts${qIdx} .option`);
  opts.forEach(o => o.classList.add('disabled'));
  opts[optIdx].classList.add(optIdx === q.answer ? 'correct' : 'wrong');
  if (optIdx !== q.answer) opts[q.answer].classList.add('correct');
  if (optIdx === q.answer) score++;
  const exp = document.getElementById(`exp${qIdx}`);
  exp.textContent = '💡 ' + q.explanation;
  exp.className = 'explanation show' + (optIdx !== q.answer ? ' wrong-exp' : '');
  document.getElementById(`nextBtn${qIdx}`).disabled = false;
  saveState();
}

function nextQ(i) {
  if (answered[i] === undefined) return;
  document.getElementById('q'+i).classList.remove('active');
  if (i === questions.length - 1) { showResults(); return; }
  current = i + 1;
  document.getElementById('q'+current).classList.add('active');
  updateProgress();
  saveState();
}

function prevQ(i) {
  if (i === 0) return;
  document.getElementById('q'+i).classList.remove('active');
  current = i - 1;
  document.getElementById('q'+current).classList.add('active');
  updateProgress();
  saveState();
}

function updateProgress() {
  const pct = ((current) / questions.length * 100).toFixed(0);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `Question ${current+1} of ${questions.length}`;
}

function showResults() {
  document.getElementById('quiz-container').style.display = 'none';
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressLabel').textContent = 'Quiz Complete!';
  const pct = Math.round(score / questions.length * 100);
  document.getElementById('scoreNum').textContent = pct + '%';
  document.getElementById('correctCount').textContent = score;
  document.getElementById('wrongCount').textContent = questions.length - score;
  document.getElementById('totalCount').textContent = questions.length;
  const pass = pct >= 70;
  document.getElementById('resultTitle').textContent = pass ? '🎉 Passed!' : '📚 Keep Studying';
  document.getElementById('resultTitle').className = pass ? 'pass' : 'fail';
  document.getElementById('resultMsg').textContent = pass
    ? `Great job! You scored ${pct}% — you're ready to move on to Domain 2.`
    : `You scored ${pct}%. Review the Domain 1 study materials and try again. Passing score is 70%.`;
  document.getElementById('results').style.display = 'block';
  localStorage.removeItem(STORAGE_KEY);
}

function restartQuiz() {
  current = 0; answered = []; score = 0;
  localStorage.removeItem(STORAGE_KEY);
  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz-container').style.display = 'block';
  buildQuiz();
}

loadState();
buildQuiz();
</script>
</body>
</html>

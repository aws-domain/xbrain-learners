<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Quiz — Compute & Storage</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;padding:32px 16px}
    .container{max-width:760px;margin:0 auto}
    header{margin-bottom:40px;text-align:center}
    header h1{font-size:1.8rem;font-weight:700;color:#fff;margin-bottom:8px}
    header p{color:#94a3b8;font-size:.95rem}
    .progress-bar-wrap{background:#1e2330;border-radius:99px;height:6px;margin-bottom:32px;overflow:hidden}
    .progress-bar{height:100%;background:linear-gradient(90deg,#f97316,#eab308);border-radius:99px;transition:width .4s ease;width:0%}
    .question-card{background:#1a1f2e;border:1px solid #2d3448;border-radius:16px;padding:28px;margin-bottom:20px;display:none;animation:fadeIn .3s ease}
    .question-card.active{display:block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .question-meta{font-size:.78rem;color:#f97316;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
    .question-text{font-size:1.05rem;font-weight:500;color:#f1f5f9;line-height:1.6;margin-bottom:22px}
    .options{display:flex;flex-direction:column;gap:10px}
    .option{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:10px;border:1.5px solid #2d3448;cursor:pointer;transition:all .18s ease;background:#0f1117}
    .option:hover:not(.disabled){border-color:#f97316;background:#1e2330}
    .option-letter{width:26px;height:26px;min-width:26px;border-radius:50%;background:#2d3448;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;color:#94a3b8;transition:all .18s ease}
    .option-text{font-size:.95rem;color:#cbd5e1;line-height:1.5;padding-top:2px}
    .option.correct{border-color:#22c55e;background:rgba(34,197,94,.08)}.option.correct .option-letter{background:#22c55e;color:#fff}
    .option.wrong{border-color:#ef4444;background:rgba(239,68,68,.08)}.option.wrong .option-letter{background:#ef4444;color:#fff}
    .option.disabled{cursor:default}
    .explanation{margin-top:16px;padding:14px 16px;background:#0f1117;border-left:3px solid #f97316;border-radius:0 8px 8px 0;font-size:.88rem;color:#94a3b8;line-height:1.6;display:none}
    .explanation.show{display:block}.explanation strong{color:#fed7aa}
    .nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:12px}
    .btn{padding:10px 24px;border-radius:8px;border:none;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .18s ease}
    .btn-primary{background:linear-gradient(135deg,#f97316,#eab308);color:#fff}
    .btn-primary:hover{opacity:.88;transform:translateY(-1px)}.btn-primary:disabled{opacity:.4;cursor:default;transform:none}
    .btn-ghost{background:transparent;color:#94a3b8;border:1.5px solid #2d3448}.btn-ghost:hover{border-color:#f97316;color:#fed7aa}
    .score-counter{font-size:.85rem;color:#64748b}
    .result-screen{display:none;text-align:center;padding:48px 24px;background:#1a1f2e;border:1px solid #2d3448;border-radius:16px;animation:fadeIn .4s ease}
    .result-screen.show{display:block}
    .result-emoji{font-size:4rem;margin-bottom:16px}.result-score{font-size:3rem;font-weight:800;color:#fff;margin-bottom:8px}
    .result-label{font-size:1.1rem;color:#94a3b8;margin-bottom:32px}
    .result-breakdown{display:flex;justify-content:center;gap:32px;margin-bottom:36px}
    .breakdown-item{text-align:center}.breakdown-num{font-size:1.8rem;font-weight:700}
    .breakdown-num.correct-num{color:#22c55e}.breakdown-num.wrong-num{color:#ef4444}
    .breakdown-label{font-size:.8rem;color:#64748b;margin-top:4px}
    .btn-restart{background:linear-gradient(135deg,#f97316,#eab308);color:#fff;padding:12px 32px;border-radius:10px;border:none;font-size:1rem;font-weight:600;cursor:pointer}
    .btn-restart:hover{opacity:.88}
  </style>
</head>
<body>
<div class="container">
  <header><h1>Compute & Storage</h1><p>20 câu hỏi · Kiểm tra kiến thức sau khi đọc topic summary</p></header>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div id="quizArea"></div>
  <div class="result-screen" id="resultScreen">
    <div class="result-emoji" id="resultEmoji"></div><div class="result-score" id="resultScore"></div>
    <div class="result-label" id="resultLabel"></div>
    <div class="result-breakdown">
      <div class="breakdown-item"><div class="breakdown-num correct-num" id="correctCount"></div><div class="breakdown-label">Đúng</div></div>
      <div class="breakdown-item"><div class="breakdown-num wrong-num" id="wrongCount"></div><div class="breakdown-label">Sai</div></div>
      <div class="breakdown-item"><div class="breakdown-num" style="color:#f97316" id="totalCount"></div><div class="breakdown-label">Tổng</div></div>
    </div>
    <button class="btn-restart" onclick="restartQuiz()">Làm lại từ đầu</button>
  </div>
</div>
<script>
const questions=[
  {q:"Instance type nào phù hợp cho workload cần nhiều RAM như in-memory database?",options:["Compute Optimized (c6i)","General Purpose (t3)","Memory Optimized (r6i)","Storage Optimized (i3)"],answer:2,explanation:"<strong>Memory Optimized (r6i, x2i)</strong> tối ưu cho RAM-intensive workloads như in-memory database, cache, real-time big data. Compute Optimized (c6i) cho CPU-intensive. General Purpose (t3) cho balanced workloads."},
  {q:"EC2 Dedicated Host khác On-Demand ở điểm nào?",options:["Rẻ hơn 60-90%","Server vật lý riêng — dùng cho compliance và software licensing","Tự động scale theo demand","Chỉ dùng được trong 1 AZ"],answer:1,explanation:"<strong>Dedicated Host</strong> = server vật lý riêng dành cho bạn. Dùng khi có compliance requirements (không chia sẻ hardware với người khác) hoặc software licensing theo socket/core (Oracle, Windows Server)."},
  {q:"Auto Scaling 'Scale out' và 'Scale in' có nghĩa là gì?",options:["Scale out = tăng RAM, Scale in = giảm RAM","Scale out = thêm instances khi tải tăng, Scale in = bớt instances khi tải giảm","Scale out = deploy sang Region mới, Scale in = thu về 1 Region","Scale out = tăng storage, Scale in = giảm storage"],answer:1,explanation:"<strong>Scale out</strong> = thêm EC2 instances khi demand tăng (horizontal scaling). <strong>Scale in</strong> = bớt instances khi demand giảm. Kết hợp với Load Balancer để phân phối traffic đều. Khác với scale up/down (thay đổi instance size)."},
  {q:"Application Load Balancer (ALB) hoạt động ở layer nào?",options:["Layer 3 (Network)","Layer 4 (Transport)","Layer 7 (Application)","Layer 2 (Data Link)"],answer:2,explanation:"<strong>ALB hoạt động ở Layer 7 (Application)</strong> — hiểu HTTP/HTTPS, hỗ trợ path-based routing (/api → service A, /web → service B), host-based routing. NLB ở Layer 4 cho TCP/UDP ultra-low latency. GWLB ở Layer 3 cho third-party appliances."},
  {q:"S3 durability 99.999999999% (11 nines) có nghĩa là gì?",options:["S3 uptime là 99.999999999%","Data được replicate tự động — xác suất mất data cực kỳ thấp","S3 response time dưới 1ms","S3 hỗ trợ 11 tỷ objects"],answer:1,explanation:"<strong>11 nines durability</strong> = xác suất mất data cực kỳ thấp (0.000000001%). AWS tự động replicate data trên nhiều AZ. Đây là durability (không mất data), khác với availability (uptime)."},
  {q:"S3 Intelligent-Tiering dùng khi nào?",options:["Khi biết chắc data sẽ được access thường xuyên","Khi không biết access pattern — tự động chuyển tier để tối ưu chi phí","Khi cần archive data lâu dài","Khi cần latency thấp nhất"],answer:1,explanation:"<strong>S3 Intelligent-Tiering</strong> tự động chuyển objects giữa các tiers dựa trên access pattern — không cần biết trước. Phù hợp khi access pattern không predictable. Có monitoring fee nhỏ nhưng không có retrieval fee."},
  {q:"S3 Versioning bảo vệ khỏi điều gì?",options:["Bảo vệ khỏi unauthorized access","Bảo vệ khỏi accidental delete hoặc overwrite — giữ nhiều versions của cùng 1 object","Bảo vệ khỏi DDoS attacks","Bảo vệ khỏi data corruption do hardware failure"],answer:1,explanation:"<strong>S3 Versioning</strong> giữ nhiều versions của cùng 1 object. Khi xóa object có versioning, AWS thêm 'delete marker' thay vì xóa thật — có thể restore. Bảo vệ khỏi accidental delete và overwrite."},
  {q:"S3 Presigned URL dùng để làm gì?",options:["Tạo URL public vĩnh viễn cho object","URL tạm thời cho phép access object mà không cần AWS credentials","Encrypt object trước khi upload","Share bucket với AWS account khác"],answer:1,explanation:"<strong>Presigned URL</strong> = URL tạm thời (có expiry time) cho phép download/upload object mà không cần AWS credentials. Dùng khi cần share file với user bên ngoài mà không muốn public bucket."},
  {q:"EBS volume có thể gắn vào bao nhiêu EC2 instances cùng lúc?",options:["Không giới hạn — nhiều instances cùng AZ","Tối đa 5 instances","Chỉ 1 instance trong cùng AZ (trừ io1/io2 Multi-Attach)","Tối đa 2 instances trong cùng Region"],answer:2,explanation:"<strong>EBS chỉ gắn vào 1 EC2 trong cùng AZ</strong> — không thể gắn vào instances ở AZ khác hoặc nhiều instances cùng lúc (trừ io1/io2 với Multi-Attach feature). Khác với EFS có thể mount từ nhiều instances."},
  {q:"EBS volume type nào phù hợp cho production database cần IOPS rất cao?",options:["gp3 — General Purpose SSD","st1 — Throughput HDD","sc1 — Cold HDD","io2 Block Express — Provisioned IOPS SSD"],answer:3,explanation:"<strong>io2 Block Express</strong> cho mission-critical databases cần IOPS cao (tối đa 256,000 IOPS) và consistent low latency. <strong>gp3</strong> cho general workload (tối đa 16,000 IOPS). st1/sc1 là HDD — throughput cao nhưng IOPS thấp."},
  {q:"EBS Snapshot là gì và lưu ở đâu?",options:["Full backup của volume, lưu trong EBS","Incremental backup của volume, lưu vào S3","Real-time mirror của volume sang AZ khác","Compressed copy của volume trong cùng AZ"],answer:1,explanation:"<strong>EBS Snapshot</strong> là incremental backup — chỉ lưu những gì thay đổi so với snapshot trước. Lưu vào <strong>S3</strong> (managed by AWS). Dùng để tạo volume mới, copy sang AZ/Region khác, tạo AMI."},
  {q:"EFS khác EBS ở điểm quan trọng nào?",options:["EFS rẻ hơn EBS","EFS là shared file system — nhiều EC2 instances mount cùng lúc, EBS chỉ 1 instance","EFS nhanh hơn EBS","EFS hỗ trợ Windows, EBS chỉ hỗ trợ Linux"],answer:1,explanation:"<strong>EFS (Elastic File System)</strong> là shared file system — nhiều EC2 instances có thể mount cùng lúc qua NFS. <strong>EBS</strong> chỉ gắn vào 1 instance. EFS tự động scale, chỉ dùng với Linux. Dùng cho shared content, home directories."},
  {q:"S3 là loại storage nào?",options:["Block storage","File storage","Object storage","In-memory storage"],answer:2,explanation:"<strong>S3 là Object storage</strong> — lưu file dưới dạng objects (file + metadata) trong buckets. Không phải file system (không có folder thật sự). EBS là block storage. EFS là file storage. ElastiCache là in-memory."},
  {q:"S3 bucket name có yêu cầu gì đặc biệt?",options:["Phải bắt đầu bằng tên account","Phải globally unique — không trùng với bất kỳ bucket nào trên toàn AWS","Chỉ được dùng chữ thường và số","Tối đa 10 ký tự"],answer:1,explanation:"<strong>S3 bucket name phải globally unique</strong> — không trùng với bất kỳ bucket nào trên toàn AWS (không chỉ trong account của bạn). Tên bucket cũng phải lowercase, không có underscore, 3-63 ký tự."},
  {q:"S3 Lifecycle Policy dùng để làm gì?",options:["Tự động backup data sang Region khác","Tự động chuyển objects sang storage class rẻ hơn hoặc xóa sau X ngày","Monitor access patterns của objects","Encrypt objects tự động"],answer:1,explanation:"<strong>S3 Lifecycle Policy</strong> tự động quản lý objects theo thời gian: chuyển sang Standard-IA sau 30 ngày, Glacier sau 90 ngày, xóa sau 365 ngày. Tiết kiệm chi phí mà không cần làm thủ công."},
  {q:"Network Load Balancer (NLB) phù hợp nhất cho workload nào?",options:["Web application với path-based routing","TCP/UDP workloads cần ultra-low latency","Third-party firewall appliances","HTTP APIs với authentication"],answer:1,explanation:"<strong>NLB hoạt động ở Layer 4 (Transport)</strong> — xử lý TCP/UDP với ultra-low latency (milliseconds). Phù hợp cho gaming, IoT, financial trading cần latency cực thấp. ALB (Layer 7) cho HTTP/HTTPS với routing phức tạp."},
  {q:"gp3 cải tiến gì so với gp2?",options:["gp3 rẻ hơn và cho phép provision IOPS/throughput độc lập với volume size","gp3 hỗ trợ Multi-Attach","gp3 có durability cao hơn","gp3 hỗ trợ Windows tốt hơn"],answer:0,explanation:"<strong>gp3</strong> cải tiến so với gp2: rẻ hơn ~20%, và quan trọng hơn là có thể <strong>provision IOPS và throughput độc lập với volume size</strong>. gp2 IOPS tỉ lệ thuận với size (3 IOPS/GB). gp3 baseline 3,000 IOPS bất kể size."},
  {q:"S3 Block Public Access mặc định ở trạng thái nào?",options:["Tắt — bucket mặc định public","Bật — ngăn bucket bị public accidental","Tùy thuộc vào Region","Tùy thuộc vào loại bucket"],answer:1,explanation:"<strong>S3 Block Public Access bật mặc định</strong> — ngăn bucket và objects bị public accidental. Phải tắt thủ công nếu muốn host static website hoặc public content. Best practice: giữ bật trừ khi có lý do cụ thể."},
  {q:"Khi nào nên dùng S3 Glacier Deep Archive?",options:["Data cần access hàng ngày","Data cần access trong vài giây","Long-term archive, chấp nhận retrieval time 12-48 giờ, chi phí thấp nhất","Data cần access trong 1-12 giờ"],answer:2,explanation:"<strong>S3 Glacier Deep Archive</strong> = chi phí thấp nhất, retrieval time 12-48 giờ. Dùng cho long-term archive (compliance records, backup cuối cùng). Glacier Instant = ms retrieval. Glacier Flexible = 1-12h retrieval."},
  {q:"EBS volume có thể tồn tại độc lập với EC2 instance không?",options:["Không — xóa EC2 là xóa EBS","Có — EBS persist độc lập, xóa EC2 không mất data EBS (nếu không chọn delete on termination)","Chỉ khi dùng Snapshot","Chỉ với volume type io2"],answer:1,explanation:"<strong>EBS persist độc lập với EC2</strong> — xóa EC2 không tự động xóa EBS (trừ khi bật 'Delete on termination'). Có thể detach từ EC2 này và attach vào EC2 khác trong cùng AZ. Đây là điểm khác biệt với instance store (ephemeral)."}
];
let current=0,score=0,answered=new Array(questions.length).fill(false);
function buildQuiz(){
  const area=document.getElementById('quizArea');area.innerHTML='';
  const letters=['A','B','C','D'];
  questions.forEach((q,i)=>{
    const card=document.createElement('div');card.className='question-card'+(i===0?' active':'');card.id=`card-${i}`;
    const opts=q.options.map((opt,j)=>`<div class="option" id="opt-${i}-${j}" onclick="selectOption(${i},${j})"><div class="option-letter">${letters[j]}</div><div class="option-text">${opt}</div></div>`).join('');
    card.innerHTML=`<div class="question-meta">Câu ${i+1} / ${questions.length}</div><div class="question-text">${q.q}</div><div class="options">${opts}</div><div class="explanation" id="exp-${i}">💡 ${q.explanation}</div>`;
    area.appendChild(card);
  });
  const nav=document.createElement('div');nav.className='nav';
  nav.innerHTML=`<button class="btn btn-ghost" id="btnPrev" onclick="navigate(-1)" disabled>← Trước</button><span class="score-counter" id="scoreCounter">0 / ${questions.length} đúng</span><button class="btn btn-primary" id="btnNext" onclick="navigate(1)" disabled>Tiếp →</button>`;
  area.appendChild(nav);updateProgress();
}
function selectOption(qIdx,optIdx){
  if(answered[qIdx])return;answered[qIdx]=true;const q=questions[qIdx];
  q.options.forEach((_,j)=>{const el=document.getElementById(`opt-${qIdx}-${j}`);el.classList.add('disabled');if(j===q.answer)el.classList.add('correct');else if(j===optIdx)el.classList.add('wrong');});
  if(optIdx===q.answer)score++;
  document.getElementById(`exp-${qIdx}`).classList.add('show');
  document.getElementById('scoreCounter').textContent=`${score} / ${questions.length} đúng`;
  document.getElementById('btnNext').disabled=false;
  if(current===questions.length-1)document.getElementById('btnNext').textContent='Xem kết quả →';
  updateProgress();
}
function navigate(dir){
  const cards=document.querySelectorAll('.question-card');cards[current].classList.remove('active');current+=dir;
  if(current>=questions.length){showResult();return;}
  cards[current].classList.add('active');
  document.getElementById('btnPrev').disabled=current===0;
  document.getElementById('btnNext').disabled=!answered[current];
  document.getElementById('btnNext').textContent=current===questions.length-1&&answered[current]?'Xem kết quả →':'Tiếp →';
  updateProgress();
}
function updateProgress(){document.getElementById('progressBar').style.width=((current+1)/questions.length*100)+'%';}
function showResult(){
  document.getElementById('quizArea').style.display='none';document.getElementById('resultScreen').classList.add('show');
  const pct=Math.round(score/questions.length*100);
  const d=pct>=90?['🏆','Xuất sắc!']:pct>=75?['🎯','Tốt lắm! Ôn lại vài điểm nhỏ.']:pct>=60?['📚','Khá ổn. Đọc lại phần nhầm.']:['💪','Cần ôn thêm!'];
  document.getElementById('resultEmoji').textContent=d[0];document.getElementById('resultScore').textContent=pct+'%';document.getElementById('resultLabel').textContent=d[1];
  document.getElementById('correctCount').textContent=score;document.getElementById('wrongCount').textContent=questions.length-score;document.getElementById('totalCount').textContent=questions.length;
}
function restartQuiz(){current=0;score=0;answered=new Array(questions.length).fill(false);document.getElementById('resultScreen').classList.remove('show');document.getElementById('quizArea').style.display='block';buildQuiz();}
buildQuiz();
</script>
</body></html>

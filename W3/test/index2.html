<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz — AI & Amazon Bedrock</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 32px 16px;
    }

    .container { max-width: 760px; margin: 0 auto; }

    header { margin-bottom: 40px; text-align: center; }
    header h1 { font-size: 1.8rem; font-weight: 700; color: #fff; margin-bottom: 8px; }
    header p { color: #94a3b8; font-size: 0.95rem; }

    .progress-bar-wrap {
      background: #1e2330; border-radius: 99px;
      height: 6px; margin-bottom: 32px; overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #ef4444);
      border-radius: 99px; transition: width 0.4s ease; width: 0%;
    }

    .question-card {
      background: #1a1f2e; border: 1px solid #2d3448;
      border-radius: 16px; padding: 28px; margin-bottom: 20px;
      display: none; animation: fadeIn 0.3s ease;
    }
    .question-card.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .question-meta {
      font-size: 0.78rem; color: #f59e0b; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px;
    }
    .question-text {
      font-size: 1.05rem; font-weight: 500; color: #f1f5f9;
      line-height: 1.6; margin-bottom: 22px;
    }

    .options { display: flex; flex-direction: column; gap: 10px; }

    .option {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 14px 16px; border-radius: 10px;
      border: 1.5px solid #2d3448; cursor: pointer;
      transition: all 0.18s ease; background: #0f1117;
    }
    .option:hover:not(.disabled) { border-color: #f59e0b; background: #1e2330; }

    .option-letter {
      width: 26px; height: 26px; min-width: 26px; border-radius: 50%;
      background: #2d3448; display: flex; align-items: center;
      justify-content: center; font-size: 0.78rem; font-weight: 700;
      color: #94a3b8; transition: all 0.18s ease;
    }
    .option-text { font-size: 0.95rem; color: #cbd5e1; line-height: 1.5; padding-top: 2px; }

    .option.correct { border-color: #22c55e; background: rgba(34,197,94,0.08); }
    .option.correct .option-letter { background: #22c55e; color: #fff; }
    .option.wrong { border-color: #ef4444; background: rgba(239,68,68,0.08); }
    .option.wrong .option-letter { background: #ef4444; color: #fff; }
    .option.disabled { cursor: default; }

    .explanation {
      margin-top: 16px; padding: 14px 16px; background: #0f1117;
      border-left: 3px solid #f59e0b; border-radius: 0 8px 8px 0;
      font-size: 0.88rem; color: #94a3b8; line-height: 1.6; display: none;
    }
    .explanation.show { display: block; }
    .explanation strong { color: #fde68a; }

    .nav {
      display: flex; justify-content: space-between;
      align-items: center; margin-top: 28px; gap: 12px;
    }

    .btn { padding: 10px 24px; border-radius: 8px; border: none; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.18s ease; }
    .btn-primary { background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff; }
    .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.4; cursor: default; transform: none; }
    .btn-ghost { background: transparent; color: #94a3b8; border: 1.5px solid #2d3448; }
    .btn-ghost:hover { border-color: #f59e0b; color: #fde68a; }

    .score-counter { font-size: 0.85rem; color: #64748b; }

    .result-screen {
      display: none; text-align: center; padding: 48px 24px;
      background: #1a1f2e; border: 1px solid #2d3448;
      border-radius: 16px; animation: fadeIn 0.4s ease;
    }
    .result-screen.show { display: block; }
    .result-emoji { font-size: 4rem; margin-bottom: 16px; }
    .result-score { font-size: 3rem; font-weight: 800; color: #fff; margin-bottom: 8px; }
    .result-label { font-size: 1.1rem; color: #94a3b8; margin-bottom: 32px; }
    .result-breakdown { display: flex; justify-content: center; gap: 32px; margin-bottom: 36px; }
    .breakdown-item { text-align: center; }
    .breakdown-num { font-size: 1.8rem; font-weight: 700; }
    .breakdown-num.correct-num { color: #22c55e; }
    .breakdown-num.wrong-num { color: #ef4444; }
    .breakdown-label { font-size: 0.8rem; color: #64748b; margin-top: 4px; }
    .btn-restart {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff; padding: 12px 32px; border-radius: 10px;
      border: none; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    .btn-restart:hover { opacity: 0.88; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>AI & Amazon Bedrock</h1>
    <p>20 câu hỏi · Kiểm tra kiến thức sau khi đọc topic summary</p>
  </header>

  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div id="quizArea"></div>

  <div class="result-screen" id="resultScreen">
    <div class="result-emoji" id="resultEmoji"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-label" id="resultLabel"></div>
    <div class="result-breakdown">
      <div class="breakdown-item">
        <div class="breakdown-num correct-num" id="correctCount"></div>
        <div class="breakdown-label">Đúng</div>
      </div>
      <div class="breakdown-item">
        <div class="breakdown-num wrong-num" id="wrongCount"></div>
        <div class="breakdown-label">Sai</div>
      </div>
      <div class="breakdown-item">
        <div class="breakdown-num" style="color:#f59e0b" id="totalCount"></div>
        <div class="breakdown-label">Tổng</div>
      </div>
    </div>
    <button class="btn-restart" onclick="restartQuiz()">Làm lại từ đầu</button>
  </div>
</div>

<script>
const questions = [
  {
    q: "Amazon Bedrock là gì?",
    options: [
      "Một EC2 instance type tối ưu cho AI workloads",
      "Fully managed service cung cấp access vào Foundation Models từ nhiều providers qua 1 API",
      "Một framework để train custom ML models từ đầu",
      "Dịch vụ lưu trữ dataset cho machine learning"
    ],
    answer: 1,
    explanation: "<strong>Amazon Bedrock</strong> là fully managed service cho phép build generative AI applications bằng cách cung cấp access vào Foundation Models từ nhiều providers (Anthropic, Meta, Mistral...) qua 1 API thống nhất. Serverless — không cần quản lý infrastructure."
  },
  {
    q: "Data của bạn có được dùng để train model của các providers trên Bedrock không?",
    options: [
      "Có, để cải thiện model theo thời gian",
      "Có, nhưng chỉ với Anthropic Claude",
      "Không — data của bạn không được dùng để train model của providers",
      "Tùy thuộc vào loại model bạn chọn"
    ],
    answer: 2,
    explanation: "Đây là điểm quan trọng của Bedrock: <strong>data của bạn không được dùng để train model</strong> của providers. Đây là cam kết bảo mật và privacy của AWS Bedrock."
  },
  {
    q: "Khi cần tạo embedding (vector representation) từ text, nên dùng model nào?",
    options: [
      "Claude Sonnet — vì có reasoning tốt nhất",
      "Stable Diffusion — vì xử lý được nhiều loại data",
      "Titan Embeddings hoặc Cohere Embed",
      "Llama 3 — vì là open source"
    ],
    answer: 2,
    explanation: "<strong>Titan Embeddings</strong> (Amazon) và <strong>Cohere Embed</strong> là các model chuyên dụng để tạo vector embeddings từ text. Claude, Llama dùng cho text generation. Stable Diffusion dùng cho image generation."
  },
  {
    q: "Converse API trong Bedrock có ưu điểm gì so với InvokeModel API?",
    options: [
      "Nhanh hơn và rẻ hơn InvokeModel",
      "API thống nhất cho tất cả models — không cần biết format riêng của từng model",
      "Hỗ trợ streaming response tốt hơn",
      "Chỉ dùng được với Claude models"
    ],
    answer: 1,
    explanation: "<strong>Converse API</strong> là API thống nhất — bạn dùng cùng 1 format cho tất cả models, không cần biết request body format riêng của từng provider. InvokeModel yêu cầu biết format cụ thể của từng model (Anthropic, Meta, Mistral đều khác nhau)."
  },
  {
    q: "RAG (Retrieval Augmented Generation) giải quyết vấn đề gì của Foundation Models?",
    options: [
      "FM chạy quá chậm khi xử lý văn bản dài",
      "FM tốn quá nhiều chi phí khi gọi API",
      "FM không biết data nội bộ của công ty và có knowledge cutoff",
      "FM không hỗ trợ tiếng Việt"
    ],
    answer: 2,
    explanation: "FM có 3 vấn đề chính: <strong>knowledge cutoff</strong> (chỉ biết data đến thời điểm training), <strong>không biết data nội bộ</strong> của công ty, và có thể <strong>hallucinate</strong>. RAG giải quyết bằng cách retrieve documents liên quan và cung cấp làm context cho FM."
  },
  {
    q: "Thứ tự đúng của RAG pipeline là gì?",
    options: [
      "Generate → Retrieve → Augment",
      "Augment → Retrieve → Generate",
      "Retrieve → Generate → Augment",
      "Retrieve → Augment → Generate"
    ],
    answer: 3,
    explanation: "RAG = <strong>R</strong>etrieve → <strong>A</strong>ugment → <strong>G</strong>enerate: 1) Tìm kiếm documents liên quan từ knowledge base, 2) Thêm documents đó vào prompt (augment), 3) FM generate answer dựa trên context được cung cấp."
  },
  {
    q: "Trong RAG pipeline, Embedding Model có vai trò gì?",
    options: [
      "Lưu trữ raw documents vào S3",
      "Convert text thành vector số để có thể tìm kiếm theo semantic similarity",
      "Generate câu trả lời cuối cùng cho user",
      "Chunk documents thành các đoạn nhỏ hơn"
    ],
    answer: 1,
    explanation: "<strong>Embedding Model</strong> convert text thành vector số (list of floats) đại diện cho 'ý nghĩa' của text. Texts có ý nghĩa tương tự sẽ có vectors gần nhau trong không gian nhiều chiều — cho phép tìm kiếm theo semantic similarity thay vì keyword matching."
  },
  {
    q: "Amazon Bedrock Knowledge Base khác gì so với tự build RAG pipeline?",
    options: [
      "Knowledge Base chỉ hỗ trợ PDF, tự build hỗ trợ nhiều format hơn",
      "Knowledge Base là managed RAG — AWS lo chunking, embedding, vector store, retrieval",
      "Knowledge Base rẻ hơn nhưng chậm hơn tự build",
      "Knowledge Base chỉ dùng được với Claude models"
    ],
    answer: 1,
    explanation: "<strong>Knowledge Base là managed RAG</strong> — AWS lo toàn bộ: chunking, embedding, vector store, retrieval. Bạn chỉ cần upload documents vào S3 và gọi API. Tự build phải setup từng component riêng — flexible hơn nhưng phức tạp hơn."
  },
  {
    q: "S3 Vectors trong Bedrock Knowledge Base có ưu điểm gì?",
    options: [
      "Nhanh hơn OpenSearch Serverless 10 lần",
      "Native vector storage trong S3 — không cần OpenSearch hay Aurora, đơn giản và rẻ hơn",
      "Hỗ trợ real-time vector updates",
      "Tự động optimize embedding model"
    ],
    answer: 1,
    explanation: "<strong>S3 Vectors</strong> là native vector storage trong S3 — không cần setup OpenSearch Serverless hay Aurora pgvector. Đơn giản hơn và rẻ hơn cho use cases cơ bản như Knowledge Base và semantic search."
  },
  {
    q: "Chunking strategy nào phù hợp nhất cho documents có cấu trúc rõ ràng (headings, sections)?",
    options: [
      "Fixed size chunking",
      "Random chunking",
      "Semantic chunking",
      "Hierarchical chunking"
    ],
    answer: 3,
    explanation: "<strong>Hierarchical chunking</strong> phù hợp cho documents có cấu trúc (headings, sections, subsections). Fixed size dùng cho documents đồng nhất đơn giản. Semantic dùng cho documents phức tạp cần giữ context."
  },
  {
    q: "Anatomy của một Bedrock Agent gồm những thành phần nào?",
    options: [
      "FM + Training Data + Deployment Config",
      "FM + Instructions + Action Groups + Knowledge Base",
      "FM + Prompt Template + Output Parser",
      "FM + Lambda + DynamoDB + S3"
    ],
    answer: 1,
    explanation: "Bedrock Agent gồm 4 thành phần: <strong>FM</strong> (bộ não — reasoning và planning), <strong>Instructions</strong> (system prompt, định nghĩa behavior), <strong>Action Groups</strong> (APIs agent có thể gọi qua Lambda), <strong>Knowledge Base</strong> (RAG — thông tin agent tra cứu)."
  },
  {
    q: "Action Groups trong Bedrock Agent hoạt động như thế nào?",
    options: [
      "Là các pre-built actions của AWS không thể customize",
      "Mỗi action = 1 Lambda function, dùng OpenAPI schema để mô tả API spec",
      "Là các SQL queries chạy trực tiếp trên database",
      "Là các CloudFormation templates để deploy resources"
    ],
    answer: 1,
    explanation: "<strong>Action Groups</strong> định nghĩa actions agent có thể thực hiện. Mỗi action = 1 Lambda function. Dùng <strong>OpenAPI schema</strong> để mô tả API spec cho agent hiểu khi nào và cách gọi action đó."
  },
  {
    q: "Trong Multi-Agent Collaboration, Supervisor Agent có vai trò gì?",
    options: [
      "Thực hiện tất cả tasks một mình, không cần sub-agents",
      "Chỉ handle authentication và authorization",
      "Điều phối và phân công tasks cho các Sub-Agents chuyên biệt",
      "Monitor performance của các Sub-Agents"
    ],
    answer: 2,
    explanation: "<strong>Supervisor Agent</strong> điều phối nhiều Sub-Agents chuyên biệt — nhận request từ user, phân tích, rồi phân công task cho đúng sub-agent có expertise phù hợp (booking agent, payment agent, support agent...)."
  },
  {
    q: "Bedrock Guardrails có thể làm gì?",
    options: [
      "Tăng tốc độ response của model",
      "Giảm chi phí API calls",
      "Block harmful content, deny off-topic questions, verify grounding",
      "Tự động chọn model phù hợp nhất cho từng request"
    ],
    answer: 2,
    explanation: "<strong>Bedrock Guardrails</strong> có 3 chức năng chính: <strong>Content filtering</strong> (block hate speech, violence, PII), <strong>Topic denial</strong> (ngăn model trả lời off-topic), <strong>Grounding check</strong> (verify response dựa trên source documents để giảm hallucination). Áp dụng cho cả input lẫn output."
  },
  {
    q: "Few-shot prompting là gì?",
    options: [
      "Gửi nhiều requests cùng lúc để tăng throughput",
      "Cho model vài ví dụ trước khi đặt câu hỏi thật",
      "Giới hạn số tokens trong response",
      "Dùng model nhỏ hơn để tiết kiệm chi phí"
    ],
    answer: 1,
    explanation: "<strong>Few-shot prompting</strong> = cho model vài ví dụ (input → output) trước khi đặt câu hỏi thật. Dùng khi cần output theo format cụ thể. Zero-shot = hỏi thẳng không có ví dụ. Chain of Thought = yêu cầu 'think step by step' cho reasoning phức tạp."
  },
  {
    q: "Chain of Thought prompting dùng khi nào?",
    options: [
      "Khi cần response ngắn gọn, súc tích",
      "Khi task đơn giản, không cần giải thích",
      "Khi cần model reasoning qua các bước phức tạp",
      "Khi muốn model trả lời bằng nhiều ngôn ngữ"
    ],
    answer: 2,
    explanation: "<strong>Chain of Thought</strong> = yêu cầu model 'think step by step' — dùng cho reasoning phức tạp như toán học, logic, phân tích multi-step. Giúp model không nhảy thẳng đến kết luận mà đi qua từng bước trung gian."
  },
  {
    q: "Khi nào nên dùng Claude Haiku thay vì Claude Sonnet/Opus?",
    options: [
      "Khi cần xử lý hình ảnh",
      "Khi cần tạo embedding vectors",
      "Khi task đơn giản, cần fast và cheap",
      "Khi cần train custom model"
    ],
    answer: 2,
    explanation: "<strong>Claude Haiku</strong> = fast, cheap, dùng cho tasks đơn giản (classification, summarization ngắn, Q&A cơ bản). <strong>Claude Sonnet/Opus</strong> = complex reasoning, analysis sâu, tasks đòi hỏi accuracy cao — nhưng chậm hơn và đắt hơn."
  },
  {
    q: "RetrieveAndGenerate API trong Bedrock Knowledge Base làm gì?",
    options: [
      "Chỉ retrieve documents, không generate answer",
      "Chỉ generate answer, không retrieve documents",
      "Kết hợp retrieve documents từ KB và generate answer trong 1 API call",
      "Upload documents vào Knowledge Base"
    ],
    answer: 2,
    explanation: "<strong>RetrieveAndGenerate API</strong> kết hợp cả 2 bước trong 1 call: retrieve relevant chunks từ Knowledge Base, rồi dùng FM để generate answer dựa trên chunks đó. Đơn giản hơn so với gọi Retrieve API riêng rồi tự build prompt."
  },
  {
    q: "Grounding check trong Bedrock Guardrails có tác dụng gì?",
    options: [
      "Kiểm tra xem model có đang chạy đúng version không",
      "Verify response của model dựa trên source documents để giảm hallucination",
      "Đảm bảo model trả lời bằng ngôn ngữ đúng",
      "Kiểm tra latency của API calls"
    ],
    answer: 1,
    explanation: "<strong>Grounding check</strong> verify xem response của model có được support bởi source documents không — giảm hallucination. Nếu model tạo ra thông tin không có trong documents, guardrail có thể flag hoặc block response đó."
  },
  {
    q: "Cấu trúc prompt tốt theo best practice gồm những phần nào?",
    options: [
      "Chỉ cần câu hỏi ngắn gọn là đủ",
      "System (role/context) + Human (task + context + format mong muốn)",
      "Model ID + Temperature + Max tokens + Question",
      "Language + Tone + Length + Question"
    ],
    answer: 1,
    explanation: "Cấu trúc prompt tốt: <strong>System</strong> (role và context của AI — 'You are an AWS expert...'), <strong>Human</strong> gồm task cụ thể + context/data cần thiết + format output mong muốn. Prompt rõ ràng → response chính xác và consistent hơn."
  }
];

let current = 0, score = 0;
let answered = new Array(questions.length).fill(false);

function buildQuiz() {
  const area = document.getElementById('quizArea');
  area.innerHTML = '';
  const letters = ['A','B','C','D'];

  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card' + (i === 0 ? ' active' : '');
    card.id = `card-${i}`;

    const opts = q.options.map((opt, j) => `
      <div class="option" id="opt-${i}-${j}" onclick="selectOption(${i},${j})">
        <div class="option-letter">${letters[j]}</div>
        <div class="option-text">${opt}</div>
      </div>`).join('');

    card.innerHTML = `
      <div class="question-meta">Câu ${i+1} / ${questions.length}</div>
      <div class="question-text">${q.q}</div>
      <div class="options">${opts}</div>
      <div class="explanation" id="exp-${i}">💡 ${q.explanation}</div>`;
    area.appendChild(card);
  });

  const nav = document.createElement('div');
  nav.className = 'nav'; nav.id = 'navBar';
  nav.innerHTML = `
    <button class="btn btn-ghost" id="btnPrev" onclick="navigate(-1)" disabled>← Trước</button>
    <span class="score-counter" id="scoreCounter">0 / ${questions.length} đúng</span>
    <button class="btn btn-primary" id="btnNext" onclick="navigate(1)" disabled>Tiếp →</button>`;
  area.appendChild(nav);
  updateProgress();
}

function selectOption(qIdx, optIdx) {
  if (answered[qIdx]) return;
  answered[qIdx] = true;
  const q = questions[qIdx];
  const letters = ['A','B','C','D'];

  q.options.forEach((_, j) => {
    const el = document.getElementById(`opt-${qIdx}-${j}`);
    el.classList.add('disabled');
    if (j === q.answer) el.classList.add('correct');
    else if (j === optIdx) el.classList.add('wrong');
  });

  if (optIdx === q.answer) score++;
  document.getElementById(`exp-${qIdx}`).classList.add('show');
  document.getElementById('scoreCounter').textContent = `${score} / ${questions.length} đúng`;
  document.getElementById('btnNext').disabled = false;
  if (current === questions.length - 1)
    document.getElementById('btnNext').textContent = 'Xem kết quả →';
  updateProgress();
}

function navigate(dir) {
  const cards = document.querySelectorAll('.question-card');
  cards[current].classList.remove('active');
  current += dir;
  if (current >= questions.length) { showResult(); return; }
  cards[current].classList.add('active');
  document.getElementById('btnPrev').disabled = current === 0;
  document.getElementById('btnNext').disabled = !answered[current];
  document.getElementById('btnNext').textContent =
    current === questions.length - 1 && answered[current] ? 'Xem kết quả →' : 'Tiếp →';
  updateProgress();
}

function updateProgress() {
  document.getElementById('progressBar').style.width =
    ((current + 1) / questions.length * 100) + '%';
}

function showResult() {
  document.getElementById('quizArea').style.display = 'none';
  const result = document.getElementById('resultScreen');
  result.classList.add('show');
  const pct = Math.round(score / questions.length * 100);
  let emoji, label;
  if (pct >= 90)      { emoji = '🏆'; label = 'Xuất sắc! Bạn nắm vững AI & Bedrock rồi.'; }
  else if (pct >= 75) { emoji = '🎯'; label = 'Tốt lắm! Ôn lại vài điểm nhỏ là hoàn hảo.'; }
  else if (pct >= 60) { emoji = '📚'; label = 'Khá ổn. Đọc lại phần bạn còn nhầm nhé.'; }
  else                { emoji = '💪'; label = 'Cần ôn thêm. Đọc lại file summary và thử lại!'; }
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultScore').textContent = pct + '%';
  document.getElementById('resultLabel').textContent = label;
  document.getElementById('correctCount').textContent = score;
  document.getElementById('wrongCount').textContent = questions.length - score;
  document.getElementById('totalCount').textContent = questions.length;
}

function restartQuiz() {
  current = 0; score = 0;
  answered = new Array(questions.length).fill(false);
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('quizArea').style.display = 'block';
  buildQuiz();
}

buildQuiz();
</script>
</body>
</html>

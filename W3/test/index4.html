<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz — IAM & Security</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;padding:32px 16px}
    .container{max-width:760px;margin:0 auto}
    header{margin-bottom:40px;text-align:center}
    header h1{font-size:1.8rem;font-weight:700;color:#fff;margin-bottom:8px}
    header p{color:#94a3b8;font-size:.95rem}
    .progress-bar-wrap{background:#1e2330;border-radius:99px;height:6px;margin-bottom:32px;overflow:hidden}
    .progress-bar{height:100%;background:linear-gradient(90deg,#ec4899,#8b5cf6);border-radius:99px;transition:width .4s ease;width:0%}
    .question-card{background:#1a1f2e;border:1px solid #2d3448;border-radius:16px;padding:28px;margin-bottom:20px;display:none;animation:fadeIn .3s ease}
    .question-card.active{display:block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .question-meta{font-size:.78rem;color:#ec4899;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
    .question-text{font-size:1.05rem;font-weight:500;color:#f1f5f9;line-height:1.6;margin-bottom:22px}
    .options{display:flex;flex-direction:column;gap:10px}
    .option{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:10px;border:1.5px solid #2d3448;cursor:pointer;transition:all .18s ease;background:#0f1117}
    .option:hover:not(.disabled){border-color:#ec4899;background:#1e2330}
    .option-letter{width:26px;height:26px;min-width:26px;border-radius:50%;background:#2d3448;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;color:#94a3b8;transition:all .18s ease}
    .option-text{font-size:.95rem;color:#cbd5e1;line-height:1.5;padding-top:2px}
    .option.correct{border-color:#22c55e;background:rgba(34,197,94,.08)}.option.correct .option-letter{background:#22c55e;color:#fff}
    .option.wrong{border-color:#ef4444;background:rgba(239,68,68,.08)}.option.wrong .option-letter{background:#ef4444;color:#fff}
    .option.disabled{cursor:default}
    .explanation{margin-top:16px;padding:14px 16px;background:#0f1117;border-left:3px solid #ec4899;border-radius:0 8px 8px 0;font-size:.88rem;color:#94a3b8;line-height:1.6;display:none}
    .explanation.show{display:block}.explanation strong{color:#f9a8d4}
    .nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:12px}
    .btn{padding:10px 24px;border-radius:8px;border:none;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .18s ease}
    .btn-primary{background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff}
    .btn-primary:hover{opacity:.88;transform:translateY(-1px)}.btn-primary:disabled{opacity:.4;cursor:default;transform:none}
    .btn-ghost{background:transparent;color:#94a3b8;border:1.5px solid #2d3448}.btn-ghost:hover{border-color:#ec4899;color:#f9a8d4}
    .score-counter{font-size:.85rem;color:#64748b}
    .result-screen{display:none;text-align:center;padding:48px 24px;background:#1a1f2e;border:1px solid #2d3448;border-radius:16px;animation:fadeIn .4s ease}
    .result-screen.show{display:block}
    .result-emoji{font-size:4rem;margin-bottom:16px}.result-score{font-size:3rem;font-weight:800;color:#fff;margin-bottom:8px}
    .result-label{font-size:1.1rem;color:#94a3b8;margin-bottom:32px}
    .result-breakdown{display:flex;justify-content:center;gap:32px;margin-bottom:36px}
    .breakdown-item{text-align:center}.breakdown-num{font-size:1.8rem;font-weight:700}
    .breakdown-num.correct-num{color:#22c55e}.breakdown-num.wrong-num{color:#ef4444}
    .breakdown-label{font-size:.8rem;color:#64748b;margin-top:4px}
    .btn-restart{background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff;padding:12px 32px;border-radius:10px;border:none;font-size:1rem;font-weight:600;cursor:pointer}
    .btn-restart:hover{opacity:.88}
  </style>
</head>
<body>
<div class="container">
  <header><h1>IAM & Security</h1><p>20 câu hỏi · Kiểm tra kiến thức sau khi đọc topic summary</p></header>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div id="quizArea"></div>
  <div class="result-screen" id="resultScreen">
    <div class="result-emoji" id="resultEmoji"></div><div class="result-score" id="resultScore"></div>
    <div class="result-label" id="resultLabel"></div>
    <div class="result-breakdown">
      <div class="breakdown-item"><div class="breakdown-num correct-num" id="correctCount"></div><div class="breakdown-label">Đúng</div></div>
      <div class="breakdown-item"><div class="breakdown-num wrong-num" id="wrongCount"></div><div class="breakdown-label">Sai</div></div>
      <div class="breakdown-item"><div class="breakdown-num" style="color:#ec4899" id="totalCount"></div><div class="breakdown-label">Tổng</div></div>
    </div>
    <button class="btn-restart" onclick="restartQuiz()">Làm lại từ đầu</button>
  </div>
</div>
<script>
const questions=[
  {q:"IAM là gì và thuộc loại service nào?",options:["Regional service — mỗi Region có IAM riêng","Global service — quản lý authentication và authorization cho AWS resources","Paid service — tính phí theo số users","Service chỉ dùng cho EC2 và Lambda"],answer:1,explanation:"<strong>IAM là Global service</strong> — không gắn với Region cụ thể, miễn phí. Quản lý <strong>ai</strong> (authentication) được làm <strong>gì</strong> (authorization) với AWS resources."},
  {q:"IAM User mặc định có quyền gì khi mới tạo?",options:["Quyền đọc tất cả resources","Quyền admin giới hạn trong 1 Region","Không có quyền gì — phải gán policy","Quyền tương tự root account"],answer:2,explanation:"IAM User mới tạo <strong>không có quyền gì</strong> — phải gán policy để cấp quyền. Đây là nguyên tắc Least Privilege — bắt đầu từ zero permission."},
  {q:"IAM Role khác IAM User ở điểm nào quan trọng nhất?",options:["Role chỉ dùng được trong 1 Region","Role không có long-term credentials — dùng temporary security tokens (STS)","Role không thể gán policy","Role chỉ dùng cho con người, không dùng cho services"],answer:1,explanation:"<strong>IAM Role</strong> không có long-term credentials (password, access key). Khi EC2/Lambda assume role, AWS cấp <strong>temporary security tokens (STS)</strong> — tự động expire. An toàn hơn long-term credentials."},
  {q:"Khi có nhiều IAM policies, thứ tự evaluate là gì?",options:["Allow luôn thắng Deny","Deny luôn thắng Allow, sau đó mới xét Allow, mặc định là Deny","Policy gán trực tiếp cho User thắng policy từ Group","Policy mới nhất được tạo sẽ được ưu tiên"],answer:1,explanation:"Thứ tự: 1) <strong>Explicit Deny</strong> → luôn thắng dù có Allow ở đâu. 2) <strong>Explicit Allow</strong> → được phép. 3) <strong>Implicit Deny</strong> → mặc định deny nếu không có Allow nào. Explicit Deny không thể override bằng Allow."},
  {q:"Nguyên tắc Least Privilege có nghĩa là gì?",options:["Cấp quyền admin cho tất cả để tiện làm việc","Chỉ cấp đúng quyền cần thiết, không hơn","Cấp quyền tối thiểu là read-only cho mọi user","Không cấp quyền gì cho đến khi có yêu cầu cụ thể"],answer:1,explanation:"<strong>Least Privilege</strong> = chỉ cấp đúng quyền cần thiết. Ví dụ: nếu Lambda chỉ cần đọc/ghi S3, chỉ cấp s3:GetObject và s3:PutObject — không cấp s3:* để tránh accidental delete."},
  {q:"Authentication và Authorization khác gì nhau?",options:["Không có sự khác biệt — cùng là xác thực","Authentication = Bạn là ai? Authorization = Bạn được làm gì?","Authentication = Bạn được làm gì? Authorization = Bạn là ai?","Authentication dùng IAM Policy, Authorization dùng MFA"],answer:1,explanation:"<strong>Authentication</strong> = xác thực danh tính (Bạn là ai?) — dùng username/password, access key, MFA. <strong>Authorization</strong> = xác định quyền hạn (Bạn được làm gì?) — dùng IAM Policy."},
  {q:"MFA nên bật bắt buộc cho những account nào?",options:["Chỉ cần bật cho root account","Root account và IAM users có quyền cao","Tất cả IAM users không ngoại lệ","Chỉ cần bật khi access từ IP lạ"],answer:1,explanation:"<strong>MFA bắt buộc</strong> cho root account và IAM users có quyền cao (admin). Root account có toàn quyền không giới hạn — nếu bị compromise là thảm họa. Best practice: bật MFA, không dùng root account cho daily tasks."},
  {q:"AWS KMS dùng để làm gì?",options:["Monitor và alert khi có security threats","Tạo và quản lý encryption keys cho AWS services","Scan vulnerabilities trong EC2 instances","Ghi lại mọi API calls trong account"],answer:1,explanation:"<strong>KMS (Key Management Service)</strong> tạo và quản lý encryption keys. Tích hợp với S3, RDS, EBS, Lambda... CMK (Customer Managed Key) = bạn tạo và quản lý. AWS Managed Key = AWS lo. Mọi thao tác với key được audit qua CloudTrail."},
  {q:"CloudTrail ghi lại những gì?",options:["CPU và memory metrics của EC2","Mọi API calls trong AWS account — ai làm gì, lúc nào, từ đâu","Network traffic giữa các services","Application logs từ Lambda functions"],answer:1,explanation:"<strong>CloudTrail</strong> ghi lại mọi API call: ai (user/role), làm gì (action), lúc nào (timestamp), từ đâu (IP). Dùng cho security audit, compliance, troubleshooting. Log lưu vào S3, query bằng Athena. Bật mặc định 90 ngày."},
  {q:"GuardDuty phát hiện threats bằng cách nào?",options:["Cài agent trên EC2 để monitor processes","Phân tích VPC Flow Logs, CloudTrail, và DNS logs tự động","Scan code của Lambda functions","Kiểm tra IAM policies định kỳ"],answer:1,explanation:"<strong>GuardDuty</strong> phân tích VPC Flow Logs, CloudTrail events, và DNS logs để phát hiện suspicious activity. <strong>Không cần cài agent</strong> — enable là chạy. Phát hiện: EC2 communicate với malicious IP, unusual API calls, crypto mining..."},
  {q:"AWS WAF bảo vệ ở layer nào và chống lại loại tấn công nào?",options:["Layer 3/4 — chống DDoS volumetric attacks","Layer 7 — chống SQL injection, XSS, bad bots","Layer 2 — chống MAC spoofing","Layer 5/6 — chống session hijacking"],answer:1,explanation:"<strong>WAF (Web Application Firewall)</strong> hoạt động ở <strong>Layer 7 (Application)</strong> — chống SQL injection, XSS, DDoS layer 7, bad bots. Gắn vào CloudFront, ALB, API Gateway. Shield bảo vệ layer 3/4 chống DDoS volumetric."},
  {q:"Sự khác biệt giữa Shield Standard và Shield Advanced là gì?",options:["Standard chỉ bảo vệ EC2, Advanced bảo vệ tất cả services","Standard miễn phí tự động, Advanced trả phí với 24/7 DDoS Response Team","Standard chỉ bảo vệ 1 Region, Advanced bảo vệ global","Không có sự khác biệt về tính năng"],answer:1,explanation:"<strong>Shield Standard</strong>: miễn phí, tự động bảo vệ tất cả AWS resources khỏi DDoS cơ bản. <strong>Shield Advanced</strong>: trả phí, bảo vệ nâng cao, 24/7 DDoS Response Team, cost protection (hoàn tiền nếu bị tấn công gây tăng chi phí)."},
  {q:"AWS Inspector dùng để làm gì?",options:["Monitor application performance","Vulnerability scanning cho EC2 và container images","Audit IAM permissions","Detect data leakage trong S3"],answer:1,explanation:"<strong>AWS Inspector</strong> tự động scan vulnerabilities (CVEs) trong EC2 instances và container images. Tích hợp với ECR để scan images trước khi deploy. Tự động scan khi có CVE mới được publish."},
  {q:"Encryption at Rest và Encryption in Transit khác gì nhau?",options:["Không có sự khác biệt — cùng dùng TLS","At Rest = mã hóa khi lưu trữ, In Transit = mã hóa khi truyền qua network","At Rest = mã hóa database, In Transit = mã hóa S3","At Rest dùng KMS, In Transit không cần encryption"],answer:1,explanation:"<strong>Encryption at Rest</strong> = data được mã hóa khi lưu trữ (S3 SSE, EBS encryption, RDS encryption). <strong>Encryption in Transit</strong> = data được mã hóa khi truyền qua network (HTTPS/TLS cho web, SSL/TLS cho database connections)."},
  {q:"S3 SSE-KMS khác SSE-S3 ở điểm nào?",options:["SSE-KMS nhanh hơn SSE-S3","SSE-KMS dùng KMS key — bạn kiểm soát key và có audit trail, SSE-S3 dùng AWS managed key đơn giản hơn","SSE-S3 mạnh hơn SSE-KMS về mặt encryption","SSE-KMS miễn phí, SSE-S3 tính phí"],answer:1,explanation:"<strong>SSE-KMS</strong> dùng KMS key — bạn kiểm soát key rotation, có audit trail qua CloudTrail, có thể dùng CMK. <strong>SSE-S3</strong> dùng AWS managed key — đơn giản hơn, không có audit trail riêng. SSE-C = bạn tự cung cấp key."},
  {q:"Tại sao không nên dùng root account cho daily tasks?",options:["Root account chậm hơn IAM user","Root account có toàn quyền không giới hạn — nếu bị compromise là thảm họa","Root account không thể access một số services","Root account không hỗ trợ MFA"],answer:1,explanation:"<strong>Root account có toàn quyền tuyệt đối</strong> — không thể restrict bằng IAM policy. Nếu credentials bị lộ, attacker có thể làm bất cứ điều gì. Best practice: bật MFA cho root, tạo IAM admin user cho daily tasks, chỉ dùng root cho billing và account management."},
  {q:"IAM Group có thể chứa những gì?",options:["Users và Roles","Chỉ Users","Users, Roles, và Groups khác","Chỉ Roles"],answer:1,explanation:"<strong>IAM Group chỉ chứa Users</strong> — không chứa Roles hay Groups khác. Gán policy vào Group → tất cả Users trong Group thừa hưởng. User có thể thuộc nhiều Groups."},
  {q:"CloudTrail vs CloudWatch — dùng để làm gì?",options:["Cả hai đều monitor application performance","CloudTrail = audit API calls, CloudWatch = monitor metrics và logs","CloudWatch = audit API calls, CloudTrail = monitor metrics","Cả hai đều ghi lại API calls"],answer:1,explanation:"<strong>CloudTrail</strong> = audit trail — ghi lại mọi API call (ai làm gì với AWS resources). <strong>CloudWatch</strong> = monitoring — metrics (CPU, memory), logs (application logs), alarms, dashboards. Khác nhau hoàn toàn về mục đích."},
  {q:"Explicit Deny trong IAM policy có thể bị override bởi Allow không?",options:["Có, nếu Allow policy được gán trực tiếp cho User","Có, nếu User là admin","Không — Explicit Deny luôn thắng, không thể override","Có, nếu dùng Permission Boundary"],answer:2,explanation:"<strong>Explicit Deny luôn thắng</strong> — không thể override bằng bất kỳ Allow nào, dù Allow được gán ở đâu (User, Group, Role). Đây là lý do Explicit Deny rất mạnh và cần dùng cẩn thận."},
  {q:"Khi Lambda cần gọi DynamoDB, cần setup gì về IAM?",options:["Tạo IAM User với access key và hardcode vào Lambda code","Gán IAM Role cho Lambda với policy cho phép DynamoDB actions","Không cần — Lambda tự động có quyền gọi tất cả AWS services","Tạo IAM Group và thêm Lambda vào Group"],answer:1,explanation:"Lambda cần <strong>IAM Execution Role</strong> với policy cho phép DynamoDB actions (dynamodb:GetItem, PutItem...). Không hardcode credentials — Lambda assume role và nhận temporary tokens tự động. Đây là best practice cho service-to-service authentication."}
];
let current=0,score=0,answered=new Array(questions.length).fill(false);
function buildQuiz(){
  const area=document.getElementById('quizArea');area.innerHTML='';
  const letters=['A','B','C','D'];
  questions.forEach((q,i)=>{
    const card=document.createElement('div');
    card.className='question-card'+(i===0?' active':'');card.id=`card-${i}`;
    const opts=q.options.map((opt,j)=>`<div class="option" id="opt-${i}-${j}" onclick="selectOption(${i},${j})"><div class="option-letter">${letters[j]}</div><div class="option-text">${opt}</div></div>`).join('');
    card.innerHTML=`<div class="question-meta">Câu ${i+1} / ${questions.length}</div><div class="question-text">${q.q}</div><div class="options">${opts}</div><div class="explanation" id="exp-${i}">💡 ${q.explanation}</div>`;
    area.appendChild(card);
  });
  const nav=document.createElement('div');nav.className='nav';nav.id='navBar';
  nav.innerHTML=`<button class="btn btn-ghost" id="btnPrev" onclick="navigate(-1)" disabled>← Trước</button><span class="score-counter" id="scoreCounter">0 / ${questions.length} đúng</span><button class="btn btn-primary" id="btnNext" onclick="navigate(1)" disabled>Tiếp →</button>`;
  area.appendChild(nav);updateProgress();
}
function selectOption(qIdx,optIdx){
  if(answered[qIdx])return;answered[qIdx]=true;
  const q=questions[qIdx];
  q.options.forEach((_,j)=>{const el=document.getElementById(`opt-${qIdx}-${j}`);el.classList.add('disabled');if(j===q.answer)el.classList.add('correct');else if(j===optIdx)el.classList.add('wrong');});
  if(optIdx===q.answer)score++;
  document.getElementById(`exp-${qIdx}`).classList.add('show');
  document.getElementById('scoreCounter').textContent=`${score} / ${questions.length} đúng`;
  document.getElementById('btnNext').disabled=false;
  if(current===questions.length-1)document.getElementById('btnNext').textContent='Xem kết quả →';
  updateProgress();
}
function navigate(dir){
  const cards=document.querySelectorAll('.question-card');cards[current].classList.remove('active');current+=dir;
  if(current>=questions.length){showResult();return;}
  cards[current].classList.add('active');
  document.getElementById('btnPrev').disabled=current===0;
  document.getElementById('btnNext').disabled=!answered[current];
  document.getElementById('btnNext').textContent=current===questions.length-1&&answered[current]?'Xem kết quả →':'Tiếp →';
  updateProgress();
}
function updateProgress(){document.getElementById('progressBar').style.width=((current+1)/questions.length*100)+'%';}
function showResult(){
  document.getElementById('quizArea').style.display='none';
  document.getElementById('resultScreen').classList.add('show');
  const pct=Math.round(score/questions.length*100);
  const data=pct>=90?['🏆','Xuất sắc! Bạn nắm vững IAM & Security rồi.']:pct>=75?['🎯','Tốt lắm! Ôn lại vài điểm nhỏ là hoàn hảo.']:pct>=60?['📚','Khá ổn. Đọc lại phần bạn còn nhầm nhé.']:['💪','Cần ôn thêm. Đọc lại file summary và thử lại!'];
  document.getElementById('resultEmoji').textContent=data[0];document.getElementById('resultScore').textContent=pct+'%';document.getElementById('resultLabel').textContent=data[1];
  document.getElementById('correctCount').textContent=score;document.getElementById('wrongCount').textContent=questions.length-score;document.getElementById('totalCount').textContent=questions.length;
}
function restartQuiz(){current=0;score=0;answered=new Array(questions.length).fill(false);document.getElementById('resultScreen').classList.remove('show');document.getElementById('quizArea').style.display='block';buildQuiz();}
buildQuiz();
</script>
</body></html>

  <title>Domain 2 — Security & Compliance v2 | CLF-C02 Quiz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
    header { background: linear-gradient(135deg, #1a1f2e, #232b3e); border-bottom: 2px solid #ef4444; padding: 24px 32px; display: flex; align-items: center; gap: 16px; }
    .aws-badge { background: #ef4444; color: #fff; font-weight: 800; padding: 6px 14px; border-radius: 6px; font-size: 13px; letter-spacing: 1px; }
    .v2-badge { background: #7c3aed; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; margin-left: 8px; }
    header h1 { font-size: 22px; font-weight: 700; }
    header p { font-size: 13px; color: #94a3b8; margin-top: 2px; }
    .progress-bar-wrap { background: #1e2535; padding: 12px 32px; border-bottom: 1px solid #2d3748; }
    .progress-bar-track { background: #2d3748; border-radius: 99px; height: 8px; overflow: hidden; }
    .progress-bar-fill { background: #ef4444; height: 100%; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
    .progress-label { font-size: 12px; color: #64748b; margin-top: 6px; }
    main { max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; }
    .question-card { background: #1a1f2e; border: 1px solid #2d3748; border-radius: 12px; padding: 28px; margin-bottom: 24px; display: none; }
    .question-card.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    .q-number { font-size: 12px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .q-tag { font-size: 11px; background: #3b0a0a; color: #fca5a5; padding: 3px 10px; border-radius: 99px; }
    .q-diff { font-size: 11px; padding: 3px 10px; border-radius: 99px; }
    .diff-medium { background: #1c3a1c; color: #4ade80; }
    .diff-hard { background: #3a1c1c; color: #f87171; }
    .q-scenario { background: #0f1a2e; border-left: 3px solid #3b82f6; padding: 12px 16px; border-radius: 0 8px 8px 0; margin-bottom: 16px; font-size: 14px; color: #93c5fd; line-height: 1.6; }
    .q-text { font-size: 17px; font-weight: 500; line-height: 1.6; margin-bottom: 24px; color: #f1f5f9; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option { display: flex; align-items: flex-start; gap: 12px; background: #0f1117; border: 1.5px solid #2d3748; border-radius: 8px; padding: 14px 16px; cursor: pointer; transition: all 0.2s; }
    .option:hover:not(.disabled) { border-color: #ef4444; background: #1a1f2e; }
    .option.correct { border-color: #22c55e; background: #052e16; }
    .option.wrong { border-color: #ef4444; background: #2d0a0a; }
    .option.disabled { cursor: default; }
    .opt-letter { min-width: 28px; height: 28px; border-radius: 50%; background: #2d3748; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #94a3b8; flex-shrink: 0; }
    .option.correct .opt-letter { background: #22c55e; color: #fff; }
    .option.wrong .opt-letter { background: #ef4444; color: #fff; }
    .opt-text { font-size: 15px; line-height: 1.5; padding-top: 2px; }
    .explanation { margin-top: 20px; padding: 16px; background: #0d1f0d; border-left: 4px solid #22c55e; border-radius: 0 8px 8px 0; font-size: 14px; line-height: 1.6; color: #86efac; display: none; }
    .explanation.wrong-exp { background: #1a0a0a; border-color: #ef4444; color: #fca5a5; }
    .explanation.show { display: block; animation: fadeIn 0.3s ease; }
    .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; }
    .btn { padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: #ef4444; color: #fff; }
    .btn-primary:hover { background: #dc2626; }
    .btn-secondary { background: #2d3748; color: #e2e8f0; }
    .btn-secondary:hover { background: #374151; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #results { display: none; text-align: center; background: #1a1f2e; border: 1px solid #2d3748; border-radius: 16px; padding: 48px 32px; }
    .score-circle { width: 140px; height: 140px; border-radius: 50%; border: 6px solid #ef4444; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 24px; }
    .score-num { font-size: 42px; font-weight: 800; color: #ef4444; }
    .score-label { font-size: 13px; color: #64748b; }
    #results h2 { font-size: 26px; margin-bottom: 8px; }
    #results p { color: #94a3b8; margin-bottom: 32px; }
    .result-stats { display: flex; gap: 24px; justify-content: center; margin-bottom: 32px; flex-wrap: wrap; }
    .stat-box { background: #0f1117; border: 1px solid #2d3748; border-radius: 10px; padding: 16px 24px; min-width: 120px; }
    .stat-box .val { font-size: 28px; font-weight: 700; }
    .stat-box .lbl { font-size: 12px; color: #64748b; margin-top: 4px; }
    .correct-val { color: #22c55e; } .wrong-val { color: #ef4444; }
    .pass { color: #22c55e; } .fail { color: #ef4444; }
  </style>
</head>
<body>
<header>
  <div class="aws-badge">CLF-C02</div>
  <div>
    <h1>Domain 2: Security and Compliance <span class="v2-badge">v2 · Harder</span></h1>
    <p>30% of scored content &nbsp;·&nbsp; 30 questions &nbsp;·&nbsp; Scenario-based &amp; tricky</p>
  </div>
</header>
<div class="progress-bar-wrap">
  <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">Question 1 of 30</div>
</div>
<main>
  <div id="quiz-container"></div>
  <div id="results">
    <div class="score-circle"><span class="score-num" id="scoreNum">0%</span><span class="score-label">Score</span></div>
    <h2 id="resultTitle"></h2><p id="resultMsg"></p>
    <div class="result-stats">
      <div class="stat-box"><div class="val correct-val" id="correctCount">0</div><div class="lbl">Correct</div></div>
      <div class="stat-box"><div class="val wrong-val" id="wrongCount">0</div><div class="lbl">Incorrect</div></div>
      <div class="stat-box"><div class="val" id="totalCount">30</div><div class="lbl">Total</div></div>
    </div>
    <button class="btn btn-primary" onclick="restartQuiz()">🔄 Restart Quiz</button>
  </div>
</main>

<script>
const questions = [
  {
    tag:"Shared Responsibility", diff:"hard",
    scenario:"A company runs a web app on EC2. They were breached because the OS had an unpatched vulnerability that was 6 months old.",
    text:"Under the Shared Responsibility Model, who is responsible for this breach?",
    options:["AWS, because they manage EC2 infrastructure","The customer, because patching the guest OS on EC2 is the customer's responsibility","Both equally, because AWS should have notified the customer","Neither — this is a force majeure event"],
    answer:1,
    explanation:"EC2 is IaaS. AWS manages the hypervisor and physical hardware, but the customer is fully responsible for the guest OS — including patching. This is a classic exam trap: 'EC2' sounds like AWS manages it, but the OS layer belongs to the customer."
  },
  {
    tag:"Shared Responsibility", diff:"hard",
    text:"Which of the following CORRECTLY maps responsibility under the Shared Responsibility Model?",
    options:[
      "AWS: S3 bucket policies | Customer: S3 physical storage durability",
      "AWS: Physical data center security | Customer: IAM user permissions",
      "AWS: EC2 guest OS patching | Customer: EC2 hypervisor patching",
      "AWS: RDS data encryption | Customer: RDS hardware maintenance"
    ],
    answer:1,
    explanation:"AWS is responsible for physical data center security (locks, guards, cameras). Customers are responsible for IAM user permissions. The other options are reversed: customers manage S3 bucket policies and EC2 guest OS; AWS manages the hypervisor and RDS hardware."
  },
  {
    tag:"Shared Responsibility", diff:"hard",
    scenario:"A company uses AWS Lambda. A security audit finds that the Lambda function has overly permissive IAM permissions and is logging sensitive customer data in plaintext.",
    text:"Which of these issues is the CUSTOMER's responsibility to fix?",
    options:[
      "The underlying Lambda runtime environment security",
      "Both the IAM permissions and the logging of sensitive data",
      "The physical server running the Lambda function",
      "The Lambda service availability SLA"
    ],
    answer:1,
    explanation:"With Lambda (serverless), AWS manages the runtime, OS, and physical infrastructure. The customer is responsible for: function code, IAM execution role permissions, environment variables, and what data gets logged. Both overly permissive IAM and plaintext logging are customer responsibilities."
  },
  {
    tag:"IAM", diff:"hard",
    scenario:"A developer accidentally committed AWS access keys to a public GitHub repository. The keys were exposed for 2 hours before being discovered.",
    text:"What should be done FIRST?",
    options:[
      "Rotate the access keys by creating new ones",
      "Immediately deactivate or delete the compromised access keys, then investigate what actions were taken",
      "Enable MFA on the IAM user",
      "Change the IAM user's password"
    ],
    answer:1,
    explanation:"When credentials are compromised, the FIRST action is to immediately deactivate/delete the exposed keys to stop any ongoing unauthorized access. Then use CloudTrail to investigate what actions were taken with those keys. Rotating (creating new keys) without deactivating the old ones leaves the threat active."
  },
  {
    tag:"IAM", diff:"hard",
    text:"A company has 500 developers who all need read-only access to S3. What is the MOST efficient and secure way to manage this?",
    options:[
      "Attach an S3 read-only policy directly to each of the 500 IAM users",
      "Create one IAM user and share the credentials with all developers",
      "Create an IAM Group with the S3 read-only policy attached, then add all developers to the group",
      "Give all developers root account access"
    ],
    answer:2,
    explanation:"IAM Groups allow you to manage permissions for multiple users efficiently. Attach the policy once to the group, and all members inherit it. Adding/removing users from the group is far more manageable than attaching policies to 500 individual users. Never share credentials."
  },
  {
    tag:"IAM", diff:"hard",
    scenario:"An application running on EC2 needs to call DynamoDB. A junior developer suggests storing the IAM access keys in a config file on the EC2 instance.",
    text:"Why is this a security risk, and what is the correct solution?",
    options:[
      "Config files are not supported on EC2; use environment variables instead",
      "Access keys in config files can be exposed if the instance is compromised; use an IAM Role attached to the EC2 instance instead",
      "DynamoDB does not support IAM authentication; use a database password",
      "Config files are encrypted by default, so this is acceptable"
    ],
    answer:1,
    explanation:"Hardcoded access keys in files are a major security risk — they can be exposed via instance metadata, code repositories, or if the instance is compromised. IAM Roles provide temporary, automatically-rotated credentials via the EC2 instance metadata service, with no keys to manage or expose."
  },
  {
    tag:"IAM", diff:"hard",
    text:"What is the difference between an IAM Role and an IAM User?",
    options:[
      "Roles are for humans; Users are for applications",
      "Users have permanent long-term credentials; Roles provide temporary credentials and can be assumed by users, services, or applications",
      "Roles can only be used within a single AWS account",
      "Users are more secure than Roles because they require MFA"
    ],
    answer:1,
    explanation:"IAM Users have permanent credentials (password + access keys). IAM Roles provide temporary security credentials (via STS) and can be assumed by AWS services (EC2, Lambda), IAM users, or external identities (federated users). Roles are preferred for applications and cross-account access."
  },
  {
    tag:"IAM", diff:"medium",
    text:"A company uses Microsoft Active Directory on-premises and wants employees to log into AWS using their existing AD credentials. Which AWS service enables this?",
    options:[
      "AWS IAM with SAML federation",
      "Amazon Cognito",
      "AWS IAM Identity Center (SSO) with AD Connector",
      "AWS Directory Service for Microsoft AD"
    ],
    answer:2,
    explanation:"AWS IAM Identity Center (SSO) with AD Connector allows employees to use their existing Active Directory credentials to sign into AWS accounts and applications via SAML 2.0 federation. AD Connector proxies authentication requests to the on-premises AD without syncing data to AWS."
  },
  {
    tag:"IAM", diff:"hard",
    text:"Which IAM policy evaluation rule is MOST important to understand for the exam?",
    options:[
      "Allow statements always override Deny statements",
      "The most recently created policy takes precedence",
      "An explicit Deny always overrides any Allow, regardless of other policies",
      "Inline policies take precedence over managed policies"
    ],
    answer:2,
    explanation:"The most critical IAM rule: explicit Deny ALWAYS wins. Even if 10 policies Allow an action, a single explicit Deny blocks it. The default is also implicit Deny — if no policy explicitly Allows an action, it is denied. This is fundamental to understanding IAM policy evaluation."
  },
  {
    tag:"Security Services", diff:"hard",
    scenario:"A company's security team notices unusual API calls in their AWS account — specifically, someone is calling ec2:DescribeInstances and s3:ListBuckets from an IP address in a foreign country at 3 AM.",
    text:"Which AWS service would have AUTOMATICALLY detected this suspicious activity?",
    options:[
      "AWS CloudTrail — it records all API calls",
      "Amazon GuardDuty — it uses ML to detect anomalous behavior like unusual API calls from unexpected locations",
      "AWS Config — it tracks configuration changes",
      "Amazon Inspector — it scans for vulnerabilities"
    ],
    answer:1,
    explanation:"GuardDuty uses ML to analyze CloudTrail, VPC Flow Logs, and DNS logs to detect threats like unusual API activity, reconnaissance, and credential compromise. CloudTrail records the calls but doesn't automatically detect anomalies — you'd need to manually review logs. GuardDuty does the detection automatically."
  },
  {
    tag:"Security Services", diff:"hard",
    text:"What is the key difference between Amazon GuardDuty and Amazon Inspector?",
    options:[
      "GuardDuty is for network security; Inspector is for application security",
      "GuardDuty detects active threats and anomalous behavior in your account; Inspector scans workloads for software vulnerabilities and misconfigurations",
      "Inspector is more expensive than GuardDuty",
      "GuardDuty requires agents on EC2; Inspector does not"
    ],
    answer:1,
    explanation:"GuardDuty = threat detection (who is attacking you right now — anomalous API calls, malware, crypto mining). Inspector = vulnerability assessment (what weaknesses exist in your EC2/containers — CVEs, open ports, unpatched software). GuardDuty requires no agents; Inspector uses an agent for EC2."
  },
  {
    tag:"Security Services", diff:"hard",
    scenario:"A company stores thousands of S3 buckets containing customer data. They need to automatically identify which buckets contain PII (names, SSNs, credit card numbers) and alert when data is publicly exposed.",
    text:"Which AWS service is designed for this use case?",
    options:[
      "Amazon GuardDuty",
      "Amazon Inspector",
      "Amazon Macie",
      "AWS Security Hub"
    ],
    answer:2,
    explanation:"Amazon Macie uses ML to automatically discover and classify sensitive data in S3, including PII, financial data, and credentials. It alerts when sensitive data is in publicly accessible buckets or shared with external accounts. GuardDuty detects threats; Inspector scans for vulnerabilities — neither classifies data content."
  },
  {
    tag:"Security Services", diff:"hard",
    text:"A company wants to protect their ALB-fronted web application from OWASP Top 10 attacks. Which combination of services provides the BEST protection?",
    options:[
      "AWS Shield Standard + Security Groups",
      "AWS WAF with managed rule groups + AWS Shield Advanced",
      "Amazon GuardDuty + Amazon Inspector",
      "Network ACLs + Security Groups"
    ],
    answer:1,
    explanation:"AWS WAF with managed rule groups (including OWASP Top 10 rules from AWS or third parties) filters malicious HTTP requests at Layer 7. Shield Advanced adds DDoS protection and 24/7 DDoS response team access. Security Groups and NACLs operate at Layer 3/4 and cannot inspect HTTP content."
  },
  {
    tag:"Compliance", diff:"hard",
    text:"What is the difference between AWS CloudTrail and AWS Config?",
    options:[
      "CloudTrail monitors performance; Config monitors security",
      "CloudTrail records WHO did WHAT API action and WHEN; Config records WHAT the resource configuration looks like and HOW it changed over time",
      "Config records API calls; CloudTrail records configuration changes",
      "They are the same service with different names"
    ],
    answer:1,
    explanation:"CloudTrail = audit log of API activity (who called what API, when, from where). Config = configuration history (what does this resource look like, what changed, does it comply with rules). Example: CloudTrail tells you 'Alice modified the security group at 2pm'. Config tells you 'the security group had port 22 open, then it was changed to closed'."
  },
  {
    tag:"Compliance", diff:"hard",
    scenario:"A financial company needs to prove to auditors that no S3 buckets have been made publicly accessible in the last 12 months.",
    text:"Which AWS service provides this historical compliance evidence?",
    options:[
      "AWS CloudTrail — shows who made API calls",
      "AWS Config — provides configuration history and compliance timeline for resources",
      "Amazon Macie — detects public S3 buckets",
      "AWS Trusted Advisor — checks for public S3 buckets"
    ],
    answer:1,
    explanation:"AWS Config records the configuration state of resources over time and evaluates compliance against rules. You can query Config to see the historical state of S3 bucket ACLs and policies over the past 12 months, providing auditable compliance evidence. CloudTrail shows who made changes but not the full configuration state."
  },
  {
    tag:"Compliance", diff:"medium",
    text:"A company needs to sign a Business Associate Agreement (BAA) with AWS to process healthcare data under HIPAA. Where do they access this agreement?",
    options:[
      "AWS Support ticket",
      "AWS Artifact — provides compliance reports and agreements on demand",
      "AWS Trusted Advisor",
      "AWS Health Dashboard"
    ],
    answer:1,
    explanation:"AWS Artifact provides on-demand access to AWS compliance reports AND agreements, including the HIPAA BAA. Customers can review and accept the BAA directly through the AWS Console without contacting AWS Support. It also provides SOC reports, PCI DSS certifications, and ISO certificates."
  },
  {
    tag:"Encryption", diff:"hard",
    text:"A company wants to encrypt their RDS database. They want to manage the encryption keys themselves and rotate them on a custom schedule. Which approach should they use?",
    options:[
      "Use AWS-managed keys (aws/rds) in KMS — AWS handles rotation automatically",
      "Use customer-managed keys (CMK) in AWS KMS — the customer controls key policy and rotation schedule",
      "Use AWS CloudHSM for all database encryption",
      "Encryption is handled automatically by RDS with no configuration needed"
    ],
    answer:1,
    explanation:"Customer-managed keys (CMKs) in AWS KMS give you full control: you define the key policy (who can use/manage the key), enable/disable the key, and set a custom rotation schedule. AWS-managed keys are simpler but AWS controls the rotation (annual). CloudHSM is for dedicated hardware security modules — more expensive and complex."
  },
  {
    tag:"Encryption", diff:"hard",
    text:"What is the difference between AWS KMS and AWS CloudHSM?",
    options:[
      "KMS is for asymmetric encryption; CloudHSM is for symmetric encryption",
      "KMS is a managed multi-tenant key management service; CloudHSM provides dedicated single-tenant hardware security modules for stricter compliance requirements",
      "CloudHSM is cheaper than KMS",
      "KMS integrates with AWS services; CloudHSM does not"
    ],
    answer:1,
    explanation:"KMS is a managed, multi-tenant service where AWS manages the HSM infrastructure — easy to use and integrates with 100+ AWS services. CloudHSM provides dedicated, single-tenant HSM hardware that you control exclusively — required for compliance standards (FIPS 140-2 Level 3) that mandate dedicated hardware. CloudHSM is significantly more expensive."
  },
  {
    tag:"Security Services", diff:"hard",
    text:"Which AWS service provides a centralized, aggregated view of security findings from GuardDuty, Inspector, Macie, and third-party tools, with a security score?",
    options:[
      "AWS CloudTrail",
      "Amazon Detective",
      "AWS Security Hub",
      "AWS Config"
    ],
    answer:2,
    explanation:"AWS Security Hub aggregates findings from multiple security services into a single dashboard, provides a security score based on CIS AWS Foundations Benchmark, and enables automated remediation. Amazon Detective is for deep investigation of specific incidents — it helps you understand the root cause after GuardDuty raises an alert."
  },
  {
    tag:"Security Services", diff:"hard",
    text:"After GuardDuty raises a finding about a potentially compromised EC2 instance, which service would you use to investigate the timeline of events and understand the full scope of the incident?",
    options:[
      "AWS Config",
      "AWS CloudTrail",
      "Amazon Detective",
      "AWS Security Hub"
    ],
    answer:2,
    explanation:"Amazon Detective automatically collects log data and uses ML to build interactive visualizations for security investigations. It helps you quickly analyze and determine the root cause of security findings — showing the timeline, related resources, and behavior patterns. It's designed to work alongside GuardDuty findings."
  },
  {
    tag:"IAM", diff:"hard",
    scenario:"A company uses AWS Organizations with 20 accounts. They want to prevent ALL accounts in the organization from disabling CloudTrail, even if an account administrator tries to do so.",
    text:"Which feature should they use?",
    options:[
      "IAM Permission Boundaries",
      "AWS Config Rules",
      "Service Control Policies (SCPs) in AWS Organizations",
      "IAM Deny policies in each account"
    ],
    answer:2,
    explanation:"Service Control Policies (SCPs) in AWS Organizations set maximum permission guardrails for all accounts in the organization. An SCP denying cloudtrail:StopLogging applies to ALL accounts including root users of member accounts — even account admins cannot override it. This is the only way to enforce organization-wide restrictions."
  },
  {
    tag:"Shared Responsibility", diff:"hard",
    text:"A company uses Amazon DynamoDB. Which of the following is AWS responsible for?",
    options:[
      "Defining IAM policies that control who can access the DynamoDB tables",
      "Encrypting data at rest using customer-managed KMS keys",
      "Maintaining the underlying hardware, software, and infrastructure of the DynamoDB service",
      "Configuring VPC endpoints for private DynamoDB access"
    ],
    answer:2,
    explanation:"DynamoDB is a fully managed service. AWS is responsible for the underlying infrastructure, software, patching, and availability of the service itself. The customer is responsible for: IAM access policies, choosing encryption keys, VPC endpoint configuration, and the data stored in the tables."
  },
  {
    tag:"Security Services", diff:"medium",
    text:"Which AWS service would you use to store and automatically rotate database passwords, API keys, and other secrets used by applications?",
    options:[
      "AWS KMS",
      "AWS Systems Manager Parameter Store",
      "AWS Secrets Manager",
      "AWS Certificate Manager"
    ],
    answer:2,
    explanation:"AWS Secrets Manager is specifically designed for storing, rotating, and managing secrets like database credentials and API keys. It can automatically rotate RDS passwords on a schedule. Parameter Store can store secrets but lacks automatic rotation. KMS manages encryption keys, not application secrets."
  },
  {
    tag:"Security Services", diff:"hard",
    text:"What is the difference between AWS Secrets Manager and AWS Systems Manager Parameter Store for storing secrets?",
    options:[
      "Parameter Store is more secure than Secrets Manager",
      "Secrets Manager supports automatic secret rotation and charges per secret; Parameter Store is cheaper but requires custom rotation logic",
      "They are identical services",
      "Secrets Manager only works with RDS; Parameter Store works with all services"
    ],
    answer:1,
    explanation:"Secrets Manager: built-in automatic rotation for RDS/Redshift/DocumentDB, charges ~$0.40/secret/month. Parameter Store: free tier available (Standard), supports SecureString with KMS encryption, but rotation requires custom Lambda functions. For automatic rotation, use Secrets Manager. For simple config values, Parameter Store is cost-effective."
  },
  {
    tag:"Compliance", diff:"hard",
    text:"A company needs to demonstrate to regulators that their AWS environment complies with PCI DSS. Which TWO actions should they take? (Choose the best single answer)",
    options:[
      "Download the AWS PCI DSS Attestation of Compliance from AWS Artifact, and implement required customer-side controls",
      "Contact AWS Support to request a PCI DSS certificate",
      "AWS is fully PCI DSS compliant so no customer action is needed",
      "Use AWS Config to automatically achieve PCI DSS compliance"
    ],
    answer:0,
    explanation:"PCI DSS compliance is shared: AWS provides its Attestation of Compliance (AoC) via AWS Artifact proving the infrastructure is PCI-compliant. But customers must also implement their own controls (encryption, access controls, logging, etc.) for their applications and data. AWS compliance does NOT automatically make customer workloads compliant."
  },
  {
    tag:"IAM", diff:"hard",
    text:"A company wants to allow users to log into the AWS Console using their Google Workspace accounts. Which AWS feature enables this?",
    options:[
      "IAM Users with Google passwords",
      "Identity federation using SAML 2.0 or OIDC with IAM Identity Center",
      "Amazon Cognito User Pools",
      "AWS Directory Service"
    ],
    answer:1,
    explanation:"Identity federation allows external identity providers (Google, Okta, Azure AD) to authenticate users who then receive temporary AWS credentials. IAM Identity Center supports SAML 2.0 and OIDC for enterprise SSO. Amazon Cognito is for customer-facing app authentication (mobile/web apps), not AWS Console access."
  },
  {
    tag:"Security Services", diff:"medium",
    text:"Which AWS service provides managed DDoS protection that is automatically applied to all AWS customers at no additional cost?",
    options:[
      "AWS WAF",
      "AWS Shield Advanced",
      "AWS Shield Standard",
      "Amazon GuardDuty"
    ],
    answer:2,
    explanation:"AWS Shield Standard is automatically enabled for all AWS customers at no cost. It protects against common Layer 3 (network) and Layer 4 (transport) DDoS attacks. Shield Advanced ($3,000/month) adds Layer 7 protection, DDoS cost protection, and 24/7 access to the AWS DDoS Response Team (DRT)."
  },
  {
    tag:"Security Services", diff:"hard",
    text:"A company wants to centrally manage AWS WAF rules, Shield Advanced protections, and VPC security groups across 50 AWS accounts in their organization. Which service should they use?",
    options:[
      "AWS Security Hub",
      "AWS Firewall Manager",
      "Amazon GuardDuty",
      "AWS Organizations SCPs"
    ],
    answer:1,
    explanation:"AWS Firewall Manager provides centralized management of security policies across multiple accounts in AWS Organizations. It automatically applies WAF rules, Shield Advanced protections, Security Groups, and Network Firewall policies to new accounts and resources as they are created — ensuring consistent security posture."
  },
  {
    tag:"Compliance", diff:"hard",
    scenario:"A company's security team wants to receive an alert whenever someone creates a new IAM user without MFA enabled.",
    text:"Which combination of services achieves this?",
    options:[
      "Amazon GuardDuty + SNS",
      "AWS Config Rule (iam-user-mfa-enabled) + SNS notification",
      "AWS CloudTrail + CloudWatch Logs + SNS",
      "Both B and C are valid approaches"
    ],
    answer:3,
    explanation:"Both approaches work: (B) AWS Config has a managed rule 'iam-user-mfa-enabled' that continuously evaluates compliance and can trigger SNS alerts. (C) CloudTrail logs the CreateUser API call, CloudWatch Logs can filter for it, and trigger an SNS alert. Config is simpler for compliance checks; CloudTrail+CloudWatch is more flexible for event-driven alerting."
  },
  {
    tag:"IAM", diff:"hard",
    text:"What is a Permissions Boundary in AWS IAM?",
    options:[
      "A policy that grants maximum permissions to an IAM user",
      "An advanced feature that sets the maximum permissions an IAM entity can have, even if their identity-based policies grant more",
      "A boundary between AWS accounts in an Organization",
      "A network boundary that restricts IAM API calls by IP address"
    ],
    answer:1,
    explanation:"A Permissions Boundary is an IAM managed policy attached to a user or role that sets the MAXIMUM permissions they can have. Even if an identity-based policy grants AdministratorAccess, a permissions boundary limiting to S3-only means the effective permissions are only S3. Used to safely delegate permission management to developers."
  }
];

const STORAGE_KEY = 'quiz_domain2_v2';
let current = 0, answered = [], score = 0;

function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify({ current, answered, score })); }
function loadState() { try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); current = s.current || 0; answered = s.answered || []; score = s.score || 0; } catch(e) {} }

function buildQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card' + (i === current ? ' active' : '');
    card.id = 'q' + i;
    const scenarioHtml = q.scenario ? `<div class="q-scenario">📋 ${q.scenario}</div>` : '';
    card.innerHTML = `
      <div class="q-meta">
        <span class="q-number">Question ${i+1} of ${questions.length}</span>
        <span class="q-tag">${q.tag}</span>
        <span class="q-diff diff-${q.diff}">${q.diff === 'hard' ? '🔴 Hard' : '🟡 Medium'}</span>
      </div>
      ${scenarioHtml}
      <div class="q-text">${q.text}</div>
      <div class="options" id="opts${i}">
        ${q.options.map((o, j) => `<div class="option" id="opt${i}_${j}" onclick="selectAnswer(${i},${j})"><div class="opt-letter">${String.fromCharCode(65+j)}</div><div class="opt-text">${o}</div></div>`).join('')}
      </div>
      <div class="explanation" id="exp${i}"></div>
      <div class="nav">
        <button class="btn btn-secondary" onclick="prevQ(${i})" ${i===0?'disabled':''}>← Previous</button>
        <button class="btn btn-primary" id="nextBtn${i}" onclick="nextQ(${i})" disabled>${i===questions.length-1?'Finish Quiz':'Next →'}</button>
      </div>`;
    container.appendChild(card);
  });
  answered.forEach((optIdx, qIdx) => {
    if (optIdx === undefined) return;
    const q = questions[qIdx];
    const opts = document.querySelectorAll(`#opts${qIdx} .option`);
    opts.forEach(o => o.classList.add('disabled'));
    opts[optIdx].classList.add(optIdx === q.answer ? 'correct' : 'wrong');
    if (optIdx !== q.answer) opts[q.answer].classList.add('correct');
    const exp = document.getElementById(`exp${qIdx}`);
    exp.textContent = '💡 ' + q.explanation;
    exp.className = 'explanation show' + (optIdx !== q.answer ? ' wrong-exp' : '');
    document.getElementById(`nextBtn${qIdx}`).disabled = false;
  });
  updateProgress();
}

function selectAnswer(qIdx, optIdx) {
  if (answered[qIdx] !== undefined) return;
  answered[qIdx] = optIdx;
  const q = questions[qIdx];
  const opts = document.querySelectorAll(`#opts${qIdx} .option`);
  opts.forEach(o => o.classList.add('disabled'));
  opts[optIdx].classList.add(optIdx === q.answer ? 'correct' : 'wrong');
  if (optIdx !== q.answer) opts[q.answer].classList.add('correct');
  if (optIdx === q.answer) score++;
  const exp = document.getElementById(`exp${qIdx}`);
  exp.textContent = '💡 ' + q.explanation;
  exp.className = 'explanation show' + (optIdx !== q.answer ? ' wrong-exp' : '');
  document.getElementById(`nextBtn${qIdx}`).disabled = false;
  saveState();
}

function nextQ(i) {
  if (answered[i] === undefined) return;
  document.getElementById('q'+i).classList.remove('active');
  if (i === questions.length - 1) { showResults(); return; }
  current = i + 1;
  document.getElementById('q'+current).classList.add('active');
  updateProgress(); saveState();
}

function prevQ(i) {
  if (i === 0) return;
  document.getElementById('q'+i).classList.remove('active');
  current = i - 1;
  document.getElementById('q'+current).classList.add('active');
  updateProgress(); saveState();
}

function updateProgress() {
  document.getElementById('progressFill').style.width = (current / questions.length * 100).toFixed(0) + '%';
  document.getElementById('progressLabel').textContent = `Question ${current+1} of ${questions.length}`;
}

function showResults() {
  document.getElementById('quiz-container').style.display = 'none';
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressLabel').textContent = 'Quiz Complete!';
  const pct = Math.round(score / questions.length * 100);
  document.getElementById('scoreNum').textContent = pct + '%';
  document.getElementById('correctCount').textContent = score;
  document.getElementById('wrongCount').textContent = questions.length - score;
  document.getElementById('totalCount').textContent = questions.length;
  const pass = pct >= 70;
  document.getElementById('resultTitle').textContent = pass ? '🎉 Passed!' : '📚 Keep Studying';
  document.getElementById('resultTitle').className = pass ? 'pass' : 'fail';
  document.getElementById('resultMsg').textContent = pass
    ? `You scored ${pct}% on this harder v2 exam — you're well prepared for Domain 2!`
    : `You scored ${pct}%. This v2 exam is harder than the real thing — review the explanations carefully and retry.`;
  document.getElementById('results').style.display = 'block';
  localStorage.removeItem(STORAGE_KEY);
}

function restartQuiz() {
  current = 0; answered = []; score = 0;
  localStorage.removeItem(STORAGE_KEY);
  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz-container').style.display = 'block';
  buildQuiz();
}

loadState(); buildQuiz();
</script>

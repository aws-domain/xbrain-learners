<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Domain 3 — Cloud Technology & Services | CLF-C02 Quiz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
    header { background: linear-gradient(135deg, #1a1f2e, #232b3e); border-bottom: 2px solid #8b5cf6; padding: 24px 32px; display: flex; align-items: center; gap: 16px; }
    .aws-badge { background: #8b5cf6; color: #fff; font-weight: 800; padding: 6px 14px; border-radius: 6px; font-size: 13px; letter-spacing: 1px; }
    header h1 { font-size: 22px; font-weight: 700; }
    header p { font-size: 13px; color: #94a3b8; margin-top: 2px; }
    .progress-bar-wrap { background: #1e2535; padding: 12px 32px; border-bottom: 1px solid #2d3748; }
    .progress-bar-track { background: #2d3748; border-radius: 99px; height: 8px; overflow: hidden; }
    .progress-bar-fill { background: #8b5cf6; height: 100%; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
    .progress-label { font-size: 12px; color: #64748b; margin-top: 6px; }
    main { max-width: 820px; margin: 0 auto; padding: 32px 20px 80px; }
    .question-card { background: #1a1f2e; border: 1px solid #2d3748; border-radius: 12px; padding: 28px; margin-bottom: 24px; display: none; }
    .question-card.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .q-number { font-size: 12px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .q-tag { font-size: 11px; background: #2e1065; color: #c4b5fd; padding: 3px 10px; border-radius: 99px; }
    .q-text { font-size: 17px; font-weight: 500; line-height: 1.6; margin-bottom: 24px; color: #f1f5f9; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option { display: flex; align-items: flex-start; gap: 12px; background: #0f1117; border: 1.5px solid #2d3748; border-radius: 8px; padding: 14px 16px; cursor: pointer; transition: all 0.2s; }
    .option:hover:not(.disabled) { border-color: #8b5cf6; background: #1a1f2e; }
    .option.correct { border-color: #22c55e; background: #052e16; }
    .option.wrong { border-color: #ef4444; background: #2d0a0a; }
    .option.disabled { cursor: default; }
    .opt-letter { min-width: 28px; height: 28px; border-radius: 50%; background: #2d3748; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #94a3b8; flex-shrink: 0; }
    .option.correct .opt-letter { background: #22c55e; color: #fff; }
    .option.wrong .opt-letter { background: #ef4444; color: #fff; }
    .opt-text { font-size: 15px; line-height: 1.5; padding-top: 2px; }
    .explanation { margin-top: 20px; padding: 16px; background: #0d1f0d; border-left: 4px solid #22c55e; border-radius: 0 8px 8px 0; font-size: 14px; line-height: 1.6; color: #86efac; display: none; }
    .explanation.wrong-exp { background: #1a0a0a; border-color: #ef4444; color: #fca5a5; }
    .explanation.show { display: block; animation: fadeIn 0.3s ease; }
    .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; }
    .btn { padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: #8b5cf6; color: #fff; }
    .btn-primary:hover { background: #7c3aed; }
    .btn-secondary { background: #2d3748; color: #e2e8f0; }
    .btn-secondary:hover { background: #374151; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #results { display: none; text-align: center; background: #1a1f2e; border: 1px solid #2d3748; border-radius: 16px; padding: 48px 32px; }
    .score-circle { width: 140px; height: 140px; border-radius: 50%; border: 6px solid #8b5cf6; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 24px; }
    .score-num { font-size: 42px; font-weight: 800; color: #8b5cf6; }
    .score-label { font-size: 13px; color: #64748b; }
    #results h2 { font-size: 26px; margin-bottom: 8px; }
    #results p { color: #94a3b8; margin-bottom: 32px; }
    .result-stats { display: flex; gap: 24px; justify-content: center; margin-bottom: 32px; flex-wrap: wrap; }
    .stat-box { background: #0f1117; border: 1px solid #2d3748; border-radius: 10px; padding: 16px 24px; min-width: 120px; }
    .stat-box .val { font-size: 28px; font-weight: 700; }
    .stat-box .lbl { font-size: 12px; color: #64748b; margin-top: 4px; }
    .correct-val { color: #22c55e; } .wrong-val { color: #ef4444; }
    .pass { color: #22c55e; } .fail { color: #ef4444; }
  </style>
</head>
<body>
<header>
  <div class="aws-badge">CLF-C02</div>
  <div>
    <h1>Domain 3: Cloud Technology and Services</h1>
    <p>34% of scored content &nbsp;·&nbsp; 35 questions</p>
  </div>
</header>
<div class="progress-bar-wrap">
  <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">Question 1 of 35</div>
</div>
<main>
  <div id="quiz-container"></div>
  <div id="results">
    <div class="score-circle"><span class="score-num" id="scoreNum">0%</span><span class="score-label">Score</span></div>
    <h2 id="resultTitle"></h2><p id="resultMsg"></p>
    <div class="result-stats">
      <div class="stat-box"><div class="val correct-val" id="correctCount">0</div><div class="lbl">Correct</div></div>
      <div class="stat-box"><div class="val wrong-val" id="wrongCount">0</div><div class="lbl">Incorrect</div></div>
      <div class="stat-box"><div class="val" id="totalCount">35</div><div class="lbl">Total</div></div>
    </div>
    <button class="btn btn-primary" onclick="restartQuiz()">🔄 Restart Quiz</button>
  </div>
</main>
<script>
const questions = [
  { tag:"Global Infrastructure", text:"What is the relationship between AWS Regions, Availability Zones, and Edge Locations?", options:["Edge Locations > Regions > Availability Zones","Regions > Availability Zones > Edge Locations (by count)","Availability Zones > Regions > Edge Locations","They are all the same thing"], answer:0, explanation:"There are more Edge Locations (400+) than Availability Zones, and more AZs than Regions (30+). Edge Locations are used by CloudFront for content caching, AZs are data centers within a Region, and Regions are geographic areas." },
  { tag:"Global Infrastructure", text:"A company wants to ensure their application remains available even if an entire AWS data center fails. What should they implement?", options:["Deploy in a single large EC2 instance","Deploy across multiple Availability Zones","Use a larger instance type","Enable auto scaling"], answer:1, explanation:"Deploying across multiple Availability Zones (Multi-AZ) ensures high availability. AZs within a Region are physically separate with independent power, cooling, and networking — if one fails, others continue serving traffic." },
  { tag:"Global Infrastructure", text:"Which AWS service uses Edge Locations to cache content closer to end users, reducing latency?", options:["Amazon Route 53","Amazon CloudFront","AWS Direct Connect","Amazon VPC"], answer:1, explanation:"Amazon CloudFront is AWS's CDN (Content Delivery Network) that uses Edge Locations worldwide to cache static and dynamic content closer to users, significantly reducing latency for global audiences." },
  { tag:"Global Infrastructure", text:"A company needs to comply with data sovereignty laws requiring all data to remain within a specific country. What should they consider when architecting on AWS?", options:["Use Edge Locations in that country","Deploy only in the AWS Region located in that country","Use AWS Outposts","Both B and C are valid options"], answer:3, explanation:"To comply with data sovereignty requirements, you should deploy in an AWS Region within the required country. AWS Outposts (AWS infrastructure on-premises) is also an option for strict data residency requirements." },
  { tag:"Compute", text:"A company has a steady-state production workload running 24/7 for the next 3 years. Which EC2 purchasing option provides the most cost savings?", options:["On-Demand Instances","Spot Instances","Reserved Instances (3-year, All Upfront)","Dedicated Hosts"], answer:2, explanation:"Reserved Instances with a 3-year All Upfront commitment provide the maximum savings (up to 75%) for steady-state workloads. The longer the commitment and more upfront payment, the greater the discount." },
  { tag:"Compute", text:"Which EC2 purchasing option is MOST suitable for a batch processing job that can be interrupted and restarted?", options:["On-Demand Instances","Reserved Instances","Spot Instances","Dedicated Instances"], answer:2, explanation:"Spot Instances use AWS's unused capacity at up to 90% discount but can be terminated with 2-minute notice. They're ideal for fault-tolerant, flexible workloads like batch processing, data analysis, and CI/CD pipelines." },
  { tag:"Compute", text:"A company wants to run Docker containers without managing the underlying EC2 instances. Which service should they use?", options:["Amazon ECS on EC2","Amazon EKS on EC2","AWS Fargate","Amazon EC2 Auto Scaling"], answer:2, explanation:"AWS Fargate is a serverless compute engine for containers. It runs ECS or EKS containers without requiring you to provision or manage EC2 instances — you just define the container resources and pay per vCPU and memory used." },
  { tag:"Compute", text:"Which AWS service allows you to run code in response to events without provisioning or managing servers?", options:["Amazon EC2","AWS Elastic Beanstalk","AWS Lambda","Amazon ECS"], answer:2, explanation:"AWS Lambda is a serverless compute service that runs your code in response to events (S3 uploads, API calls, DynamoDB changes, etc.) without requiring server management. You pay only for the compute time consumed." },
  { tag:"Compute", text:"A company needs to run a Kubernetes cluster on AWS. Which managed service should they use?", options:["Amazon ECS","Amazon EKS","AWS Fargate","AWS Batch"], answer:1, explanation:"Amazon EKS (Elastic Kubernetes Service) is AWS's managed Kubernetes service. It handles the Kubernetes control plane, allowing teams familiar with Kubernetes to run containerized workloads without managing the cluster infrastructure." },
  { tag:"Compute", text:"Which EC2 instance family is optimized for workloads requiring high CPU performance, such as batch processing and gaming servers?", options:["Memory Optimized (r5)","Storage Optimized (i3)","Compute Optimized (c5)","General Purpose (t3)"], answer:2, explanation:"Compute Optimized instances (c5, c6g) are designed for compute-intensive workloads requiring high CPU performance, such as batch processing, scientific modeling, gaming servers, and ML inference." },
  { tag:"Databases", text:"A company needs a fully managed relational database that is compatible with MySQL but offers 5x better performance. Which service should they choose?", options:["Amazon RDS for MySQL","Amazon DynamoDB","Amazon Aurora","Amazon Redshift"], answer:2, explanation:"Amazon Aurora is AWS's cloud-native relational database compatible with MySQL and PostgreSQL. It offers up to 5x the performance of standard MySQL and 3x PostgreSQL, with automatic storage scaling from 10GB to 128TB." },
  { tag:"Databases", text:"Which AWS database service is best suited for a gaming application requiring single-digit millisecond latency at any scale?", options:["Amazon RDS","Amazon Aurora","Amazon DynamoDB","Amazon ElastiCache"], answer:2, explanation:"Amazon DynamoDB is a fully managed NoSQL database delivering single-digit millisecond performance at any scale. It's serverless, automatically scales, and is ideal for gaming, IoT, mobile apps, and real-time applications." },
  { tag:"Databases", text:"What is the difference between RDS Multi-AZ and Read Replicas?", options:["Multi-AZ improves read performance; Read Replicas provide high availability","Multi-AZ provides high availability with automatic failover; Read Replicas scale read traffic","They are the same feature with different names","Multi-AZ is for NoSQL; Read Replicas are for relational databases"], answer:1, explanation:"RDS Multi-AZ creates a synchronous standby replica in another AZ for high availability and automatic failover. Read Replicas use asynchronous replication to scale read traffic — they don't provide automatic failover." },
  { tag:"Databases", text:"A company wants to migrate its Oracle database to Amazon Aurora PostgreSQL with minimal downtime. Which services should they use?", options:["AWS Snowball and AWS DMS","AWS SCT and AWS DMS","AWS DataSync and AWS Backup","AWS CloudFormation and AWS Config"], answer:1, explanation:"For heterogeneous database migration (Oracle to Aurora PostgreSQL): AWS SCT (Schema Conversion Tool) converts the schema, and AWS DMS (Database Migration Service) migrates the data with continuous replication and minimal downtime." },
  { tag:"Databases", text:"Which AWS service provides in-memory caching to reduce database load and improve application performance?", options:["Amazon RDS","Amazon DynamoDB","Amazon ElastiCache","Amazon Redshift"], answer:2, explanation:"Amazon ElastiCache provides managed in-memory caching using Redis or Memcached. It caches frequently accessed data in memory, dramatically reducing latency and database load for applications with repetitive queries." },
  { tag:"Networking", text:"Which VPC component allows instances in a private subnet to access the internet for outbound connections, while preventing inbound connections from the internet?", options:["Internet Gateway","VPC Peering","NAT Gateway","Security Group"], answer:2, explanation:"A NAT Gateway allows instances in private subnets to initiate outbound connections to the internet (for updates, API calls, etc.) while blocking inbound connections initiated from the internet — maintaining the private nature of the subnet." },
  { tag:"Networking", text:"What is the key difference between Security Groups and Network ACLs (NACLs) in AWS?", options:["Security Groups operate at the subnet level; NACLs at the instance level","Security Groups are stateful; NACLs are stateless","Security Groups support Deny rules; NACLs only support Allow rules","Security Groups are for EC2 only; NACLs work with all services"], answer:1, explanation:"Security Groups are stateful (return traffic is automatically allowed) and operate at the instance level with Allow rules only. NACLs are stateless (must explicitly allow both inbound and outbound), operate at the subnet level, and support both Allow and Deny rules." },
  { tag:"Networking", text:"A company needs a dedicated, private network connection from their on-premises data center to AWS with consistent bandwidth and low latency. Which service should they use?", options:["AWS Site-to-Site VPN","AWS Direct Connect","Amazon CloudFront","AWS Transit Gateway"], answer:1, explanation:"AWS Direct Connect provides a dedicated private network connection from on-premises to AWS, bypassing the public internet. It offers consistent bandwidth (1-100 Gbps), lower latency, and is ideal for large data transfers and compliance requirements." },
  { tag:"Networking", text:"Which Amazon Route 53 routing policy would you use to route users to the AWS Region with the lowest network latency?", options:["Simple routing","Weighted routing","Latency-based routing","Geolocation routing"], answer:2, explanation:"Latency-based routing in Route 53 routes users to the AWS Region that provides the lowest network latency for their location. This is different from Geolocation routing, which routes based on the user's geographic location regardless of latency." },
  { tag:"Storage", text:"A company needs to store large amounts of unstructured data (images, videos, backups) with high durability. Which AWS storage service is most appropriate?", options:["Amazon EBS","Amazon EFS","Amazon S3","Amazon Instance Store"], answer:2, explanation:"Amazon S3 is object storage designed for storing unstructured data like images, videos, and backups. It offers 99.999999999% (11 nines) durability, unlimited storage capacity, and is accessible via HTTP/HTTPS from anywhere." },
  { tag:"Storage", text:"Which S3 storage class should be used for data that is accessed infrequently but requires immediate retrieval when needed, at a lower cost than S3 Standard?", options:["S3 Glacier Deep Archive","S3 Standard","S3 Standard-IA (Infrequent Access)","S3 One Zone-IA"], answer:2, explanation:"S3 Standard-IA (Infrequent Access) is designed for data accessed less frequently but requiring rapid retrieval when needed. It costs less than S3 Standard for storage but has a retrieval fee — ideal for backups and disaster recovery data." },
  { tag:"Storage", text:"What happens to data stored on an EC2 Instance Store when the instance is stopped or terminated?", options:["Data is automatically backed up to S3","Data persists and is available when the instance restarts","Data is permanently lost","Data is moved to EBS automatically"], answer:2, explanation:"Instance Store is ephemeral (temporary) storage physically attached to the host. Data is permanently lost when the instance stops, terminates, or the underlying hardware fails. Use EBS for persistent storage that survives instance lifecycle events." },
  { tag:"Storage", text:"A company needs shared file storage accessible by multiple Linux EC2 instances simultaneously across multiple Availability Zones. Which service should they use?", options:["Amazon EBS","Amazon S3","Amazon EFS","Amazon FSx for Windows"], answer:2, explanation:"Amazon EFS (Elastic File System) provides managed NFS file storage that can be mounted by multiple Linux EC2 instances simultaneously across multiple AZs. It automatically scales and is ideal for shared file storage, CMS, and home directories." },
  { tag:"Deploying", text:"Which AWS service allows developers to deploy applications without managing the underlying infrastructure (servers, load balancers, auto scaling)?", options:["Amazon EC2","AWS Lambda","AWS Elastic Beanstalk","Amazon ECS"], answer:2, explanation:"AWS Elastic Beanstalk is a PaaS service where you upload your application code and Elastic Beanstalk automatically handles deployment, capacity provisioning, load balancing, auto scaling, and health monitoring." },
  { tag:"Deploying", text:"Which method of accessing AWS services is best suited for automating repetitive infrastructure deployments using code?", options:["AWS Management Console","AWS CLI with manual commands","Infrastructure as Code (AWS CloudFormation)","Phone support"], answer:2, explanation:"Infrastructure as Code (IaC) using AWS CloudFormation allows you to define infrastructure in YAML/JSON templates, enabling repeatable, version-controlled, automated deployments. This is the best practice for production environments." },
  { tag:"AI/ML", text:"A company wants to add a conversational chatbot to their customer service application. Which AWS service should they use?", options:["Amazon Polly","Amazon Transcribe","Amazon Lex","Amazon Comprehend"], answer:2, explanation:"Amazon Lex is a service for building conversational interfaces (chatbots) using voice and text. It uses the same deep learning technology as Amazon Alexa and integrates with Lambda, Connect, and other AWS services." },
  { tag:"AI/ML", text:"Which AWS service would you use to analyze customer reviews and automatically detect the sentiment (positive, negative, neutral)?", options:["Amazon Rekognition","Amazon Comprehend","Amazon Textract","Amazon Forecast"], answer:1, explanation:"Amazon Comprehend is a Natural Language Processing (NLP) service that analyzes text to extract insights including sentiment analysis, entity recognition, key phrase extraction, and language detection — ideal for customer feedback analysis." },
  { tag:"AI/ML", text:"A company wants to run SQL queries directly on data stored in Amazon S3 without loading it into a database. Which service should they use?", options:["Amazon Redshift","Amazon RDS","Amazon Athena","AWS Glue"], answer:2, explanation:"Amazon Athena is a serverless query service that allows you to run SQL queries directly on data stored in S3 without loading it into a database. You pay only for the data scanned, making it cost-effective for ad-hoc analysis." },
  { tag:"Other Services", text:"A company wants to decouple their microservices so that if one service fails, messages are not lost. Which service should they use?", options:["Amazon SNS","Amazon SQS","Amazon EventBridge","AWS Step Functions"], answer:1, explanation:"Amazon SQS (Simple Queue Service) is a message queue that decouples microservices. Messages are stored in the queue until processed — if a service fails, messages remain in the queue and can be processed when the service recovers." },
  { tag:"Other Services", text:"A company needs to send notifications to multiple subscribers simultaneously when an event occurs (fan-out pattern). Which service should they use?", options:["Amazon SQS","Amazon SES","Amazon SNS","Amazon EventBridge"], answer:2, explanation:"Amazon SNS (Simple Notification Service) uses a pub/sub model to push messages to multiple subscribers simultaneously (fan-out). Subscribers can be SQS queues, Lambda functions, HTTP endpoints, email, or SMS." },
  { tag:"Other Services", text:"Which AWS service provides a fully managed CI/CD pipeline to automate the build, test, and deployment of applications?", options:["AWS CodeBuild","AWS CodeDeploy","AWS CodePipeline","AWS X-Ray"], answer:2, explanation:"AWS CodePipeline is a fully managed CI/CD service that orchestrates the entire release pipeline — from source code changes through build (CodeBuild), test, and deployment (CodeDeploy) stages — automating the software delivery process." },
  { tag:"Other Services", text:"A developer needs to trace requests through a distributed microservices application to identify performance bottlenecks. Which service should they use?", options:["Amazon CloudWatch","AWS CloudTrail","AWS X-Ray","AWS Config"], answer:2, explanation:"AWS X-Ray provides distributed tracing for applications, allowing developers to visualize the request flow through microservices, identify bottlenecks, and debug errors. It creates a service map showing how components interact." },
  { tag:"Networking", text:"A company wants to connect two VPCs in different AWS accounts so they can communicate privately. Which feature should they use?", options:["Internet Gateway","NAT Gateway","VPC Peering","AWS Direct Connect"], answer:2, explanation:"VPC Peering creates a private network connection between two VPCs (same or different accounts/regions), allowing resources to communicate using private IP addresses through AWS's private network without traversing the internet." },
  { tag:"Storage", text:"Which AWS service provides automated, centralized backup management across multiple AWS services including EC2, RDS, DynamoDB, and EFS?", options:["Amazon S3 Lifecycle Policies","AWS Backup","Amazon Data Lifecycle Manager","AWS Storage Gateway"], answer:1, explanation:"AWS Backup is a fully managed centralized backup service that automates and consolidates backup tasks across EC2, EBS, RDS, DynamoDB, EFS, FSx, and Storage Gateway — with cross-region and cross-account backup support." },
  { tag:"Compute", text:"Which AWS service would you use to build and deploy a full-stack web or mobile application including hosting, authentication, and APIs?", options:["AWS Elastic Beanstalk","AWS Amplify","Amazon Lightsail","AWS App Runner"], answer:1, explanation:"AWS Amplify is a full-stack development platform for building web and mobile applications. It provides hosting, authentication, GraphQL/REST APIs, storage, and CI/CD — integrating with React, Vue, Angular, iOS, and Android." }
];

const STORAGE_KEY = 'quiz_domain3';

let current = 0, answered = [], score = 0;

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ current, answered, score }));
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) { const s = JSON.parse(saved); current = s.current || 0; answered = s.answered || []; score = s.score || 0; }
  } catch(e) {}
}

function buildQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card' + (i === current ? ' active' : '');
    card.id = 'q' + i;
    card.innerHTML = `
      <div class="q-meta"><span class="q-number">Question ${i+1} of ${questions.length}</span><span class="q-tag">${q.tag}</span></div>
      <div class="q-text">${q.text}</div>
      <div class="options" id="opts${i}">${q.options.map((o,j)=>`<div class="option" id="opt${i}_${j}" onclick="selectAnswer(${i},${j})"><div class="opt-letter">${String.fromCharCode(65+j)}</div><div class="opt-text">${o}</div></div>`).join('')}</div>
      <div class="explanation" id="exp${i}"></div>
      <div class="nav"><button class="btn btn-secondary" onclick="prevQ(${i})" ${i===0?'disabled':''}>← Previous</button><button class="btn btn-primary" id="nextBtn${i}" onclick="nextQ(${i})" disabled>${i===questions.length-1?'Finish Quiz':'Next →'}</button></div>`;
    container.appendChild(card);
  });
  answered.forEach((optIdx, qIdx) => {
    if (optIdx === undefined) return;
    const q = questions[qIdx];
    const opts = document.querySelectorAll(`#opts${qIdx} .option`);
    opts.forEach(o => o.classList.add('disabled'));
    opts[optIdx].classList.add(optIdx === q.answer ? 'correct' : 'wrong');
    if (optIdx !== q.answer) opts[q.answer].classList.add('correct');
    const exp = document.getElementById(`exp${qIdx}`);
    exp.textContent = '💡 ' + q.explanation;
    exp.className = 'explanation show' + (optIdx !== q.answer ? ' wrong-exp' : '');
    document.getElementById(`nextBtn${qIdx}`).disabled = false;
  });
  updateProgress();
}

function selectAnswer(qIdx, optIdx) {
  if (answered[qIdx] !== undefined) return;
  answered[qIdx] = optIdx;
  const q = questions[qIdx];
  const opts = document.querySelectorAll(`#opts${qIdx} .option`);
  opts.forEach(o => o.classList.add('disabled'));
  opts[optIdx].classList.add(optIdx === q.answer ? 'correct' : 'wrong');
  if (optIdx !== q.answer) opts[q.answer].classList.add('correct');
  if (optIdx === q.answer) score++;
  const exp = document.getElementById(`exp${qIdx}`);
  exp.textContent = '💡 ' + q.explanation;
  exp.className = 'explanation show' + (optIdx !== q.answer ? ' wrong-exp' : '');
  document.getElementById(`nextBtn${qIdx}`).disabled = false;
  saveState();
}

function nextQ(i) {
  if (answered[i] === undefined) return;
  document.getElementById('q'+i).classList.remove('active');
  if (i === questions.length - 1) { showResults(); return; }
  current = i + 1;
  document.getElementById('q'+current).classList.add('active');
  updateProgress(); saveState();
}

function prevQ(i) {
  if (i === 0) return;
  document.getElementById('q'+i).classList.remove('active');
  current = i - 1;
  document.getElementById('q'+current).classList.add('active');
  updateProgress(); saveState();
}

function updateProgress() {
  document.getElementById('progressFill').style.width = (current / questions.length * 100).toFixed(0) + '%';
  document.getElementById('progressLabel').textContent = `Question ${current+1} of ${questions.length}`;
}

function showResults() {
  document.getElementById('quiz-container').style.display = 'none';
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressLabel').textContent = 'Quiz Complete!';
  const pct = Math.round(score / questions.length * 100);
  document.getElementById('scoreNum').textContent = pct + '%';
  document.getElementById('correctCount').textContent = score;
  document.getElementById('wrongCount').textContent = questions.length - score;
  document.getElementById('totalCount').textContent = questions.length;
  const pass = pct >= 70;
  document.getElementById('resultTitle').textContent = pass ? '🎉 Passed!' : '📚 Keep Studying';
  document.getElementById('resultTitle').className = pass ? 'pass' : 'fail';
  document.getElementById('resultMsg').textContent = pass ? `Outstanding! You scored ${pct}% on the largest domain. You're ready for Domain 4!` : `You scored ${pct}%. Domain 3 is the largest (34%) — review the study materials and try again. Passing score is 70%.`;
  document.getElementById('results').style.display = 'block';
  localStorage.removeItem(STORAGE_KEY);
}

function restartQuiz() {
  current = 0; answered = []; score = 0;
  localStorage.removeItem(STORAGE_KEY);
  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz-container').style.display = 'block';
  buildQuiz();
}

loadState();
buildQuiz();
</script>
</body>
</html>

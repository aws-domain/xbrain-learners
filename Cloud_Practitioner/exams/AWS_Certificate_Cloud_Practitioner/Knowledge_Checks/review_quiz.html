<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Cloud Practitioner - Knowledge Check Review</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --success-bg: rgba(34, 197, 94, 0.1);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
            --border: #334155;
            --radius: 12px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .quiz-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            padding: 1rem 1.5rem;
            border-radius: var(--radius);
            margin-bottom: 2rem;
            border: 1px solid var(--border);
        }

        .progress-text {
            font-weight: 600;
            color: var(--primary);
        }

        .score-text {
            font-weight: 600;
            color: var(--success);
        }

        .question-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }
        
        .multi-select-hint {
            display: inline-block;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            padding: 0.25rem 0.75rem;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .options-grid {
            display: grid;
            gap: 1rem;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--border);
            color: var(--text-main);
            padding: 1.25rem;
            border-radius: 8px;
            font-size: 1.05rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(:disabled) {
            background: var(--surface-hover);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .option-btn.correct {
            border-color: var(--success);
            background: var(--success-bg);
        }

        .option-btn.wrong {
            border-color: var(--danger);
            background: var(--danger-bg);
        }

        .option-btn:disabled {
            cursor: default;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
            align-items: center;
        }
        
        .actions-right {
            display: flex;
            gap: 1rem;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--surface-hover);
        }
        
        .btn-danger {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
        }
        
        .btn-danger:hover {
            background: var(--danger-bg);
        }

        .hidden {
            display: none !important;
        }

        .result-message {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 500;
            animation: fadeIn 0.3s ease-out;
        }

        .result-success {
            background: var(--success-bg);
            color: var(--success);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .result-error {
            background: var(--danger-bg);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        .file-reference {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 1.5rem;
            text-align: right;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AWS Cloud Practitioner Review</h1>
            <p class="subtitle">Review your incorrect Knowledge Check questions</p>
        </header>

        <div id="quiz-container">
            <div class="quiz-status">
                <span class="progress-text">Question <span id="current-q">1</span> of <span id="total-q">0</span></span>
                <span class="score-text">Score: <span id="score">0</span></span>
            </div>

            <div id="question-area">
                <!-- Question will be injected here -->
            </div>
            
            <div id="completion-screen" class="question-card hidden" style="text-align: center;">
                <h2 style="font-size: 2rem; color: var(--success); margin-bottom: 1rem;">🎉 Quiz Completed!</h2>
                <p style="font-size: 1.2rem; margin-bottom: 2rem;">Your final score is <strong id="final-score">0</strong> out of <strong id="final-total">0</strong>.</p>
                <button class="btn" onclick="resetQuiz()">Restart Quiz</button>
            </div>
        </div>
    </div>

    <script>
        const rawQuestions = [{"file": "AWS_Well_Architected_Security_Traceability.md", "question": "<div class='q-lang'>Which design principle of the AWS Well-Architected Framework can answer the question- \"Who did what\"?</div>", "correct": ["Security"], "incorrect": ["Reliability", "Operational Excellence", "Performance Efficiency"], "is_multi": false}, {"file": "AWS_Scaling_Vertical_vs_Horizontal.md", "question": "<div class='q-lang'>Which of the following is an INCORRECT statement about Scaling, a design principle of Reliability pillar of the AWS Well-Architected Framework?</div>", "correct": ["\"Fault tolerance is achieved by Vertical Scaling\""], "incorrect": ["Contact AWS Developer Forum moderators", "AWS CloudTrail", "AWS Secrets Manager"], "is_multi": false}, {"file": "AWS_Cloud_Computing_Types_IaaS_PaaS_SaaS.md", "question": "<div class='q-lang'>Which of the following AWS services comes under the Software as a Service (SaaS) Cloud Computing Type?</div>", "correct": ["Amazon Rekognition"], "incorrect": ["Amazon EC2", "AWS Elastic Beanstalk", "Elastic Load Balancing (ELB)"], "is_multi": false}, {"file": "AWS_Cloud_Characteristics_Agility_Elasticity_Scalability_Reliability.md", "question": "<div class='q-lang'>A company wants to move to AWS cloud and release new features with quick iterations by utilizing relevant AWS services whenever required. Which of the following characteristics of AWS Cloud does it want to leverage?</div>", "correct": ["Agility"], "incorrect": ["Amazon VPC", "Amazon Route 53", "Reliability"], "is_multi": false}, {"file": "AWS_Well_Architected_Reliability_Foundations.md", "question": "<div class='q-lang'>Which of the following AWS services are part of the AWS Foundation services for the Reliability pillar of the Well-Architected Framework in AWS Cloud? (Select two)</div>", "correct": ["AWS Trusted Advisor"], "incorrect": ["AWS CloudTrail", "AWS CloudFormation", "Amazon CloudWatch"], "is_multi": false}, {"file": "AWS_Cost_Estimation_Tools.md", "question": "<div class='q-lang'>A startup wants to set up its IT infrastructure on AWS Cloud. The CTO would like to get an estimate of the monthly AWS bill based on the AWS services that the startup wants to use. As a Cloud Practitioner, which AWS service would you suggest for this use-case?</div>", "correct": ["AWS Simple Monthly Calculator"], "incorrect": ["AWS TCO Calculator (Total Cost of Ownership)", "AWS Cost Explorer", "AWS Budgets"], "is_multi": false}, {"file": "AWS_Support_Plans_Infrastructure_Event_Management.md", "question": "<div class='q-lang'>Which of the following AWS Support plans provides access to Infrastructure Event Management for an additional fee?</div>", "correct": ["Business"], "incorrect": ["Write email to Jeff Bezos", "AWS Cost Explorer", "Consult moderators on AWS Developer Forums"], "is_multi": false}, {"file": "AWS_Data_Transfer_Pricing_Policy.md", "question": "<div class='q-lang'>Which of the following statement is correct regarding the AWS pricing policy for data transfer charges?</div>", "correct": ["Only outbound data transfer is charged"], "incorrect": ["AWS WAF", "Developer", "Amazon EC2"], "is_multi": false}, {"file": "AWS_Service_Catalog_Partner_Network.md", "question": "<div class='q-lang'>An organization is planning to move its infrastructure from the on-premises datacenter to AWS Cloud. As a Cloud Practitioner, which options would you recommend so that the organization can identify the right AWS services to build solutions on AWS Cloud (Select two)?</div>", "correct": ["AWS Service Catalog"], "incorrect": ["AWS Organizations", "Amazon CloudWatch", "AWS CloudTrail"], "is_multi": false}, {"file": "AWS_Data_Transfer_Pricing.md", "question": "<div class='q-lang'>The DevOps team at an IT company is moving 500 GB of data from an EC2 instance to an S3 bucket in the same region. Which of the following scenario captures the correct charges for this data transfer?</div>", "correct": ["The company would NOT be charged for this data transfer"], "incorrect": ["\"Charged for outbound data transfer from EC2\"", "\"Charged for inbound data transfer into S3\"", "\"Charged for both outbound and inbound\""], "is_multi": false}, {"file": "AWS_Migration_Services_Support.md", "question": "<div class='q-lang'>A startup wants to migrate its data and applications from the on-premises data center to AWS Cloud. Which of the following options can be used by the startup to help with this migration? (Select two)</div>", "correct": ["AWS Professional Services + AWS Landing Zone", "AWS Professional Services", "AWS Landing Zone"], "incorrect": ["Raise support ticket with AWS Support"], "is_multi": true}, {"file": "AWS_Support_Plans_Concierge_Team.md", "question": "<div class='q-lang'>A multi-national company wants to migrate its IT infrastructure to AWS Cloud and is looking for a concierge support team as well as a response time of around an hour in case the systems go down. As a Cloud Practitioner, which of the following support plans would you recommend to the company?</div>", "correct": ["Enterprise"], "incorrect": ["Developer", "Business", "Individual"], "is_multi": false}, {"file": "AWS_Acceptable_Use_Policy.md", "question": "<div class='q-lang'>Which policy describes prohibited uses of the web services offered by Amazon Web Services?</div>", "correct": ["AWS Acceptable Use Policy (AUP)"], "incorrect": ["AWS Trusted Advisor", "AWS Fair Use Policy", "AWS Applicable Use Policy"], "is_multi": false}, {"file": "AWS_CloudHSM_Hardware_Security_Module.md", "question": "<div class='q-lang'>Due to regulatory and compliance reasons, an organization is supposed to use a hardware device for any data encryption operations in the cloud. Which AWS service can be used to meet this compliance requirement?</div>", "correct": ["AWS CloudHSM"], "incorrect": ["AWS KMS (Key Management Service)", "AWS Secrets Manager", "AWS Trusted Advisor"], "is_multi": false}, {"file": "AWS_Abuse_Team_Prohibited_Use.md", "question": "<div class='q-lang'>A cyber forensics team has detected that AWS owned IP-addresses are being used to carry out malicious attacks. As this constitutes prohibited use of AWS services, which of the following is the correct solution to address this issue?</div>", "correct": ["Contact AWS Abuse Team"], "incorrect": ["Contact AWS Support", "Contact AWS Developer Forum moderators", "Write email to Jeff Bezos"], "is_multi": false}, {"file": "AWS_Shield_Advanced_Protected_Resources.md", "question": "<div class='q-lang'>AWS Shield Advanced provides expanded DDoS attack protection for web applications running on which of the following resources? (Select two)</div>", "correct": ["Amazon Route 53", "Covered by Shield Advanced", "AWS Global Accelerator"], "incorrect": ["Amazon API Gateway"], "is_multi": true}, {"file": "AWS_Aurora_OS_Patching_Responsibility.md", "question": "<div class='q-lang'>Which of the following entities applies patches to the underlying OS for AWS Aurora?</div>", "correct": ["The AWS Product Team automatically"], "incorrect": ["AWS customer by using AWS Systems Manager", "AWS Support after receiving request", "AWS customer by SSHing on instances"], "is_multi": false}, {"file": "AWS_DDoS_Protection_Services.md", "question": "<div class='q-lang'>Which of the following AWS services can be used to prevent Distributed Denial-of-Service (DDoS) attack? (Select three)</div>", "correct": ["AWS Shield"], "incorrect": ["AWS CloudHSM", "AWS Trusted Advisor", "Amazon Inspector"], "is_multi": false}, {"file": "AWS_Encryption_by_Default.md", "question": "<div class='q-lang'>Which of the following AWS services has encryption enabled by default?</div>", "correct": ["CloudTrail Logs"], "incorrect": ["EFS (Elastic File System)", "EBS (Elastic Block Storage)", "Amazon S3"], "is_multi": false}, {"file": "AWS_Serverless_Services.md", "question": "<div class='q-lang'>Which of the following represents a serverless stack on AWS Cloud?</div>", "correct": ["Step Functions + DynamoDB + Lambda"], "incorrect": ["AWS Organizations", "Contact AWS Support", "Amazon EC2"], "is_multi": false}, {"file": "AWS_Hybrid_Storage_Storage_Gateway.md", "question": "<div class='q-lang'>Which of the following is a hybrid storage service that allows on-premises applications to access data on AWS Cloud?</div>", "correct": ["AWS Storage Gateway"], "incorrect": ["Amazon DynamoDB", "AWS Trusted Advisor", "Contact AWS Support"], "is_multi": false}, {"file": "S3_Storage_Classes_Cost_Effective.md", "question": "<div class='q-lang'>A photo sharing web application wants to store thumbnails of user-uploaded images on Amazon S3. The thumbnails are rarely used but need to be immediately accessible from the web application. The thumbnails can be regenerated easily if they are lost. Which is the most cost-effective way to store these thumbnails on S3?</div>", "correct": ["S3 One-Zone Infrequent Access (One-Zone IA)"], "incorrect": ["AWS Batch", "AWS Budgets", "AWS WAF"], "is_multi": false}, {"file": "AWS_EMR_Batch_Step_Functions.md", "question": "<div class='q-lang'>Which AWS service can be used to provision resources to run big data workloads on Hadoop clusters?</div>", "correct": ["Amazon EMR (Elastic MapReduce)"], "incorrect": ["AWS Step Functions", "AWS Batch", "Amazon EC2"], "is_multi": false}, {"file": "AWS_AI_ML_Speech_Translation_Services.md", "question": "<div class='q-lang'>A unicorn startup is building an analytics application with support for a speech-based interface. The application will accept speech-based input from users and then convey results via speech. As a Cloud Practitioner, which solution would you recommend for the given use-case?</div>", "correct": ["Use Amazon Transcribe to convert speech to text for downstream analysis. Then use Amazon Polly to convey the text results via speech", "Flow", "Amazon Transcribe"], "incorrect": ["\"Use Amazon Polly to convert speech to text\""], "is_multi": true}, {"file": "EBS_vs_EFS_Availability_Zone.md", "question": "<div class='q-lang'>Which of the following statements are CORRECT regarding the Availability Zone (AZ) specific characteristics of EBS and EFS storage types?</div>", "correct": ["\"EBS volume can be attached to a single instance in the same Availability Zone whereas EFS file system can be mounted on instances across multiple Availability Zones\"", "Block storage cho EC2", "AZ Characteristics"], "incorrect": ["AWS Secrets Manager"], "is_multi": true}, {"file": "AWS_Storage_Concurrent_Access_EFS.md", "question": "<div class='q-lang'>A data analytics company is running a proprietary batch analytics application on AWS and wants to use a storage service which would be accessed by hundreds of EC2 instances simultaneously to append data to existing files. As a Cloud Practitioner, which AWS service would you suggest for this use-case?</div>", "correct": ["EFS (Elastic File System)"], "incorrect": ["Contact AWS Support", "Performance Efficiency", "AWS Budgets"], "is_multi": false}];
        
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let hasAnswered = false;
        let selectedOptions = new Set();
        let isCompleted = false;

        const questionArea = document.getElementById('question-area');
        const completionScreen = document.getElementById('completion-screen');
        
        // Changed key to invalidate old cache automatically
        const STATE_KEY = 'awsQuizStateV2';
        
        function saveState() {
            const state = {
                questions,
                currentQuestionIndex,
                score,
                hasAnswered,
                selectedOptions: Array.from(selectedOptions),
                isCompleted
            };
            localStorage.setItem(STATE_KEY, JSON.stringify(state));
        }
        
        function loadState() {
            const stateStr = localStorage.getItem(STATE_KEY);
            if (stateStr) {
                try {
                    const state = JSON.parse(stateStr);
                    if (state.questions && state.questions.length > 0) {
                        return state;
                    }
                } catch (e) {
                    console.error("Failed to parse state", e);
                }
            }
            return null;
        }

        function initQuiz() {
            const savedState = loadState();
            
            if (savedState) {
                questions = savedState.questions;
                currentQuestionIndex = savedState.currentQuestionIndex;
                score = savedState.score;
                hasAnswered = savedState.hasAnswered;
                selectedOptions = new Set(savedState.selectedOptions);
                isCompleted = savedState.isCompleted;
                
                if (isCompleted) {
                    document.getElementById('total-q').textContent = questions.length;
                    showCompletion();
                    return;
                }
            } else {
                // Initialize new quiz
                questions = rawQuestions.map(q => {
                    let opts = [...q.correct.map(c => ({text: c, isCorrect: true})), ...q.incorrect.map(c => ({text: c, isCorrect: false}))];
                    opts = opts.sort(() => Math.random() - 0.5);
                    return { ...q, options: opts };
                });
                
                questions = questions.sort(() => Math.random() - 0.5);
                currentQuestionIndex = 0;
                score = 0;
                hasAnswered = false;
                selectedOptions.clear();
                isCompleted = false;
                
                if (questions.length === 0) {
                    questionArea.innerHTML = '<div class="question-card"><h2>No valid questions found.</h2></div>';
                    return;
                }
                saveState();
            }
            
            document.getElementById('total-q').textContent = questions.length;
            completionScreen.classList.add('hidden');
            questionArea.classList.remove('hidden');
            renderQuestion();
            
            if (hasAnswered) {
                // Re-apply visual state if reloaded on answered question
                document.getElementById('submit-btn').classList.add('hidden');
                document.getElementById('next-btn').classList.remove('hidden');
                showAnswerResult();
            }
        }
        
        function resetQuiz() {
            localStorage.removeItem(STATE_KEY);
            initQuiz();
        }

        function updateStatus() {
            document.getElementById('current-q').textContent = currentQuestionIndex + 1;
            document.getElementById('score').textContent = score;
        }

        function renderQuestion() {
            const q = questions[currentQuestionIndex];
            
            let expectedCorrect = q.options.filter(o => o.isCorrect).length;
            
            let hint = '';
            if (q.is_multi) {
                hint = `<div class="multi-select-hint">Multiple Choice (Select exactly ${expectedCorrect} correct answers)</div>`;
            }
            
            let html = `
                <div class="question-card">
                    <div class="question-text">${q.question}</div>
                    ${hint}
                    
                    <div class="options-grid" id="options-grid">
                        ${q.options.map((opt, i) => `
                            <button class="option-btn ${selectedOptions.has(i) ? 'selected' : ''}" data-index="${i}" onclick="toggleOption(${i})">
                                ${opt.text}
                            </button>
                        `).join('')}
                    </div>
                    
                    <div id="result-msg" class="result-message hidden"></div>
                    
                    <div class="actions">
                        <button class="btn btn-danger btn-secondary" onclick="resetQuiz()">Reset Progress</button>
                        <div class="actions-right">
                            <button id="submit-btn" class="btn" onclick="submitAnswer()" ${selectedOptions.size === 0 ? 'disabled' : ''}>Submit</button>
                            <button id="next-btn" class="btn hidden" onclick="nextQuestion()">Next Question</button>
                        </div>
                    </div>
                    
                    <div class="file-reference">Source: ${q.file}</div>
                </div>
            `;
            questionArea.innerHTML = html;
            updateStatus();
        }

        window.toggleOption = function(index) {
            if (hasAnswered) return;
            const q = questions[currentQuestionIndex];
            const btn = document.querySelector(`.option-btn[data-index="${index}"]`);
            
            if (!q.is_multi) {
                // Single choice
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                selectedOptions.clear();
                selectedOptions.add(index);
                btn.classList.add('selected');
            } else {
                // Multi choice
                if (selectedOptions.has(index)) {
                    selectedOptions.delete(index);
                    btn.classList.remove('selected');
                } else {
                    selectedOptions.add(index);
                    btn.classList.add('selected');
                }
            }
            
            document.getElementById('submit-btn').disabled = selectedOptions.size === 0;
            saveState();
        }

        window.submitAnswer = function() {
            if (hasAnswered || selectedOptions.size === 0) return;
            hasAnswered = true;
            
            const q = questions[currentQuestionIndex];
            let expectedCorrectCount = q.options.filter(o => o.isCorrect).length;
            let userCorrectSelections = 0;
            let userWrongSelections = 0;
            
            q.options.forEach((opt, idx) => {
                const isSelected = selectedOptions.has(idx);
                if (opt.isCorrect) {
                    if (isSelected) userCorrectSelections++;
                } else if (isSelected) {
                    userWrongSelections++;
                }
            });
            
            const isFullyCorrect = userCorrectSelections === expectedCorrectCount && userWrongSelections === 0;
            
            if (isFullyCorrect) {
                score++;
            }
            
            document.getElementById('submit-btn').classList.add('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
            
            saveState();
            showAnswerResult();
        }
        
        function showAnswerResult() {
            const q = questions[currentQuestionIndex];
            const buttons = document.querySelectorAll('.option-btn');
            
            let expectedCorrectCount = q.options.filter(o => o.isCorrect).length;
            let userCorrectSelections = 0;
            let userWrongSelections = 0;
            
            buttons.forEach(btn => {
                btn.disabled = true;
                const idx = parseInt(btn.getAttribute('data-index'));
                const isSelected = selectedOptions.has(idx);
                const isCorrect = q.options[idx].isCorrect;
                
                if (isCorrect) {
                    btn.classList.add('correct');
                    if (isSelected) userCorrectSelections++;
                } else if (isSelected) {
                    btn.classList.add('wrong');
                    userWrongSelections++;
                }
            });
            
            const isFullyCorrect = userCorrectSelections === expectedCorrectCount && userWrongSelections === 0;
            
            const msgEl = document.getElementById('result-msg');
            msgEl.classList.remove('hidden');
            
            if (isFullyCorrect) {
                msgEl.textContent = '✅ Correct!';
                msgEl.className = 'result-message result-success';
            } else {
                msgEl.textContent = '❌ Incorrect. Review the correct answer(s) highlighted in green.';
                msgEl.className = 'result-message result-error';
            }
            updateStatus();
        }

        window.nextQuestion = function() {
            currentQuestionIndex++;
            hasAnswered = false;
            selectedOptions.clear();
            
            if (currentQuestionIndex < questions.length) {
                saveState();
                renderQuestion();
            } else {
                isCompleted = true;
                saveState();
                showCompletion();
            }
        }

        function showCompletion() {
            questionArea.classList.add('hidden');
            completionScreen.classList.remove('hidden');
            document.getElementById('final-score').textContent = score;
            document.getElementById('final-total').textContent = questions.length;
        }

        // Start
        initQuiz();
    </script>
</body>
</html>

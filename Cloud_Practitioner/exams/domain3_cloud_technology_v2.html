<body>
<header>
  <div class="aws-badge">CLF-C02</div>
  <div>
    <h1>Domain 3: Cloud Technology and Services <span class="v2-badge">v2 · Harder</span></h1>
    <p>34% of scored content &nbsp;·&nbsp; 35 questions &nbsp;·&nbsp; Scenario-based &amp; tricky</p>

<div class="progress-bar-wrap">

<main>

  <div id="results">
    <div class="score-circle"><span class="score-num" id="scoreNum">0%</span><span class="score-label">Score</span></div>
    <h2 id="resultTitle"></h2><p id="resultMsg"></p>
    <div class="result-stats">
      <div class="stat-box"><div class="val correct-val" id="correctCount">0</div><div class="lbl">Correct</div></div>
      <div class="stat-box"><div class="val wrong-val" id="wrongCount">0</div><div class="lbl">Incorrect</div></div>

    </div>

  </div>
</main>

<script>
const questions = [
  // ── Global Infrastructure ──────────────────────────────────────────────
  {
    tag:"Global Infrastructure", diff:"hard",
    scenario:"A company deploys their app in us-east-1 across 3 AZs. One AZ loses power completely.",
    text:"What happens to the application if it is properly architected for Multi-AZ?",
    options:[
      "The entire application goes down until the AZ recovers",
      "Traffic automatically routes to the remaining 2 AZs with no manual intervention",
      "AWS automatically moves the EC2 instances to another AZ",
      "The application degrades but requires manual failover"
    ],
    answer:1,
    explanation:"With proper Multi-AZ architecture (load balancer + Auto Scaling across 3 AZs), the load balancer detects the unhealthy AZ via health checks and stops routing traffic there. The remaining 2 AZs absorb the traffic automatically. EC2 instances are NOT moved — new ones can be launched in healthy AZs by Auto Scaling."
  },
  {
    tag:"Global Infrastructure", diff:"hard",
    text:"What is the difference between an AWS Region and an AWS Availability Zone?",
    options:[
      "A Region is a single data center; an AZ is a group of Regions",
      "A Region is a geographic area with 3+ isolated AZs; an AZ is one or more discrete data centers with redundant power, networking, and connectivity",
      "AZs and Regions are the same concept",
      "A Region is for compute; an AZ is for storage"
    ],
    answer:1,
    explanation:"A Region is a geographic cluster of AZs (e.g., us-east-1 in N. Virginia). Each AZ is one or more physically separate data centers within that Region, connected by low-latency links. AZs are isolated from each other to prevent correlated failures — a fire in one AZ doesn't affect others."
  },
  {
    tag:"Global Infrastructure", diff:"medium",
    text:"Which AWS service uses a global network of Edge Locations to reduce latency for dynamic content and API calls (not just static caching)?",
    options:[
      "Amazon CloudFront only caches static content",
      "AWS Global Accelerator — routes traffic through AWS's private network to the nearest healthy endpoint",
      "Amazon Route 53 latency routing",
      "AWS Direct Connect"
    ],
    answer:1,
    explanation:"AWS Global Accelerator uses AWS's private global network (not the public internet) to route user traffic to the nearest AWS endpoint, reducing latency for dynamic content and APIs. CloudFront caches content at edge locations. Global Accelerator doesn't cache — it just routes traffic faster via the AWS backbone."
  },
  // ── Compute ───────────────────────────────────────────────────────────
  {
    tag:"Compute", diff:"hard",
    scenario:"A company runs a web app with unpredictable traffic. During business hours, they need 10 instances. At night, 2 instances are enough. On Black Friday, they might need 50.",
    text:"Which combination of EC2 purchasing options is MOST cost-effective?",
    options:[
      "100% On-Demand for all instances",
      "2 Reserved Instances (baseline) + On-Demand or Spot for variable demand",
      "50 Reserved Instances to cover peak demand",
      "100% Spot Instances"
    ],
    answer:1,
    explanation:"Best practice: Reserve the minimum baseline (2 instances always running) with Reserved Instances for maximum savings. Use On-Demand for predictable variable demand, and Spot for flexible/fault-tolerant burst capacity. Reserving 50 instances wastes money during off-peak. 100% Spot risks interruption during critical hours."
  },
  {
    tag:"Compute", diff:"hard",
    text:"What is the key difference between vertical scaling and horizontal scaling in AWS?",
    options:[
      "Vertical scaling adds more instances; horizontal scaling uses larger instances",
      "Vertical scaling increases the size of an existing instance (scale up); horizontal scaling adds more instances (scale out)",
      "They are the same concept",
      "Vertical scaling is only for databases; horizontal scaling is only for web servers"
    ],
    answer:1,
    explanation:"Vertical scaling (scale up/down) = changing instance size (t3.small → m5.xlarge). Requires downtime for EC2. Horizontal scaling (scale out/in) = adding/removing instances. AWS recommends horizontal scaling because it's more resilient (no single point of failure) and can be automated with Auto Scaling Groups."
  },
  {
    tag:"Compute", diff:"hard",
    scenario:"A company needs to run a containerized microservices application. The DevOps team is familiar with Kubernetes but doesn't want to manage the Kubernetes control plane.",
    text:"Which AWS service is the BEST fit?",
    options:[
      "Amazon ECS with EC2 launch type",
      "Amazon EKS — managed Kubernetes that handles the control plane",
      "AWS Fargate standalone",
      "AWS Elastic Beanstalk"
    ],
    answer:1,
    explanation:"Amazon EKS (Elastic Kubernetes Service) manages the Kubernetes control plane (API server, etcd, scheduler) so you don't have to. Teams familiar with Kubernetes can use the same kubectl tools and manifests. ECS is AWS's own container orchestration (not Kubernetes). Fargate is the serverless compute engine that can run EKS or ECS pods."
  },
  {
    tag:"Compute", diff:"hard",
    text:"Which statement about AWS Lambda is MOST accurate regarding its limitations?",
    options:[
      "Lambda can run indefinitely with no time limit",
      "Lambda has a maximum execution timeout of 15 minutes — not suitable for long-running processes",
      "Lambda cannot be triggered by S3 events",
      "Lambda requires you to manage the underlying EC2 instances"
    ],
    answer:1,
    explanation:"Lambda has a maximum execution timeout of 15 minutes (900 seconds). For long-running processes (video transcoding, large ETL jobs), use EC2, ECS/Fargate, or AWS Batch instead. Lambda is ideal for short, event-driven tasks. It also has memory limits (10GB) and deployment package size limits."
  },
  {
    tag:"Compute", diff:"medium",
    text:"A company wants to deploy a simple web application without managing servers, load balancers, or auto scaling groups. Which service handles all of this automatically?",
    options:[
      "Amazon EC2 with manual configuration",
      "AWS Elastic Beanstalk — PaaS that automatically handles infrastructure",
      "AWS Lambda",
      "Amazon ECS"
    ],
    answer:1,
    explanation:"AWS Elastic Beanstalk is a PaaS service where you upload your application code (Node.js, Python, Java, etc.) and Elastic Beanstalk automatically provisions EC2 instances, load balancers, Auto Scaling, and health monitoring. You retain full control of the underlying resources but don't have to configure them manually."
  },
  // ── Storage ───────────────────────────────────────────────────────────
  {
    tag:"Storage", diff:"hard",
    text:"What is the difference between Amazon EBS and Amazon EFS?",
    options:[
      "EBS is object storage; EFS is block storage",
      "EBS is block storage attached to a single EC2 instance in one AZ; EFS is a managed NFS file system mountable by multiple instances across multiple AZs",
      "EFS is cheaper than EBS for all use cases",
      "EBS supports Linux and Windows; EFS only supports Windows"
    ],
    answer:1,
    explanation:"EBS = block storage, attached to ONE EC2 instance at a time, in a specific AZ (like a hard drive). EFS = managed NFS file system, mountable by MULTIPLE Linux EC2 instances simultaneously across multiple AZs (like a shared network drive). EFS is more expensive per GB but scales automatically."
  },
  {
    tag:"Storage", diff:"hard",
    scenario:"A company stores 100TB of data in S3. 80% of the data hasn't been accessed in over a year. They want to minimize storage costs while retaining the ability to retrieve any object within 12 hours.",
    text:"Which S3 storage class is MOST cost-effective?",
    options:[
      "S3 Standard — for frequently accessed data",
      "S3 Standard-IA — for infrequent access",
      "S3 Glacier Flexible Retrieval — low cost with retrieval times of minutes to 12 hours",
      "S3 Glacier Deep Archive — lowest cost but retrieval takes up to 48 hours"
    ],
    answer:2,
    explanation:"S3 Glacier Flexible Retrieval offers retrieval times of 1-5 minutes (Expedited), 3-5 hours (Standard), or 5-12 hours (Bulk) — meeting the 12-hour requirement. Deep Archive takes up to 48 hours, which doesn't meet the requirement. Glacier is ~$0.004/GB vs Standard's ~$0.023/GB — significant savings for 80TB of cold data."
  },
  {
    tag:"Storage", diff:"hard",
    text:"Which S3 feature automatically moves objects between storage classes based on access patterns, without requiring you to know the access patterns in advance?",
    options:[
      "S3 Lifecycle Policies",
      "S3 Intelligent-Tiering",
      "S3 Replication",
      "S3 Versioning"
    ],
    answer:1,
    explanation:"S3 Intelligent-Tiering automatically moves objects between access tiers (Frequent, Infrequent, Archive Instant, Archive, Deep Archive) based on actual access patterns — with no retrieval fees and no performance impact. Lifecycle Policies require you to define rules based on age, not actual access patterns."
  },
  {
    tag:"Storage", diff:"hard",
    text:"A company needs to run a high-performance database on EC2 requiring the lowest possible latency storage. Which EBS volume type should they use?",
    options:[
      "gp2 (General Purpose SSD)",
      "st1 (Throughput Optimized HDD)",
      "io2 Block Express — highest performance SSD with up to 256,000 IOPS",
      "sc1 (Cold HDD)"
    ],
    answer:2,
    explanation:"io2 Block Express is the highest-performance EBS volume type, designed for I/O-intensive databases (Oracle, SQL Server, SAP HANA) requiring sub-millisecond latency and up to 256,000 IOPS. gp3/gp2 are for general workloads. st1/sc1 are HDDs for throughput-intensive sequential workloads — not suitable for databases."
  },
  // ── Databases ─────────────────────────────────────────────────────────
  {
    tag:"Databases", diff:"hard",
    text:"What is the key difference between Amazon RDS Multi-AZ and Amazon Aurora's storage architecture?",
    options:[
      "RDS Multi-AZ replicates data synchronously to a standby in another AZ; Aurora replicates data 6 ways across 3 AZs automatically at the storage layer",
      "Aurora Multi-AZ is the same as RDS Multi-AZ",
      "RDS is faster than Aurora for all workloads",
      "Aurora does not support Multi-AZ deployments"
    ],
    answer:0,
    explanation:"RDS Multi-AZ: synchronous replication to ONE standby instance in another AZ — failover takes 1-2 minutes. Aurora: automatically replicates data 6 ways across 3 AZs at the storage layer — no single point of failure, faster failover (~30 seconds), and reads can be served from any replica. Aurora's architecture is fundamentally more resilient."
  },
  {
    tag:"Databases", diff:"hard",
    scenario:"A gaming company needs a database that can handle 1 million requests per second with single-digit millisecond latency. The data model is simple key-value pairs.",
    text:"Which AWS database service is the BEST fit?",
    options:[
      "Amazon RDS Aurora — high performance relational database",
      "Amazon DynamoDB — NoSQL with single-digit millisecond performance at any scale",
      "Amazon ElastiCache Redis — in-memory cache",
      "Amazon Redshift — data warehouse"
    ],
    answer:1,
    explanation:"DynamoDB is designed for exactly this use case: massive scale (millions of requests/second), single-digit millisecond latency, and simple key-value or document data models. ElastiCache Redis is faster (microseconds) but is a cache, not a primary database. Aurora is relational and doesn't scale to millions of RPS as easily."
  },
  {
    tag:"Databases", diff:"hard",
    text:"Which AWS service is a fully managed, serverless data warehouse optimized for analytical queries (OLAP) on petabytes of data?",
    options:[
      "Amazon RDS",
      "Amazon DynamoDB",
      "Amazon Redshift",
      "Amazon Aurora"
    ],
    answer:2,
    explanation:"Amazon Redshift is AWS's managed data warehouse service optimized for OLAP (Online Analytical Processing) — complex queries across large datasets for business intelligence and analytics. RDS/Aurora are for OLTP (transactional). DynamoDB is NoSQL. Redshift uses columnar storage and massively parallel processing."
  },
  {
    tag:"Databases", diff:"medium",
    text:"A company wants to add a caching layer in front of their RDS database to reduce read latency from milliseconds to microseconds. Which service should they use?",
    options:[
      "Amazon CloudFront",
      "Amazon ElastiCache (Redis or Memcached)",
      "Amazon DynamoDB Accelerator (DAX)",
      "AWS Global Accelerator"
    ],
    answer:1,
    explanation:"Amazon ElastiCache provides in-memory caching using Redis or Memcached, reducing database read latency from milliseconds to microseconds. DAX is specifically for DynamoDB (not RDS). CloudFront caches HTTP responses at edge locations. ElastiCache is the right choice for RDS read caching."
  },
  // ── Networking ────────────────────────────────────────────────────────
  {
    tag:"Networking", diff:"hard",
    text:"What is the difference between a Security Group and a Network ACL (NACL)?",
    options:[
      "Security Groups are stateless; NACLs are stateful",
      "Security Groups are stateful and operate at the instance level with Allow-only rules; NACLs are stateless and operate at the subnet level with Allow and Deny rules",
      "NACLs are more secure than Security Groups",
      "Security Groups can block specific IP addresses; NACLs cannot"
    ],
    answer:1,
    explanation:"Security Groups: stateful (return traffic auto-allowed), instance-level, Allow rules only, evaluated as a whole. NACLs: stateless (must explicitly allow both directions), subnet-level, Allow AND Deny rules, evaluated in order by rule number. NACLs are the only way to explicitly block specific IP addresses in a VPC."
  },
  {
    tag:"Networking", diff:"hard",
    scenario:"A company has VPCs in us-east-1 and eu-west-1. They need all VPCs to communicate with each other and with their on-premises network through a single hub.",
    text:"Which AWS service simplifies this hub-and-spoke network topology?",
    options:[
      "VPC Peering between each pair of VPCs",
      "AWS Transit Gateway — acts as a central hub connecting VPCs and on-premises networks",
      "AWS Direct Connect for each VPC",
      "Internet Gateway with VPN"
    ],
    answer:1,
    explanation:"AWS Transit Gateway acts as a regional network hub. Instead of creating N*(N-1)/2 VPC peering connections (which don't scale), you connect each VPC and on-premises network to the Transit Gateway once. It supports cross-region peering and simplifies routing. VPC Peering doesn't support transitive routing."
  },
  {
    tag:"Networking", diff:"hard",
    text:"A company uses Route 53 to route traffic between their primary region (us-east-1) and a disaster recovery region (us-west-2). They want traffic to automatically failover to us-west-2 if us-east-1 becomes unhealthy. Which routing policy should they use?",
    options:[
      "Weighted routing — split traffic 90/10",
      "Latency-based routing",
      "Failover routing — primary/secondary with health checks",
      "Geolocation routing"
    ],
    answer:2,
    explanation:"Route 53 Failover routing designates one record as Primary and another as Secondary. Route 53 health checks monitor the primary endpoint — if it fails, traffic automatically routes to the secondary (DR) region. This is the standard pattern for active-passive disaster recovery."
  }
  // ── AI/ML & Analytics ─────────────────────────────────────────────────
  {
    tag:"AI/ML Services", diff:"hard",
    text:"Which AWS service would you use to build, train, and deploy custom machine learning models at scale without managing infrastructure?",
    options:[
      "Amazon Rekognition",
      "Amazon SageMaker",
      "AWS DeepLens",
      "Amazon Comprehend"
    ],
    answer:1,
    explanation:"Amazon SageMaker is the fully managed ML platform for the entire ML lifecycle: data labeling, feature engineering, model training, hyperparameter tuning, and deployment. The other services are pre-built AI services for specific tasks (Rekognition=images, Comprehend=NLP) — they don't let you train custom models."
  },
  {
    tag:"AI/ML Services", diff:"hard",
    text:"A company wants to add real-time speech-to-text transcription to their call center application. Which AWS service should they use?",
    options:[
      "Amazon Polly — converts text to speech",
      "Amazon Transcribe — converts speech to text",
      "Amazon Lex — builds conversational chatbots",
      "Amazon Comprehend — analyzes text sentiment"
    ],
    answer:1,
    explanation:"Amazon Transcribe converts speech to text (STT). Amazon Polly is the opposite — text to speech (TTS). These are commonly confused on the exam. Lex builds chatbots (uses Transcribe + NLU internally). Comprehend analyzes existing text for sentiment, entities, and key phrases."
  },
  {
    tag:"AI/ML Services", diff:"medium",
    scenario:"A retail company wants to automatically analyze product images uploaded by customers to detect inappropriate content and identify product categories.",
    text:"Which AWS service should they use?",
    options:[
      "Amazon Comprehend",
      "Amazon Textract",
      "Amazon Rekognition",
      "Amazon Kendra"
    ],
    answer:2,
    explanation:"Amazon Rekognition analyzes images and videos using deep learning — detecting objects, scenes, faces, text, and inappropriate content (moderation). Textract extracts text from documents. Comprehend analyzes text. Kendra is an intelligent search service. Rekognition is the right choice for image/video analysis."
  },
  {
    tag:"AI/ML Services", diff:"hard",
    text:"Which AWS service provides a fully managed, serverless interactive query service that analyzes data directly in S3 using standard SQL?",
    options:[
      "Amazon Redshift",
      "Amazon RDS",
      "Amazon Athena",
      "AWS Glue"
    ],
    answer:2,
    explanation:"Amazon Athena is serverless — no infrastructure to manage, no data loading required. You point it at S3 data (CSV, JSON, Parquet, ORC) and run SQL queries. Pay only for data scanned. AWS Glue is the ETL service that can catalog and transform data before Athena queries it. Redshift requires loading data into a cluster."
  },
  {
    tag:"AI/ML Services", diff:"medium",
    text:"Amazon Bedrock is used for which purpose?",
    options:[
      "Running containerized workloads without managing servers",
      "Accessing and building applications with foundation models (FMs) from AWS and third-party providers via a single API",
      "Training custom ML models from scratch",
      "Storing and querying vector embeddings for ML applications"
    ],
    answer:1,
    explanation:"Amazon Bedrock provides access to foundation models (FMs) from AWS (Titan) and third parties (Anthropic Claude, Meta Llama, Mistral) via a single API — without managing infrastructure. It's for building generative AI applications. SageMaker is for training custom models. Bedrock is for using pre-built FMs."
  },
  // ── Decoupling & Integration ───────────────────────────────────────────
  {
    tag:"Application Integration", diff:"hard",
    text:"What is the key difference between Amazon SQS and Amazon SNS?",
    options:[
      "SQS is for email; SNS is for queuing",
      "SQS is a pull-based message queue (consumers poll for messages); SNS is a push-based pub/sub service (pushes to all subscribers simultaneously)",
      "They are the same service",
      "SNS stores messages longer than SQS"
    ],
    answer:1,
    explanation:"SQS: pull-based queue — consumers poll the queue, messages are processed once and deleted, supports decoupling and load leveling. SNS: push-based pub/sub — publishes to ALL subscribers simultaneously (fan-out). Common pattern: SNS → multiple SQS queues (fan-out to multiple consumers). SQS default retention: 4 days (max 14)."
  },
  {
    tag:"Application Integration", diff:"hard",
    scenario:"A company processes orders. When an order is placed, they need to: (1) send a confirmation email, (2) update inventory, and (3) notify the warehouse — all simultaneously.",
    text:"Which architecture pattern achieves this?",
    options:[
      "One SQS queue that all three systems poll",
      "SNS topic with three SQS queues subscribed — fan-out pattern",
      "Three separate Lambda functions called sequentially",
      "Amazon EventBridge with one rule"
    ],
    answer:1,
    explanation:"The SNS fan-out pattern: publish once to SNS, which simultaneously delivers to all subscribed SQS queues. Each system (email, inventory, warehouse) has its own SQS queue and processes independently. This decouples the systems — if the warehouse system is slow, it doesn't affect email or inventory processing."
  },
  {
    tag:"Application Integration", diff:"hard",
    text:"Which AWS service is best for orchestrating a multi-step workflow where each step depends on the previous one, with error handling and retry logic?",
    options:[
      "Amazon SQS",
      "Amazon SNS",
      "AWS Step Functions",
      "Amazon EventBridge"
    ],
    answer:2,
    explanation:"AWS Step Functions orchestrates multi-step workflows as state machines — defining the sequence of steps, handling errors, retries, and parallel execution. It's ideal for order processing, data pipelines, and ML workflows. SQS/SNS are for messaging, not workflow orchestration."
  },
  // ── DevOps & Deployment ───────────────────────────────────────────────
  {
    tag:"Deployment & DevOps", diff:"hard",
    text:"Which AWS service provides a fully managed CI/CD pipeline that automatically triggers when code is pushed to a repository?",
    options:[
      "AWS CodeBuild — builds and tests code",
      "AWS CodeDeploy — deploys applications",
      "AWS CodePipeline — orchestrates the full CI/CD pipeline",
      "AWS CodeCommit — hosts Git repositories"
    ],
    answer:2,
    explanation:"CodePipeline orchestrates the entire CI/CD workflow: Source (CodeCommit/GitHub) → Build (CodeBuild) → Test → Deploy (CodeDeploy/Elastic Beanstalk/ECS). Each service has a specific role: CodeCommit=source control, CodeBuild=build/test, CodeDeploy=deployment, CodePipeline=orchestration."
  },
  {
    tag:"Deployment & DevOps", diff:"hard",
    text:"What is the difference between AWS CloudFormation and AWS CDK?",
    options:[
      "CloudFormation uses YAML/JSON templates; CDK lets you define infrastructure using familiar programming languages (Python, TypeScript, Java) that synthesize to CloudFormation",
      "CDK is a replacement for CloudFormation",
      "CloudFormation is for AWS resources; CDK is for third-party resources",
      "They are the same tool with different names"
    ],
    answer:0,
    explanation:"CloudFormation: define infrastructure in YAML/JSON templates directly. CDK (Cloud Development Kit): write infrastructure in Python, TypeScript, Java, etc. — CDK synthesizes your code into CloudFormation templates. CDK is higher-level abstraction with reusable constructs. Both ultimately use CloudFormation for deployment."
  },
  // ── Monitoring & Management ────────────────────────────────────────────
  {
    tag:"Monitoring & Management", diff:"hard",
    text:"A company wants to automatically restart an EC2 instance when CPU utilization drops to 0% for 10 minutes (indicating the instance has crashed). Which service enables this?",
    options:[
      "AWS CloudTrail",
      "Amazon CloudWatch Alarm with EC2 action (reboot/recover)",
      "AWS Config",
      "AWS Trusted Advisor"
    ],
    answer:1,
    explanation:"CloudWatch Alarms can monitor EC2 metrics (CPU, network, disk) and trigger automated actions: reboot, stop, terminate, or recover an EC2 instance. Setting an alarm on CPUUtilization = 0 for 10 minutes can trigger an automatic reboot. This is a key operational automation pattern."
  },
  {
    tag:"Monitoring & Management", diff:"hard",
    text:"Which AWS service provides recommendations across 5 categories: Cost Optimization, Performance, Security, Fault Tolerance, and Service Limits?",
    options:[
      "AWS Config",
      "Amazon CloudWatch",
      "AWS Trusted Advisor",
      "AWS Well-Architected Tool"
    ],
    answer:2,
    explanation:"AWS Trusted Advisor analyzes your AWS environment and provides real-time recommendations across 5 categories. Basic/Developer plans get 7 core checks; Business/Enterprise get 100+ checks. The Well-Architected Tool is for structured architecture reviews against the 6 pillars — different purpose."
  },
  {
    tag:"Monitoring & Management", diff:"medium",
    text:"Which AWS service allows you to view and manage all your AWS resources across multiple accounts and regions from a single console?",
    options:[
      "AWS Organizations",
      "AWS Control Tower",
      "AWS Systems Manager",
      "Amazon CloudWatch"
    ],
    answer:2,
    explanation:"AWS Systems Manager provides a unified interface to view operational data and manage AWS resources across accounts and regions. Features include Session Manager (browser-based SSH), Patch Manager, Parameter Store, and Run Command. Organizations manages account structure; Control Tower sets up landing zones."
  },
  // ── Other Services ────────────────────────────────────────────────────
  {
    tag:"Other Services", diff:"hard",
    text:"A company wants to run HPC (High Performance Computing) workloads requiring tightly coupled, low-latency communication between instances. Which EC2 feature should they use?",
    options:[
      "Enhanced Networking with ENA",
      "Placement Groups (Cluster) — places instances physically close together in the same AZ for low-latency networking",
      "Dedicated Hosts",
      "EC2 Auto Scaling"
    ],
    answer:1,
    explanation:"Cluster Placement Groups place instances physically close together within a single AZ, enabling low-latency, high-throughput networking (up to 100 Gbps) between instances. Essential for HPC, distributed computing, and ML training. Enhanced Networking (ENA) improves individual instance network performance but doesn't control physical placement."
  },
  {
    tag:"Other Services", diff:"hard",
    text:"Which AWS service provides a hybrid cloud storage solution that connects on-premises applications to AWS cloud storage, appearing as a local NFS/SMB share or iSCSI volume?",
    options:[
      "AWS DataSync",
      "AWS Storage Gateway",
      "Amazon EFS",
      "AWS Snowball"
    ],
    answer:1,
    explanation:"AWS Storage Gateway is a hybrid storage service that connects on-premises environments to AWS storage. Types: File Gateway (NFS/SMB → S3), Volume Gateway (iSCSI → EBS snapshots), Tape Gateway (virtual tape library → S3 Glacier). DataSync is for one-time or scheduled data migration, not ongoing hybrid access."
  }
];

const STORAGE_KEY = 'quiz_domain3_v2';
let current = 0, answered = [], score = 0;

function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify({ current, answered, score })); }
function loadState() { try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); current = s.current || 0; answered = s.answered || []; score = s.score || 0; } catch(e) {} }

function buildQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card' + (i === current ? ' active' : '');
    card.id = 'q' + i;
    const scenarioHtml = q.scenario ? `<div class="q-scenario">📋 ${q.scenario}</div>` : '';
    card.innerHTML = `
      <div class="q-meta">
        <span class="q-number">Question ${i+1} of ${questions.length}</span>
        <span class="q-tag">${q.tag}</span>
        <span class="q-diff diff-${q.diff}">${q.diff === 'hard' ? '🔴 Hard' : '🟡 Medium'}</span>
      </div>
      ${scenarioHtml}
      <div class="q-text">${q.text}</div>
      <div class="options" id="opts${i}">
        ${q.options.map((o, j) => `<div class="option" id="opt${i}_${j}" onclick="selectAnswer(${i},${j})"><div class="opt-letter">${String.fromCharCode(65+j)}</div><div class="opt-text">${o}</div></div>`).join('')}
      </div>
      <div class="explanation" id="exp${i}"></div>
      <div class="nav">
        <button class="btn btn-secondary" onclick="prevQ(${i})" ${i===0?'disabled':''}>← Previous</button>
        <button class="btn btn-primary" id="nextBtn${i}" onclick="nextQ(${i})" disabled>${i===questions.length-1?'Finish Quiz':'Next →'}</button>
      </div>`;
    container.appendChild(card);
  });
  answered.forEach((optIdx, qIdx) => {
    if (optIdx === undefined) return;
    const q = questions[qIdx];
    const opts = document.querySelectorAll(`#opts${qIdx} .option`);
    opts.forEach(o => o.classList.add('disabled'));
    opts[optIdx].classList.add(optIdx === q.answer ? 'correct' : 'wrong');
    if (optIdx !== q.answer) opts[q.answer].classList.add('correct');
    const exp = document.getElementById(`exp${qIdx}`);
    exp.textContent = '💡 ' + q.explanation;
    exp.className = 'explanation show' + (optIdx !== q.answer ? ' wrong-exp' : '');
    document.getElementById(`nextBtn${qIdx}`).disabled = false;
  });
  updateProgress();
}

function selectAnswer(qIdx, optIdx) {
  if (answered[qIdx] !== undefined) return;
  answered[qIdx] = optIdx;
  const q = questions[qIdx];
  const opts = document.querySelectorAll(`#opts${qIdx} .option`);
  opts.forEach(o => o.classList.add('disabled'));
  opts[optIdx].classList.add(optIdx === q.answer ? 'correct' : 'wrong');
  if (optIdx !== q.answer) opts[q.answer].classList.add('correct');
  if (optIdx === q.answer) score++;
  const exp = document.getElementById(`exp${qIdx}`);
  exp.textContent = '💡 ' + q.explanation;
  exp.className = 'explanation show' + (optIdx !== q.answer ? ' wrong-exp' : '');
  document.getElementById(`nextBtn${qIdx}`).disabled = false;
  saveState();
}

function nextQ(i) {
  if (answered[i] === undefined) return;
  document.getElementById('q'+i).classList.remove('active');
  if (i === questions.length - 1) { showResults(); return; }
  current = i + 1;
  document.getElementById('q'+current).classList.add('active');
  updateProgress(); saveState();
}

function prevQ(i) {
  if (i === 0) return;
  document.getElementById('q'+i).classList.remove('active');
  current = i - 1;
  document.getElementById('q'+current).classList.add('active');
  updateProgress(); saveState();
}

function updateProgress() {
  document.getElementById('progressFill').style.width = (current / questions.length * 100).toFixed(0) + '%';
  document.getElementById('progressLabel').textContent = `Question ${current+1} of ${questions.length}`;
}

function showResults() {
  document.getElementById('quiz-container').style.display = 'none';
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressLabel').textContent = 'Quiz Complete!';
  const pct = Math.round(score / questions.length * 100);
  document.getElementById('scoreNum').textContent = pct + '%';
  document.getElementById('correctCount').textContent = score;
  document.getElementById('wrongCount').textContent = questions.length - score;
  document.getElementById('totalCount').textContent = questions.length;
  const pass = pct >= 70;
  document.getElementById('resultTitle').textContent = pass ? '🎉 Passed!' : '📚 Keep Studying';
  document.getElementById('resultTitle').className = pass ? 'pass' : 'fail';
  document.getElementById('resultMsg').textContent = pass
    ? `You scored ${pct}% on this harder v2 exam — Domain 3 mastered!`
    : `You scored ${pct}%. Domain 3 is the largest domain (34%) — review the explanations and retry.`;
  document.getElementById('results').style.display = 'block';
  localStorage.removeItem(STORAGE_KEY);
}

function restartQuiz() {
  current = 0; answered = []; score = 0;
  localStorage.removeItem(STORAGE_KEY);
  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz-container').style.display = 'block';
  buildQuiz();
}

loadState(); buildQuiz();
</script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }

    header {
      background: linear-gradient(135deg, #1a1f2e, #232b3e);
      border-bottom: 2px solid #ff9900;
      padding: 24px 32px;
      display: flex; align-items: center; gap: 16px;
    }
    .aws-badge { background: #ff9900; color: #000; font-weight: 800; padding: 6px 14px; border-radius: 6px; font-size: 13px; letter-spacing: 1px; }
    header h1 { font-size: 22px; font-weight: 700; }
    header p { font-size: 13px; color: #94a3b8; margin-top: 2px; }
    .v2-badge { background: #7c3aed; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; margin-left: 8px; }

    .progress-bar-wrap { background: #1e2535; padding: 12px 32px; border-bottom: 1px solid #2d3748; }
    .progress-bar-track { background: #2d3748; border-radius: 99px; height: 8px; overflow: hidden; }
    .progress-bar-fill { background: #ff9900; height: 100%; border-radius: 99px; transition: width 0.4s ease; width: 0%; }

    .q-tag { font-size: 11px; background: #1e3a5f; color: #60a5fa; padding: 3px 10px; border-radius: 99px; }

    .options { display: flex; flex-direction: column; gap: 10px; }

      display: flex; align-items: flex-start; gap: 12px;

      padding: 14px 16px; cursor: pointer; transition: all 0.2s;
    }
    .option:hover:not(.disabled) { border-color: #ff9900; background: #1a1f2e; }

    .option.correct { border-color: #22c55e; background: #052e16; }

    .option.disabled { cursor: default; }

    .opt-letter {
      min-width: 28px; height: 28px; border-radius: 50%;

    }
    .option.correct .opt-letter { background: #22c55e; color: #fff; }
    .option.wrong .opt-letter { background: #ef4444; color: #fff; }
    .option.selected:not(.correct):not(.wrong) .opt-letter { background: #3b82f6; color: #fff; }
    .opt-text { font-size: 15px; line-height: 1.5; padding-top: 2px; }

    .explanation {
      margin-top: 20px; padding: 16px; background: #0d1f0d;

      font-size: 14px; line-height: 1.6; color: #86efac; display: none;
    }
    .explanation.wrong-exp { background: #1a0a0a; border-color: #ef4444; color: #fca5a5; }
    .explanation.show { display: block; animation: fadeIn 0.3s ease; }

    .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; }

    .btn-primary:hover { background: #e68900; }
    .btn-secondary { background: #2d3748; color: #e2e8f0; }
    .btn-secondary:hover { background: #374151; }

    #results {
      display: none; text-align: center;
      background: #1a1f2e; border: 1px solid #2d3748; border-radius: 16px; padding: 48px 32px;
    }

      width: 140px; height: 140px; border-radius: 50%;
      border: 6px solid #ff9900; display: flex; flex-direction: column;
      align-items: center; justify-content: center; margin: 0 auto 24px;
    }
    .score-num { font-size: 42px; font-weight: 800; color: #ff9900; }
    .score-label { font-size: 13px; color: #64748b; }
    #results h2 { font-size: 26px; margin-bottom: 8px; }
    #results p { color: #94a3b8; margin-bottom: 32px; }
    .result-stats { display: flex; gap: 24px; justify-content: center; margin-bottom: 32px; flex-wrap: wrap; }
    .stat-box { background: #0f1117; border: 1px solid #2d3748; border-radius: 10px; padding: 16px 24px; min-width: 120px; }
    .stat-box .val { font-size: 28px; font-weight: 700; }
    .stat-box .lbl { font-size: 12px; color: #64748b; margin-top: 4px; }
    .correct-val { color: #22c55e; }
    .wrong-val { color: #ef4444; }
    .pass { color: #22c55e; } .fail { color: #ef4444; }
  </style>

<body>

<header>
  <div class="aws-badge">CLF-C02</div>
  <div>
    <h1>Domain 1: Cloud Concepts <span class="v2-badge">v2 · Harder</span></h1>
    <p>24% of scored content &nbsp;·&nbsp; 30 questions &nbsp;·&nbsp; Scenario-based &amp; tricky</p>
  </div>
</header>

<div class="progress-bar-wrap">
  <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">Question 1 of 30</div>
</div>

<main>
  <div id="quiz-container"></div>
  <div id="results">
    <div class="score-circle"><span class="score-num" id="scoreNum">0%</span><span class="score-label">Score</span></div>
    <h2 id="resultTitle"></h2>
    <p id="resultMsg"></p>
    <div class="result-stats">
      <div class="stat-box"><div class="val correct-val" id="correctCount">0</div><div class="lbl">Correct</div></div>
      <div class="stat-box"><div class="val wrong-val" id="wrongCount">0</div><div class="lbl">Incorrect</div></div>
      <div class="stat-box"><div class="val" id="totalCount">30</div><div class="lbl">Total</div></div>
    </div>
    <button class="btn btn-primary" onclick="restartQuiz()">🔄 Restart Quiz</button>
  </div>
</main>

<script>
const questions = [
  // ── TASK 1.1: Benefits of AWS Cloud ──────────────────────────────────────
  {
    tag: "1.1 Benefits of AWS Cloud", diff: "medium",
    scenario: "A retail company runs its own data center. During the holiday season, traffic spikes 10x. For the rest of the year, 70% of their servers sit idle.",
    text: "Which TWO cloud benefits most directly address this company's problem? (Choose the BEST single answer that captures both)",
    options: [
      "Economies of scale and go global in minutes",
      "Elasticity and stop guessing capacity",
      "High availability and fault tolerance",
      "Trade fixed expense for variable expense and increase speed and agility"
    ],
    answer: 1,
    explanation: "Elasticity solves the spike problem (auto-scale up/down), and 'stop guessing capacity' directly addresses the idle server waste. The company over-provisioned because they had to guess peak demand upfront — cloud eliminates this."
  },
  {
    tag: "1.1 Benefits of AWS Cloud", diff: "hard",
    text: "A company claims their on-premises data center has 99.95% uptime, which is better than a single AWS Availability Zone. Why would migrating to AWS still improve availability?",
    options: [
      "AWS guarantees 100% uptime via SLA",
      "AWS Regions contain multiple isolated AZs, allowing architectures that exceed single-location uptime",
      "AWS uses more expensive hardware than on-premises",
      "On-premises uptime calculations are always inaccurate"
    ],
    answer: 1,
    explanation: "A single AZ may not beat a well-run data center, but AWS Regions have 3+ isolated AZs connected by low-latency links. Deploying across multiple AZs creates redundancy that is extremely difficult and expensive to replicate on-premises."
  },
  {
    tag: "1.1 Benefits of AWS Cloud", diff: "hard",
    text: "Which statement BEST distinguishes 'high availability' from 'fault tolerance'?",
    options: [
      "They are the same concept with different names",
      "High availability minimizes downtime; fault tolerance means the system continues operating with zero interruption even when components fail",
      "Fault tolerance is cheaper to implement than high availability",
      "High availability requires multiple Regions; fault tolerance only requires multiple AZs"
    ],
    answer: 1,
    explanation: "High availability (HA) aims to minimize downtime — brief interruptions may occur during failover. Fault tolerance means the system has NO interruption even when a component fails (e.g., RAID storage, redundant power). HA is easier/cheaper; fault tolerance is stricter and more expensive."
  },
  {
    tag: "1.1 Benefits of AWS Cloud", diff: "medium",
    scenario: "A startup launches a new mobile app. Within 48 hours, it goes viral and user traffic increases 50x unexpectedly.",
    text: "Which AWS benefit allowed the startup to handle this growth without pre-planning infrastructure?",
    options: [
      "Economies of scale",
      "Go global in minutes",
      "Agility — the ability to provision resources quickly in response to demand",
      "Dedicated hardware for performance"
    ],
    answer: 2,
    explanation: "Agility in cloud computing means you can provision new resources in minutes, not weeks. The startup didn't need to pre-order servers — they could respond to the viral growth instantly. This is distinct from elasticity (auto-scaling) — agility is about speed of provisioning new resource types."
  },
  {
    tag: "1.1 Benefits of AWS Cloud", diff: "hard",
    text: "AWS has reduced its prices over 100 times since 2006. What is the PRIMARY mechanism that enables AWS to keep reducing prices?",
    options: [
      "AWS uses open-source software to reduce licensing costs",
      "AWS negotiates better hardware deals each year",
      "Economies of scale — as AWS grows, per-unit infrastructure costs decrease and savings are passed to customers",
      "AWS reduces prices to compete with Azure and GCP"
    ],
    answer: 2,
    explanation: "Economies of scale is the core mechanism: AWS aggregates demand from millions of customers worldwide, enabling massive bulk purchasing power. As the infrastructure grows, the cost per unit drops, and AWS passes these savings to customers. Competition is a factor but not the PRIMARY mechanism."
  },

  // ── TASK 1.2: Well-Architected Framework ─────────────────────────────────
  {
    tag: "1.2 Well-Architected Framework", diff: "hard",
    text: "A team stores all application logs in a single S3 bucket with no access controls, arguing it makes debugging easier. Which Well-Architected pillar is MOST violated?",
    options: [
      "Reliability — logs could be lost",
      "Security — no least-privilege access controls on sensitive log data",
      "Operational Excellence — logs should be in CloudWatch",
      "Cost Optimization — S3 is expensive for logs"
    ],
    answer: 1,
    explanation: "Security is most violated. The Security pillar requires implementing a strong identity foundation and applying least-privilege access. Logs often contain sensitive data (IPs, user actions, errors). No access controls violates the 'protect data in transit and at rest' and 'apply least privilege' design principles."
  },
  {
    tag: "1.2 Well-Architected Framework", diff: "hard",
    scenario: "An architect proposes: 'We should deploy our app in a single large EC2 instance to keep it simple. If it fails, we restart it.'",
    text: "Which Well-Architected design principle does this MOST violate?",
    options: [
      "Automate everything",
      "Design for failure — assume everything will fail and architect for resilience",
      "Use managed services",
      "Implement traceability"
    ],
    answer: 1,
    explanation: "'Design for failure' (under Reliability) means you should assume components WILL fail and architect accordingly — using multiple instances, AZs, health checks, and auto-recovery. A single instance with manual restart is the opposite of this principle."
  },
  {
    tag: "1.2 Well-Architected Framework", diff: "medium",
    text: "Which pillar of the Well-Architected Framework is PRIMARILY concerned with selecting the right instance type, using caching, and choosing between SQL vs NoSQL databases?",
    options: [
      "Cost Optimization",
      "Reliability",
      "Performance Efficiency",
      "Operational Excellence"
    ],
    answer: 2,
    explanation: "Performance Efficiency focuses on using computing resources efficiently to meet requirements. This includes selecting the right resource types (instance types, database engines), using caching (ElastiCache), and democratizing advanced technologies. Cost Optimization is about reducing spend, not matching resources to workload characteristics."
  },
  {
    tag: "1.2 Well-Architected Framework", diff: "hard",
    text: "A company uses AWS CloudFormation to deploy all infrastructure, makes changes only through pull requests, and never modifies resources manually in the console. Which Well-Architected principle does this BEST represent?",
    options: [
      "Perform operations as code (Operational Excellence)",
      "Enable traceability (Security)",
      "Automatically recover from failure (Reliability)",
      "Implement least privilege (Security)"
    ],
    answer: 0,
    explanation: "'Perform operations as code' is a key Operational Excellence design principle. Using IaC (CloudFormation, CDK) and preventing manual console changes ensures consistency, repeatability, and version control of infrastructure — reducing human error."
  },
  {
    tag: "1.2 Well-Architected Framework", diff: "hard",
    text: "The Sustainability pillar recommends maximizing utilization of provisioned resources. Which of the following practices BEST aligns with this recommendation?",
    options: [
      "Using Reserved Instances to save money",
      "Rightsizing instances and using serverless/managed services to avoid idle compute",
      "Deploying in a single Region to reduce data transfer",
      "Enabling S3 Intelligent-Tiering"
    ],
    answer: 1,
    explanation: "Sustainability focuses on minimizing environmental impact. Rightsizing eliminates idle/underutilized resources, and serverless/managed services (Lambda, Fargate) only consume resources when actively processing — maximizing utilization and reducing waste. Reserved Instances save money but don't reduce resource consumption."
  },
  {
    tag: "1.2 Well-Architected Framework", diff: "medium",
    text: "Which AWS service provides a structured way to review your workloads against the Well-Architected Framework and generates an improvement plan?",
    options: [
      "AWS Trusted Advisor",
      "AWS Config",
      "AWS Well-Architected Tool",
      "AWS Systems Manager"
    ],
    answer: 2,
    explanation: "The AWS Well-Architected Tool is a free service in the AWS Console that guides you through a series of questions for each pillar and generates a report with high-risk issues (HRIs) and an improvement plan. Trusted Advisor checks specific best practices but doesn't provide the full WAF review structure."
  },

  // ── TASK 1.3: Migration Strategies & CAF ─────────────────────────────────
  {
    tag: "1.3 Migration & CAF", diff: "hard",
    scenario: "A company is migrating a legacy monolithic Java application to AWS. They want to break it into microservices using containers and redesign the architecture to be cloud-native.",
    text: "Which of the 7 Rs migration strategy does this represent?",
    options: [
      "Rehost (Lift and Shift)",
      "Replatform (Lift, Tinker, and Shift)",
      "Refactor / Re-architect",
      "Repurchase"
    ],
    answer: 2,
    explanation: "Refactor/Re-architect means fundamentally changing how the application is designed — breaking a monolith into microservices, adopting containers/serverless, and redesigning for cloud-native patterns. This has the highest effort but also the highest long-term benefit. Replatform would be moving to containers without redesigning the architecture."
  },
  {
    tag: "1.3 Migration & CAF", diff: "hard",
    text: "A company has 200 applications. After assessment, they find 30 are no longer used by any business unit. Which migration strategy applies to these 30 applications?",
    options: [
      "Retain",
      "Retire",
      "Rehost",
      "Repurchase"
    ],
    answer: 1,
    explanation: "Retire means decommissioning applications that are no longer needed. This is often discovered during the Assess phase of migration and can immediately reduce costs and complexity. Studies show 10-20% of enterprise portfolios can typically be retired."
  },
  {
    tag: "1.3 Migration & CAF", diff: "hard",
    scenario: "A financial services company has a critical mainframe application that cannot be migrated due to regulatory requirements. It must stay on-premises for 3 more years.",
    text: "Which migration strategy applies?",
    options: [
      "Retire",
      "Rehost",
      "Retain (Revisit)",
      "Relocate"
    ],
    answer: 2,
    explanation: "Retain (Revisit) means keeping the application on-premises for now, with a plan to revisit migration later. This applies when there are regulatory, technical, or business constraints that prevent immediate migration. It's a valid strategy — not every application should be migrated immediately."
  },
  {
    tag: "1.3 Migration & CAF", diff: "hard",
    text: "Which AWS CAF perspective focuses on ensuring that cloud investments align with business outcomes, managing portfolio performance, and data monetization?",
    options: [
      "People perspective",
      "Business perspective",
      "Governance perspective",
      "Operations perspective"
    ],
    answer: 1,
    explanation: "The Business perspective ensures cloud investments accelerate digital transformation and business outcomes. It covers business strategy, portfolio management, innovation management, data monetization, and business insights. Don't confuse with Governance (risk, compliance, cloud financial management)."
  },
  {
    tag: "1.3 Migration & CAF", diff: "hard",
    text: "The AWS CAF Platform perspective includes which of the following capabilities?",
    options: [
      "Change management and organizational design",
      "Cloud financial management and risk management",
      "Platform architecture, data architecture, and platform engineering",
      "Event management and incident management"
    ],
    answer: 2,
    explanation: "The Platform perspective (Technical) covers: Platform Architecture, Data Architecture, Platform Engineering, Data Engineering, Provisioning & Orchestration, Modern Application Development, and CI/CD. Operations perspective covers event/incident management. People covers change management."
  },
  {
    tag: "1.3 Migration & CAF", diff: "medium",
    scenario: "A company needs to transfer 500 TB of data to AWS. Their internet connection is 1 Gbps.",
    text: "Approximately how long would it take to transfer 500 TB over a 1 Gbps connection, and what is the recommended AWS solution?",
    options: [
      "About 1 hour — use AWS Direct Connect",
      "About 46 days — use AWS Snowball Edge to physically ship the data",
      "About 5 days — use AWS DataSync over the internet",
      "About 1 day — use S3 Transfer Acceleration"
    ],
    answer: 1,
    explanation: "500 TB over 1 Gbps = ~46 days (500TB × 8 bits/byte ÷ 1Gbps). AWS Snowball Edge is the right solution for large data transfers where network time exceeds ~1 week. DataSync and Transfer Acceleration are for smaller transfers or ongoing sync. This is a classic exam calculation scenario."
  },
  {
    tag: "1.3 Migration & CAF", diff: "medium",
    text: "Which migration strategy involves moving a VMware-based workload from on-premises to VMware Cloud on AWS without changing the hypervisor or tools?",
    options: [
      "Rehost",
      "Replatform",
      "Relocate",
      "Refactor"
    ],
    answer: 2,
    explanation: "Relocate (the 7th R, added later) means moving infrastructure to the cloud without purchasing new hardware or rewriting applications — specifically for VMware workloads moving to VMware Cloud on AWS. It's different from Rehost (which typically uses EC2) because the hypervisor layer is preserved."
  },

  // ── TASK 1.4: Cloud Economics ─────────────────────────────────────────────
  {
    tag: "1.4 Cloud Economics", diff: "hard",
    text: "A company is building a TCO (Total Cost of Ownership) analysis to compare on-premises vs AWS. Which of the following on-premises costs is MOST commonly overlooked?",
    options: [
      "Server hardware purchase price",
      "Software licensing fees",
      "Facilities costs: power, cooling, physical security, and floor space",
      "Network equipment costs"
    ],
    answer: 2,
    explanation: "Facilities costs (power, cooling, physical security, floor space) are the most commonly underestimated on-premises costs. Companies often only count hardware but forget that a server consuming 500W costs ~$500/year in electricity alone, plus cooling (typically 1:1 ratio), plus the cost of the data center space itself."
  },
  {
    tag: "1.4 Cloud Economics", diff: "hard",
    text: "A company has a 3-year software license for a database engine that they want to use on AWS. Which EC2 purchasing option is REQUIRED to use Bring Your Own License (BYOL)?",
    options: [
      "On-Demand Instances",
      "Reserved Instances",
      "Spot Instances",
      "Dedicated Hosts"
    ],
    answer: 3,
    explanation: "Dedicated Hosts provide a physical server dedicated to your use, which is required for BYOL scenarios. Most per-socket or per-core licenses (Oracle, Windows Server, SQL Server) require you to know the exact physical hardware. Dedicated Hosts give you visibility into the physical server's sockets and cores. Dedicated Instances are different — they don't give you hardware visibility."
  },
  {
    tag: "1.4 Cloud Economics", diff: "hard",
    scenario: "A company runs 50 EC2 instances. AWS Compute Optimizer recommends downsizing 20 of them from m5.xlarge to m5.large, and upsizing 5 from t3.small to t3.medium.",
    text: "What cloud economics concept does this scenario BEST illustrate?",
    options: [
      "Economies of scale",
      "Rightsizing — matching instance size to actual workload requirements",
      "Reserved Instance purchasing strategy",
      "Spot Instance optimization"
    ],
    answer: 1,
    explanation: "Rightsizing means continuously analyzing resource utilization and adjusting instance types/sizes to match actual needs — both downsizing over-provisioned instances (saving money) and upsizing under-provisioned ones (improving performance). AWS Compute Optimizer and Cost Explorer's rightsizing recommendations are the tools for this."
  },
  {
    tag: "1.4 Cloud Economics", diff: "hard",
    text: "Which of the following BEST describes the financial benefit of automation in cloud economics?",
    options: [
      "Automation eliminates the need for cloud architects",
      "Automation reduces human labor costs and eliminates manual errors, reducing both OpEx and the cost of outages",
      "Automation only benefits large enterprises with complex workloads",
      "Automation increases costs due to the complexity of maintaining scripts"
    ],
    answer: 1,
    explanation: "Automation in cloud economics reduces OpEx by replacing manual tasks (patching, backups, scaling) with automated processes, reducing headcount requirements. It also reduces the cost of human errors (outages, misconfigurations) which can be extremely expensive. This is a key advantage over on-premises where manual operations are the norm."
  },
  {
    tag: "1.4 Cloud Economics", diff: "medium",
    text: "A company pays $10,000/month for on-premises servers that run at 15% average CPU utilization. After migrating to AWS with rightsizing, they pay $2,000/month. What does the $8,000 difference represent?",
    options: [
      "The cost of AWS support",
      "The waste from over-provisioning on-premises — paying for idle capacity",
      "The cost of data transfer to AWS",
      "The difference in software licensing"
    ],
    answer: 1,
    explanation: "Running at 15% utilization means 85% of the on-premises capacity is idle but still paid for (CapEx model). Cloud's variable cost model means you only pay for what you use. The $8,000 represents the cost of idle capacity — a core inefficiency of on-premises that cloud eliminates."
  },
  {
    tag: "1.4 Cloud Economics", diff: "hard",
    text: "Which statement about Reserved Instances vs On-Demand Instances is MOST accurate from a cloud economics perspective?",
    options: [
      "Reserved Instances always save money regardless of usage patterns",
      "Reserved Instances provide up to 72% discount but require commitment — they are only cost-effective for steady-state, predictable workloads",
      "On-Demand is always more expensive than Reserved Instances",
      "Reserved Instances can be used for any workload type including unpredictable spikes"
    ],
    answer: 1,
    explanation: "Reserved Instances (up to 72% savings vs On-Demand) require 1 or 3-year commitments. They are only cost-effective for steady-state workloads with predictable usage. For variable/unpredictable workloads, On-Demand or Spot may be better. If you commit to an RI but don't use it, you still pay — making it more expensive than On-Demand for low-utilization scenarios."
  },
  {
    tag: "1.4 Cloud Economics", diff: "hard",
    text: "A company's CTO argues: 'Our on-premises data center has a fixed cost of $1M/year. Moving to AWS will cost $800K/year. But we also lose control and have ongoing costs forever.' Which cloud economics concept BEST counters the 'ongoing costs forever' concern?",
    options: [
      "AWS Free Tier eliminates ongoing costs",
      "OpEx model allows costs to scale down with business needs — unlike CapEx which is sunk cost regardless of usage",
      "AWS provides credits to offset ongoing costs",
      "Reserved Instances convert OpEx back to CapEx"
    ],
    answer: 1,
    explanation: "The OpEx model is actually an advantage: if business slows down, cloud costs decrease proportionally. On-premises CapEx is a sunk cost — you pay for the data center whether you use it or not. The 'ongoing costs forever' concern ignores that on-premises also has ongoing costs (maintenance, refresh cycles, staff) AND the CapEx is locked in regardless of usage."
  },
  {
    tag: "1.4 Cloud Economics", diff: "medium",
    text: "Which AWS tool provides recommendations to help you identify idle and underutilized EC2 instances, helping with rightsizing?",
    options: [
      "AWS Pricing Calculator",
      "AWS Cost Explorer with rightsizing recommendations",
      "AWS Budgets",
      "AWS Cost and Usage Report"
    ],
    answer: 1,
    explanation: "AWS Cost Explorer includes rightsizing recommendations that analyze EC2 usage patterns and suggest instance type changes. AWS Compute Optimizer also provides ML-based recommendations. AWS Pricing Calculator is for estimating costs before deployment, not analyzing existing usage."
  },

  // ── Mixed / Tricky ────────────────────────────────────────────────────────
  {
    tag: "1.1 Benefits of AWS Cloud", diff: "hard",
    text: "Which of the following is NOT one of the 6 advantages of cloud computing as defined by AWS?",
    options: [
      "Trade fixed expense for variable expense",
      "Benefit from massive economies of scale",
      "Eliminate all security responsibilities",
      "Go global in minutes"
    ],
    answer: 2,
    explanation: "The 6 advantages of cloud computing are: (1) Trade CapEx for OpEx, (2) Economies of scale, (3) Stop guessing capacity, (4) Increase speed and agility, (5) Stop spending money on data centers, (6) Go global in minutes. 'Eliminate all security responsibilities' is FALSE — the Shared Responsibility Model means customers retain significant security responsibilities."
  },
  {
    tag: "1.2 Well-Architected Framework", diff: "hard",
    text: "A company wants to reduce the blast radius of a security incident. Which Well-Architected Security design principle does this align with?",
    options: [
      "Enable traceability",
      "Apply security at all layers",
      "Use least privilege access — limit the scope of damage if credentials are compromised",
      "Automate security best practices"
    ],
    answer: 2,
    explanation: "'Reduce blast radius' is directly tied to least privilege and separation of duties. By limiting what each identity/service can access, a compromised credential can only damage a small portion of the system. This is a key Security pillar principle: grant only the permissions needed and no more."
  },
  {
    tag: "1.3 Migration & CAF", diff: "hard",
    text: "Which of the following CORRECTLY maps AWS CAF perspectives to their categories?",
    options: [
      "Business, People, Governance = Technical; Platform, Security, Operations = Business",
      "Business, People, Governance = Business; Platform, Security, Operations = Technical",
      "All 6 perspectives are Business perspectives",
      "Business, Platform, Security = Technical; People, Governance, Operations = Business"
    ],
    answer: 1,
    explanation: "AWS CAF has 6 perspectives in 2 groups: Business perspectives = Business, People, Governance. Technical perspectives = Platform, Security, Operations. This is a common exam trap — memorize: BPG (Business) and PSO (Technical/Platform)."
  },
  {
    tag: "1.4 Cloud Economics", diff: "hard",
    scenario: "A company is evaluating whether to use AWS Lambda (serverless) vs EC2 for a batch job that runs for 5 minutes every hour.",
    text: "From a cloud economics perspective, which option is MORE cost-effective and why?",
    options: [
      "EC2 On-Demand — more control over the environment",
      "EC2 Reserved — cheaper per hour",
      "Lambda — you pay only for the 5 minutes of execution per hour, not the 55 idle minutes",
      "Both cost the same since Lambda and EC2 have similar pricing"
    ],
    answer: 2,
    explanation: "Lambda charges only for actual execution time (5 min/hour = ~8% of the time). EC2 charges for the full hour whether idle or not. For intermittent workloads, serverless is dramatically cheaper. This illustrates the cloud economics principle of paying only for what you use — Lambda takes this to the extreme."
  },
  {
    tag: "1.2 Well-Architected Framework", diff: "hard",
    text: "Which statement BEST describes the relationship between Cost Optimization and the other Well-Architected pillars?",
    options: [
      "Cost Optimization should always be the top priority",
      "Cost Optimization is independent of other pillars",
      "There are trade-offs — for example, adding redundancy for Reliability increases cost; the right balance depends on business requirements",
      "Optimizing costs always improves reliability and performance"
    ],
    answer: 2,
    explanation: "The Well-Architected Framework explicitly acknowledges trade-offs between pillars. Adding Multi-AZ for Reliability costs more. Using larger instances for Performance Efficiency costs more. The goal is to make informed trade-off decisions based on business requirements — not to blindly optimize one pillar at the expense of others."
  }
];

const STORAGE_KEY = 'quiz_domain1_v2';
let current = 0, answered = [], score = 0;

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ current, answered, score }));
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    current = s.current || 0;
    answered = s.answered || [];
    score = s.score || 0;
  } catch(e) {}
}

function buildQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card' + (i === current ? ' active' : '');
    card.id = 'q' + i;
    const scenarioHtml = q.scenario ? `<div class="q-scenario">📋 ${q.scenario}</div>` : '';
    card.innerHTML = `
      <div class="q-meta">
        <span class="q-number">Question ${i+1} of ${questions.length}</span>
        <span class="q-tag">${q.tag}</span>
        <span class="q-diff diff-${q.diff}">${q.diff === 'hard' ? '🔴 Hard' : '🟡 Medium'}</span>
      </div>
      ${scenarioHtml}
      <div class="q-text">${q.text}</div>
      <div class="options" id="opts${i}">
        ${q.options.map((o, j) => `
          <div class="option" id="opt${i}_${j}" onclick="selectAnswer(${i},${j})">
            <div class="opt-letter">${String.fromCharCode(65+j)}</div>
            <div class="opt-text">${o}</div>
          </div>`).join('')}
      </div>
      <div class="explanation" id="exp${i}"></div>
      <div class="nav">
        <button class="btn btn-secondary" onclick="prevQ(${i})" ${i===0?'disabled':''}>← Previous</button>
        <button class="btn btn-primary" id="nextBtn${i}" onclick="nextQ(${i})" disabled>${i===questions.length-1?'Finish Quiz':'Next →'}</button>
      </div>`;
    container.appendChild(card);
  });

  answered.forEach((optIdx, qIdx) => {
    if (optIdx === undefined) return;
    const q = questions[qIdx];
    const opts = document.querySelectorAll(`#opts${qIdx} .option`);
    opts.forEach(o => o.classList.add('disabled'));
    opts[optIdx].classList.add(optIdx === q.answer ? 'correct' : 'wrong');
    if (optIdx !== q.answer) opts[q.answer].classList.add('correct');
    const exp = document.getElementById(`exp${qIdx}`);
    exp.textContent = '💡 ' + q.explanation;
    exp.className = 'explanation show' + (optIdx !== q.answer ? ' wrong-exp' : '');
    document.getElementById(`nextBtn${qIdx}`).disabled = false;
  });
  updateProgress();
}

function selectAnswer(qIdx, optIdx) {
  if (answered[qIdx] !== undefined) return;
  answered[qIdx] = optIdx;
  const q = questions[qIdx];
  const opts = document.querySelectorAll(`#opts${qIdx} .option`);
  opts.forEach(o => o.classList.add('disabled'));
  opts[optIdx].classList.add(optIdx === q.answer ? 'correct' : 'wrong');
  if (optIdx !== q.answer) opts[q.answer].classList.add('correct');
  if (optIdx === q.answer) score++;
  const exp = document.getElementById(`exp${qIdx}`);
  exp.textContent = '💡 ' + q.explanation;
  exp.className = 'explanation show' + (optIdx !== q.answer ? ' wrong-exp' : '');
  document.getElementById(`nextBtn${qIdx}`).disabled = false;
  saveState();
}

function nextQ(i) {
  if (answered[i] === undefined) return;
  document.getElementById('q'+i).classList.remove('active');
  if (i === questions.length - 1) { showResults(); return; }
  current = i + 1;
  document.getElementById('q'+current).classList.add('active');
  updateProgress();
  saveState();
}

function prevQ(i) {
  if (i === 0) return;
  document.getElementById('q'+i).classList.remove('active');
  current = i - 1;
  document.getElementById('q'+current).classList.add('active');
  updateProgress();
  saveState();
}

function updateProgress() {
  document.getElementById('progressFill').style.width = (current / questions.length * 100).toFixed(0) + '%';
  document.getElementById('progressLabel').textContent = `Question ${current+1} of ${questions.length}`;
}

function showResults() {
  document.getElementById('quiz-container').style.display = 'none';
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressLabel').textContent = 'Quiz Complete!';
  const pct = Math.round(score / questions.length * 100);
  document.getElementById('scoreNum').textContent = pct + '%';
  document.getElementById('correctCount').textContent = score;
  document.getElementById('wrongCount').textContent = questions.length - score;
  document.getElementById('totalCount').textContent = questions.length;
  const pass = pct >= 70;
  document.getElementById('resultTitle').textContent = pass ? '🎉 Passed!' : '📚 Keep Studying';
  document.getElementById('resultTitle').className = pass ? 'pass' : 'fail';
  document.getElementById('resultMsg').textContent = pass
    ? `You scored ${pct}% on this harder v2 exam — you're well prepared for Domain 1!`
    : `You scored ${pct}%. This v2 exam is harder than the real thing — review the explanations carefully and retry.`;
  document.getElementById('results').style.display = 'block';
  localStorage.removeItem(STORAGE_KEY);
}

function restartQuiz() {
  current = 0; answered = []; score = 0;
  localStorage.removeItem(STORAGE_KEY);
  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz-container').style.display = 'block';
  buildQuiz();
}

loadState();
buildQuiz();
</script>

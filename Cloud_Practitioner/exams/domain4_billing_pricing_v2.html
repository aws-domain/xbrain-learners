<script>
const questions = [
  {
    tag:"Pricing Models", diff:"hard",
    scenario:"A company runs 10 EC2 instances 24/7. They purchase 10 Standard Reserved Instances for 1 year. Midway through the year, they need to switch to a different instance family.",
    text:"What is the limitation they will face?",
    options:[
      "Standard RIs can be exchanged for any other instance type at any time",
      "Standard RIs cannot be changed — they are locked to the specific instance family, OS, and region purchased",
      "They can sell the RIs on the AWS Marketplace immediately",
      "AWS will automatically convert them to the new instance type"
    ],
    answer:1,
    explanation:"Standard Reserved Instances are locked to the instance family, OS, tenancy, and region. They CANNOT be changed. Options: (1) Sell on the RI Marketplace (for 1-year RIs), (2) Use Convertible RIs next time (which allow changes but offer less discount). This is a key difference between Standard and Convertible RIs."
  },
  {
    tag:"Pricing Models", diff:"hard",
    text:"Which statement about Compute Savings Plans vs EC2 Instance Savings Plans is MOST accurate?",
    options:[
      "They offer the same discount and flexibility",
      "Compute Savings Plans (up to 66% off) apply across EC2, Lambda, and Fargate in any region; EC2 Instance Savings Plans (up to 72% off) are locked to a specific instance family in a specific region",
      "EC2 Instance Savings Plans are more flexible than Compute Savings Plans",
      "Savings Plans cannot be used with Spot Instances"
    ],
    answer:1,
    explanation:"Compute Savings Plans: most flexible — apply to EC2 (any family/region/OS), Lambda, and Fargate. Up to 66% savings. EC2 Instance Savings Plans: less flexible — locked to a specific instance family in a specific region, but offer up to 72% savings. Choose based on how much flexibility you need vs. how much you want to save."
  },
  {
    tag:"Pricing Models", diff:"hard",
    scenario:"A company's S3 bucket stores 50TB of data. They transfer 10TB out to the internet each month and 5TB between AWS Regions.",
    text:"Which data transfer costs will they incur?",
    options:[
      "All transfers are free with S3",
      "Only the 10TB outbound to internet and 5TB cross-region transfers incur charges; inbound to S3 is free",
      "Only the 5TB cross-region transfer incurs charges",
      "All 15TB of outbound transfers are charged at the same rate"
    ],
    answer:1,
    explanation:"AWS data transfer pricing: Inbound (into AWS) = FREE. Outbound to internet = charged (first 100GB/month free, then tiered pricing). Cross-region = charged. Cross-AZ within same region = charged. S3 to CloudFront = free. The 10TB internet egress and 5TB cross-region both incur charges."
  },
  {
    tag:"Pricing Models", diff:"hard",
    text:"A company wants to run fault-tolerant batch processing jobs at the lowest possible cost. The jobs can be interrupted and restarted. Which purchasing option should they use?",
    options:[
      "On-Demand Instances — reliable and predictable",
      "Reserved Instances — committed pricing",
      "Spot Instances — up to 90% discount for interruptible workloads",
      "Dedicated Hosts — for compliance requirements"
    ],
    answer:2,
    explanation:"Spot Instances are ideal for fault-tolerant, flexible workloads that can handle interruptions. They use AWS's spare capacity at up to 90% discount. For batch processing that can checkpoint and restart, Spot is the most cost-effective option. The key requirement is that the workload can tolerate 2-minute interruption notices."
  },
  {
    tag:"Pricing Models", diff:"hard",
    text:"Which of the following CORRECTLY describes how AWS Lambda is priced?",
    options:[
      "Per EC2 instance hour, like regular compute",
      "Per number of functions deployed",
      "Per number of requests AND per GB-second of compute duration",
      "Flat monthly fee regardless of usage"
    ],
    answer:2,
    explanation:"Lambda pricing has two dimensions: (1) Requests: $0.20 per 1M requests (first 1M free/month). (2) Duration: charged per GB-second (memory allocated × execution time). The free tier includes 1M requests and 400,000 GB-seconds per month. This makes Lambda extremely cost-effective for low-traffic or intermittent workloads."
  },
  {
    tag:"Cost Management", diff:"hard",
    scenario:"A company's AWS bill unexpectedly increased by 40% last month. The CFO asks the engineering team to identify which service and which team caused the increase.",
    text:"Which combination of tools should they use?",
    options:[
      "AWS Pricing Calculator — to estimate future costs",
      "AWS Cost Explorer with cost allocation tags filtered by service and team tag",
      "AWS Budgets — to set alerts for next month",
      "AWS Trusted Advisor — to get cost recommendations"
    ],
    answer:1,
    explanation:"Cost Explorer shows historical cost trends by service, region, account, and tags. If the company has cost allocation tags (e.g., Team: Engineering), they can filter to see exactly which team's resources caused the spike. Pricing Calculator is for future estimates. Budgets is for alerts. Trusted Advisor gives recommendations, not historical analysis."
  },
  {
    tag:"Cost Management", diff:"hard",
    text:"What is the difference between AWS Budgets and AWS Cost Explorer?",
    options:[
      "They are the same tool",
      "Cost Explorer analyzes past and current costs with visualizations; Budgets sets thresholds and sends alerts when costs exceed or are forecasted to exceed limits",
      "Budgets shows historical data; Cost Explorer sets alerts",
      "Cost Explorer is free; Budgets costs $5/month"
    ],
    answer:1,
    explanation:"Cost Explorer: retrospective and current analysis — visualize spending trends, identify cost drivers, get rightsizing recommendations. Budgets: proactive — set cost/usage/RI/Savings Plan thresholds and receive alerts (email/SNS) when actual or forecasted spend exceeds limits. Budgets can also trigger automated actions (stop EC2, apply SCPs)."
  },
  {
    tag:"Cost Management", diff:"hard",
    scenario:"A company has 3 AWS accounts: Production, Staging, and Development. They want to track costs separately per account but receive a single monthly invoice.",
    text:"Which AWS feature enables this?",
    options:[
      "Create separate billing accounts for each environment",
      "AWS Organizations with Consolidated Billing — single invoice with per-account cost breakdown",
      "AWS Cost Allocation Tags on each account",
      "AWS Budgets with separate budgets per account"
    ],
    answer:1,
    explanation:"AWS Organizations Consolidated Billing combines all member account charges into a single invoice paid by the management account, while still showing per-account cost breakdowns. It also aggregates usage for volume discounts and shares Reserved Instances/Savings Plans across accounts."
  },
  {
    tag:"Cost Management", diff:"hard",
    text:"A company purchases a 1-year Reserved Instance for an m5.large in us-east-1. They then launch an m5.xlarge in us-west-2. Does the RI discount apply?",
    options:[
      "Yes — Reserved Instances apply to any instance in any region",
      "No — Standard RIs are locked to the specific instance type (m5.large) and region (us-east-1) purchased",
      "Yes — but only at 50% of the normal RI discount",
      "Yes — if the instances are in the same AWS account"
    ],
    answer:1,
    explanation:"Standard Reserved Instances are locked to: instance family+size (m5.large), region (us-east-1), OS, and tenancy. An m5.xlarge in us-west-2 does NOT match — it's a different size AND different region. The RI discount only applies to exact matches. Convertible RIs allow changing instance family/size but still within the same region."
  },
  {
    tag:"Organizations", diff:"hard",
    text:"What is the difference between AWS Organizations SCPs and IAM policies?",
    options:[
      "They are the same thing",
      "SCPs set maximum permission guardrails for entire accounts (even root users); IAM policies grant permissions to specific users/roles within an account",
      "IAM policies apply to all accounts; SCPs apply to individual users",
      "SCPs can grant permissions; IAM policies can only deny"
    ],
    answer:1,
    explanation:"SCPs (Service Control Policies) define the maximum permissions available to ALL identities in an account — including the root user. They don't grant permissions; they restrict what CAN be granted. IAM policies grant/deny permissions to specific users, groups, or roles within an account. SCPs + IAM policies = effective permissions."
  },
  {
    tag:"Organizations", diff:"hard",
    scenario:"A company has 20 AWS accounts in an Organization. They purchase a 3-year Compute Savings Plan in the management account. Account #15 has high Lambda usage.",
    text:"Does the Savings Plan discount apply to Account #15's Lambda usage?",
    options:[
      "No — Savings Plans only apply to the account that purchased them",
      "Yes — Savings Plans are automatically shared across all accounts in the Organization",
      "Only if Account #15 is in the same region as the management account",
      "Only if Account #15 purchases its own Savings Plan"
    ],
    answer:1,
    explanation:"In AWS Organizations, Savings Plans (and Reserved Instances) are automatically shared across all member accounts. The management account's Savings Plan discount applies to any matching usage in any member account. This is a key benefit of Consolidated Billing — maximizing discount utilization across the organization."
  },
  {
    tag:"Support Plans", diff:"hard",
    text:"A company's production database goes down at 2 AM. They need AWS engineers to actively work with them to resolve the issue. What is the MINIMUM support plan required?",
    options:[
      "Basic — free tier",
      "Developer — email support during business hours",
      "Business — 24/7 phone/chat with < 1 hour response for production system down",
      "Enterprise — required for any production workload"
    ],
    answer:2,
    explanation:"Business Support ($100/month minimum) provides 24/7 phone and chat access to Cloud Support Engineers with < 1 hour response time for production system down cases. Developer only offers email during business hours (no 24/7, no phone). Enterprise offers < 15 minutes for business-critical cases and a dedicated TAM."
  },
  {
    tag:"Support Plans", diff:"hard",
    text:"Which statement about AWS Trusted Advisor is MOST accurate?",
    options:[
      "All Trusted Advisor checks are available to all AWS customers for free",
      "Basic/Developer plans get 7 core security and service limit checks; Business/Enterprise plans get 100+ checks across all 5 categories",
      "Trusted Advisor only checks security configurations",
      "Trusted Advisor requires an Enterprise Support plan"
    ],
    answer:1,
    explanation:"Trusted Advisor check availability: Basic/Developer = 7 core checks (S3 bucket permissions, security groups, MFA on root, service limits, etc.). Business/Enterprise = 100+ checks across Cost Optimization, Performance, Security, Fault Tolerance, and Service Limits. The 7 core checks are free for everyone."
  },
  {
    tag:"Support Plans", diff:"hard",
    text:"What is the key benefit of the Enterprise Support plan's Technical Account Manager (TAM) that is NOT available in Business Support?",
    options:[
      "24/7 phone support",
      "Access to Trusted Advisor",
      "A dedicated TAM who proactively monitors your environment, provides architectural guidance, and advocates for your needs within AWS",
      "Faster response times for critical cases"
    ],
    answer:2,
    explanation:"The TAM (Technical Account Manager) in Enterprise Support is a dedicated AWS expert assigned to your account. They proactively review your architecture, alert you to potential issues before they become problems, help with planning, and act as your advocate within AWS. Business Support has no dedicated TAM — you get a pool of support engineers."
  },
  {
    tag:"Support Plans", diff:"medium",
    text:"Which AWS Support plan includes access to Infrastructure Event Management (IEM) for planned events like product launches?",
    options:[
      "Developer",
      "Business — available for an additional fee",
      "Enterprise — included at no extra cost",
      "Basic"
    ],
    answer:2,
    explanation:"Infrastructure Event Management (IEM) provides AWS support engineers who work with you before and during significant events (product launches, migrations, peak traffic events). It's included in Enterprise Support. Business Support customers can purchase IEM for an additional fee."
  },
  {
    tag:"Technical Resources", diff:"hard",
    text:"A developer wants to find pre-built AWS CloudFormation templates and Lambda function code for common patterns. Which resource should they use?",
    options:[
      "AWS Documentation",
      "AWS re:Post community forum",
      "AWS Serverless Application Repository or AWS Solutions Library",
      "AWS Marketplace"
    ],
    answer:2,
    explanation:"AWS Serverless Application Repository contains pre-built serverless applications and Lambda functions you can deploy directly. AWS Solutions Library provides vetted, production-ready reference architectures with CloudFormation templates. AWS Marketplace is for third-party commercial software. re:Post is for Q&A."
  },
  {
    tag:"Technical Resources", diff:"hard",
    text:"What is the difference between the AWS Service Health Dashboard and AWS Personal Health Dashboard (AWS Health)?",
    options:[
      "They show the same information",
      "Service Health Dashboard shows global AWS service status for all customers; Personal Health Dashboard shows events specifically affecting YOUR account and resources",
      "Personal Health Dashboard is only for Enterprise Support customers",
      "Service Health Dashboard is more detailed than Personal Health Dashboard"
    ],
    answer:1,
    explanation:"Service Health Dashboard (status.aws.amazon.com): public, shows overall AWS service health globally — useful for checking if AWS has a widespread outage. Personal Health Dashboard (AWS Health): personalized — shows events, scheduled maintenance, and notifications that specifically affect YOUR account's resources. Much more actionable."
  },
  {
    tag:"Cost Management", diff:"hard",
    text:"Which AWS tool provides the MOST granular billing data, including resource-level cost breakdown, suitable for building custom cost allocation reports?",
    options:[
      "AWS Cost Explorer",
      "AWS Budgets",
      "AWS Cost and Usage Report (CUR) delivered to S3",
      "AWS Pricing Calculator"
    ],
    answer:2,
    explanation:"The AWS Cost and Usage Report (CUR) is the most detailed billing dataset available — hourly/daily granularity, resource-level tags, blended/unblended costs, and RI/Savings Plan amortization. It's delivered to S3 and can be queried with Athena or loaded into Redshift for custom BI dashboards. Cost Explorer is a simplified visualization layer on top of this data."
  },
  {
    tag:"Pricing Models", diff:"hard",
    text:"A company uses Amazon S3 to store 100TB of data. Which pricing dimensions does S3 charge for? (Choose the best answer)",
    options:[
      "Only storage (per GB per month)",
      "Storage (per GB), requests (per API call), and data transfer out — but NOT inbound data transfer",
      "Storage and compute only",
      "A flat monthly fee regardless of usage"
    ],
    answer:1,
    explanation:"S3 pricing dimensions: (1) Storage: per GB per month (varies by storage class). (2) Requests: per 1,000 GET/PUT/LIST requests. (3) Data transfer OUT to internet (inbound is free). (4) Data retrieval fees for Glacier/IA classes. (5) Replication and management features. Understanding all dimensions is important for cost optimization."
  },
  {
    tag:"Organizations", diff:"hard",
    scenario:"A company's management account has $10,000 of Reserved Instance capacity that is only 60% utilized. Member accounts are running On-Demand instances of the same type.",
    text:"What happens to the unused RI capacity?",
    options:[
      "The unused RI capacity is wasted and cannot be applied elsewhere",
      "AWS automatically applies the RI discount to matching On-Demand usage in member accounts within the Organization",
      "The company must manually transfer the RI to member accounts",
      "Unused RI capacity is refunded at the end of the month"
    ],
    answer:1,
    explanation:"In AWS Organizations with Consolidated Billing, unused Reserved Instance capacity is automatically shared with member accounts. If the management account's RI is underutilized, the discount automatically applies to matching On-Demand instances in any member account — maximizing RI utilization and savings across the organization."
  },
  {
    tag:"Cost Management", diff:"hard",
    text:"Which AWS service can automatically take action (e.g., stop EC2 instances) when a budget threshold is exceeded?",
    options:[
      "AWS Cost Explorer",
      "AWS Budgets with budget actions",
      "AWS Trusted Advisor",
      "AWS Config"
    ],
    answer:1,
    explanation:"AWS Budgets Actions allows you to configure automated responses when budget thresholds are breached: apply IAM policies (to restrict launching new resources), apply SCPs (to restrict entire accounts), or target EC2/RDS instances (stop or terminate). This enables automated cost governance without manual intervention."
  },
  {
    tag:"Support Plans", diff:"hard",
    text:"A company needs to ensure their AWS environment follows best practices before a major product launch. Which Enterprise Support feature provides proactive architectural review and launch support?",
    options:[
      "AWS Trusted Advisor automated checks",
      "Well-Architected Tool self-service review",
      "Infrastructure Event Management (IEM) with TAM-led review",
      "AWS Config compliance rules"
    ],
    answer:2,
    explanation:"Infrastructure Event Management (IEM) is an Enterprise Support feature where AWS engineers proactively work with you before and during significant events. The TAM coordinates the review, identifies risks, and AWS engineers are on standby during the launch. This is distinct from self-service tools like Trusted Advisor or the Well-Architected Tool."
  },
  {
    tag:"Technical Resources", diff:"medium",
    text:"A startup wants to get hands-on AWS experience without incurring costs. Which AWS offering allows them to explore services for free within defined limits?",
    options:[
      "AWS Marketplace free trials only",
      "AWS Free Tier — 12 months free for new accounts, always-free services, and short-term trials",
      "AWS Developer Support plan includes free usage",
      "AWS credits are automatically applied to all new accounts"
    ],
    answer:1,
    explanation:"AWS Free Tier has 3 types: (1) 12-month free: services like EC2 (750 hrs t2.micro/month), S3 (5GB), RDS (750 hrs) for new accounts. (2) Always free: Lambda (1M requests/month), DynamoDB (25GB), CloudWatch (10 metrics). (3) Trials: short-term free access to specific services. Essential for learning and experimentation."
  },
  {
    tag:"Cost Management", diff:"hard",
    text:"Which of the following is NOT a valid way to reduce AWS data transfer costs?",
    options:[
      "Use Amazon CloudFront to cache content at edge locations, reducing origin data transfer",
      "Use VPC endpoints to keep traffic within AWS network instead of routing through the internet",
      "Transfer data between EC2 instances in different Regions to avoid AZ transfer fees",
      "Use S3 Transfer Acceleration only when faster upload speed is needed"
    ],
    answer:2,
    explanation:"Transferring data between different Regions is MORE expensive than cross-AZ transfers within the same region — it does NOT reduce costs. CloudFront reduces origin egress. VPC endpoints eliminate NAT Gateway data processing charges and keep traffic on AWS network. S3 Transfer Acceleration adds cost but improves speed — only use when needed."
  },
  {
    tag:"Support Plans", diff:"hard",
    text:"Which AWS Support plan provides the fastest response time for a business-critical system down scenario?",
    options:[
      "Business — < 1 hour response",
      "Enterprise On-Ramp — < 30 minutes response",
      "Enterprise — < 15 minutes response",
      "Developer — < 4 hours response"
    ],
    answer:2,
    explanation:"Response times for critical (business-critical system down) cases: Developer = no critical SLA (business hours email only). Business = < 1 hour. Enterprise On-Ramp = < 30 minutes. Enterprise = < 15 minutes. The faster the response, the higher the support plan cost. Enterprise starts at $15,000/month."
  }
];

const STORAGE_KEY = 'quiz_domain4_v2';
let current = 0, answered = [], score = 0;

function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify({ current, answered, score })); }
function loadState() { try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); current = s.current || 0; answered = s.answered || []; score = s.score || 0; } catch(e) {} }

function buildQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card' + (i === current ? ' active' : '');
    card.id = 'q' + i;
    const scenarioHtml = q.scenario ? `<div class="q-scenario">📋 ${q.scenario}</div>` : '';
    card.innerHTML = `
      <div class="q-meta">
        <span class="q-number">Question ${i+1} of ${questions.length}</span>
        <span class="q-tag">${q.tag}</span>
        <span class="q-diff diff-${q.diff}">${q.diff === 'hard' ? '🔴 Hard' : '🟡 Medium'}</span>
      </div>
      ${scenarioHtml}
      <div class="q-text">${q.text}</div>
      <div class="options" id="opts${i}">
        ${q.options.map((o, j) => `<div class="option" id="opt${i}_${j}" onclick="selectAnswer(${i},${j})"><div class="opt-letter">${String.fromCharCode(65+j)}</div><div class="opt-text">${o}</div></div>`).join('')}
      </div>
      <div class="explanation" id="exp${i}"></div>
      <div class="nav">
        <button class="btn btn-secondary" onclick="prevQ(${i})" ${i===0?'disabled':''}>← Previous</button>
        <button class="btn btn-primary" id="nextBtn${i}" onclick="nextQ(${i})" disabled>${i===questions.length-1?'Finish Quiz':'Next →'}</button>
      </div>`;
    container.appendChild(card);
  });
  answered.forEach((optIdx, qIdx) => {
    if (optIdx === undefined) return;
    const q = questions[qIdx];
    const opts = document.querySelectorAll(`#opts${qIdx} .option`);
    opts.forEach(o => o.classList.add('disabled'));
    opts[optIdx].classList.add(optIdx === q.answer ? 'correct' : 'wrong');
    if (optIdx !== q.answer) opts[q.answer].classList.add('correct');
    const exp = document.getElementById(`exp${qIdx}`);
    exp.textContent = '💡 ' + q.explanation;
    exp.className = 'explanation show' + (optIdx !== q.answer ? ' wrong-exp' : '');
    document.getElementById(`nextBtn${qIdx}`).disabled = false;
  });
  updateProgress();
}

function selectAnswer(qIdx, optIdx) {
  if (answered[qIdx] !== undefined) return;
  answered[qIdx] = optIdx;
  const q = questions[qIdx];
  const opts = document.querySelectorAll(`#opts${qIdx} .option`);
  opts.forEach(o => o.classList.add('disabled'));
  opts[optIdx].classList.add(optIdx === q.answer ? 'correct' : 'wrong');
  if (optIdx !== q.answer) opts[q.answer].classList.add('correct');
  if (optIdx === q.answer) score++;
  const exp = document.getElementById(`exp${qIdx}`);
  exp.textContent = '💡 ' + q.explanation;
  exp.className = 'explanation show' + (optIdx !== q.answer ? ' wrong-exp' : '');
  document.getElementById(`nextBtn${qIdx}`).disabled = false;
  saveState();
}

function nextQ(i) {
  if (answered[i] === undefined) return;
  document.getElementById('q'+i).classList.remove('active');
  if (i === questions.length - 1) { showResults(); return; }
  current = i + 1;
  document.getElementById('q'+current).classList.add('active');
  updateProgress(); saveState();
}

function prevQ(i) {
  if (i === 0) return;
  document.getElementById('q'+i).classList.remove('active');
  current = i - 1;
  document.getElementById('q'+current).classList.add('active');
  updateProgress(); saveState();
}

function updateProgress() {
  document.getElementById('progressFill').style.width = (current / questions.length * 100).toFixed(0) + '%';
  document.getElementById('progressLabel').textContent = `Question ${current+1} of ${questions.length}`;
}

function showResults() {
  document.getElementById('quiz-container').style.display = 'none';
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressLabel').textContent = 'Quiz Complete!';
  const pct = Math.round(score / questions.length * 100);
  document.getElementById('scoreNum').textContent = pct + '%';
  document.getElementById('correctCount').textContent = score;
  document.getElementById('wrongCount').textContent = questions.length - score;
  document.getElementById('totalCount').textContent = questions.length;
  const pass = pct >= 70;
  document.getElementById('resultTitle').textContent = pass ? '🎉 Passed!' : '📚 Keep Studying';
  document.getElementById('resultTitle').className = pass ? 'pass' : 'fail';
  document.getElementById('resultMsg').textContent = pass
    ? `You scored ${pct}% — all 4 domains v2 complete! You're ready for the real CLF-C02 exam.`
    : `You scored ${pct}%. Review the explanations carefully — Domain 4 has many tricky pricing nuances.`;
  document.getElementById('results').style.display = 'block';
  localStorage.removeItem(STORAGE_KEY);
}

function restartQuiz() {
  current = 0; answered = []; score = 0;
  localStorage.removeItem(STORAGE_KEY);
  document.getElementById('results').style.display = 'none';
  document.getElementById('quiz-container').style.display = 'block';
  buildQuiz();
}

loadState(); buildQuiz();
</script>
</body>
</html>
